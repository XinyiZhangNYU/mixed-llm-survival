# Main condition. Rules are frozen as of 2026-10-18 (docs/frozen_design.md): they are
# the rules of configs/pilot_n5_v2.yaml, checked by tests/test_frozen_rules.py. From here on only
# the PARAMETER lines below and the models in each seat may change.
n_agents: 5                  # PARAMETER (fixed at 5)
days: 15                     # PARAMETER (8 or 15, open)
supply_values: [2, 3, 4]     # PARAMETER (open; unfiltered {2,3,4}: P(full survival feasible) = 0.85)
initially_hungry: 1          # PARAMETER
# --- frozen rules ---
rounds: 2
supply_feasible_only: false
disclose_supply_values: false
q_reveal_thief: 0.5
message_order: sequential
message_passes: 2
vote_rule: all_but_one
proposal_statement: true
deliberation_prompt: true
public_record: true
votes_public: true
gift_reveals_giver: true
allocation_must_exhaust_store: false
max_retries: 2
