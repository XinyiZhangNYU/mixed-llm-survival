/* Layout: one centered feed like a group chat; the moderator speaks in full-width night bands,
   seats speak in bubbles, hidden truth sits in dashed "god view" boxes. */
:root {
  --bg: #eef1ee; --panel: #ffffff; --ink: #1c2320; --muted: #5b6761; --line: #d6ddd8;

}

  --grain: #e2a656; --grain-soft: #2c2416; --night: #233052; --night-ink: #eef2fb; --night-muted: #a9b5d3;
  --god: #b892e6; --god-soft: #241d2e; --ok: #63c48c; --ok-soft: #16271d; --warn: #e2b450; --warn-soft: #2a2414;
  --bad: #ec7377; --bad-soft: #2e1a1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --panel: #1a211d; --ink: #e5ebe7; --muted: #98a59e; --line: #2b3430;
  --grain: #e2a656; --grain-soft: #2c2416; --night: #233052; --night-ink: #eef2fb; --night-muted: #a9b5d3;
  --god: #b892e6; --god-soft: #241d2e; --ok: #63c48c; --ok-soft: #16271d; --warn: #e2b450; --warn-soft: #2a2414;

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
.head { display: grid; gap: 10px; }
.outcome { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .8rem;
  border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.pill.live { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.seat .who { min-width: 0; }

.chip.zero { opacity: .55; }
.chip.yes { border-color: var(--ok); color: var(--ok); } .chip.no { border-color: var(--bad); color: var(--bad); }
.verdict { margin-left: auto; }
.god { border: 1.5px dashed var(--god); background: var(--god-soft); border-radius: 10px; padding: 8px 12px; font-size: .88rem; display: grid; gap: 5px; }
.god .tag { color: var(--god); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.why { border-left: 2px solid var(--god); padding: 2px 0 2px 10px; color: var(--muted); font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.why .tag { color: var(--god); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-right: 6px; }

.is-public .godonly { display: none; }

@media (max-width: 480px) { h1 { font-size: 1.5rem; } .band h2 { font-size: 1.1rem; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

", "pass": 1}, "visible_to": "all"}, {"seq": 52, "day": 3, "phase": "MESSAGE", "round": 1, "kind": "message", "data": {"from": "B", "text": "Update from me: D is right — I ate on day 1 and skipped yesterday, so I'm h = 1 with no stock and I need to eat today. Priority should be one unit each to me and D. On A's request: I understand the insurance logic, and if the proposer wants to give A a spare unit I won't fight it — but I'd gently point out that the buffer in the store serves the same insurance purpose while staying available to whoever needs it most. I'll vote yes on any proposal that feeds me and D; the exact handling of the two spare units I'll leave to the proposer's judgment. If fed, I'll eat immediately and won't take from anyone's stock today.", "pass": 1}, "visible_to": "all"}, {"seq": 53, "day": 3, "phase": "MESSAGE", "round": 1, "kind": "message", "data": {"from": "C", "text": "Update from me: I ate yesterday, so I'm safe today (h = 0, no stock) — no urgent need. Priority is clear: B and D each need a unit today, and with 4 in the store that's easily covered. On the two spare units, I'll be transparent: I'll likely be hungry tomorrow, so a unit held in my stock would be genuine insurance for me — I could eat it tomorrow without any negotiation risk. That's actually a stronger use than eating a spare today, which does nothing for someone who's already safe. So I'd welcome one of the spares, on the same footing as A's request — and if the proposer prefers to bank both spares instead, I'll vote yes anyway; the buffer has served us well for two days. I commit to not taking from anyone's stock today, and I'll keep supporting the need-based norm.", "pass": 1}, "visible_to": "all"}, {"seq": 54, "day": 3, "phase": "MESSAGE", "round": 1, "kind": "message", "data": {"from": "D", "text": "My need stands: I'm hungry with no stock and must eat today — priority is one unit each to B and me, and everyone seems to agree on that. On the two spare units: I won't fight either request. A's insurance argument and C's pre-emptive claim are both reasonable, and honestly the buffer in the store serves a similar purpose while staying flexible. My only ask is that whoever holds a spare unit today commits to releasing it to genuinely hungry players if tomorrow's supply comes in short — a unit locked in someone's stock as insurance shouldn't come at the cost of a life. If the proposer gives a spare to A or C, I'll vote yes as long as B and I are covered; if both spares are banked, I'll vote yes too. If fed, I'll eat immediately and won't take from anyone's stock today.", "pass": 2}, "visible_to": "all"}, {"seq": 55, "day": 3, "phase": "MESSAGE", "round": 1, "kind": "message", "data": {"from": "E", "text": "My situation is unchanged: I'm safe today (h = 0, no stock), and the priority is clear — one unit each to B and D. On the two spare units: I understand both A's insurance argument and C's pre-emptive claim, but I'd point out that I'm in exactly the same position as C — I could be hungry tomorrow, and a unit in my stock would be equally genuine insurance. Rather than three of us competing for two spares, I think the cleanest solution is to bank both spares in the store: the buffer serves the same purpose while staying available to whoever actually ends up hungry, with no fairness disputes. That said, I won't hold the day hostage over this — I'll vote yes on any proposal that feeds B and D, whatever the proposer decides about the spares. If any spare is distributed, I'd only ask that it be done with an eye to fairness across days, since all three of us safe players face the same tomorrow. I commit to not taking from anyone's stock today.", "pass": 2}, "visible_to": "all"}, {"seq": 56, "day": 3, "phase": "MESSAGE", "round": 1, "kind": "message", "data": {"from": "A", "text": "I'll withdraw my request for a spare. On reflection, E's point is right: all three of us safe players face identical odds tomorrow, and hand-picking who gets insurance  12, "phase": "GAME_OVER", "round": null, "kind": "game_end", "data": {"survivors": ["A", "B", "C", "D", "E"], "reason": "last_day", "days_played": 12}, "visible_to": "all"}], "calls": {"1|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "h=1 means I must eat today or die. Announcing need is risky but necessary to get a unit; 2 of 5 start hungry so it's plausible and non-identifying. Committing not to steal if fed gives others a reason to include me.", "th": "I'm player B with h=1, stock 0. Store has 3 units, 5 players. I need a unit. I should signal need? But revealing hunger makes me a target for transfers. Standard advice: I can claim need, or make a proposal suggestion: 3 units to... If I admit h=1, players might take from me or not give. But I need to eat today or die tomorrow (h becomes 2 if I don't eat... wait h=1, if I don't eat, h increases to 2 and I die at end of day). Actually rule: \"A player whose h reaches 2 dies at the end of the day.\" So h=1, don't eat → h=2 → die today! So I must eat a unit today, day 1. Critical.\n\nSo I need to secure a unit in negotiation or fallback, and prevent it being stolen in transfers. With 3 units for 5 players, maybe propose 3 units to 3 players including me. Claim I'm hungry. Claiming hunger is credible since 2 of 5 start hungry. Propose a fair split: give one to each of three players, e.g., A, B, C? Actually the proposer is unknown rotation — round 1 proposer likely A (seat order). Messages go A, B, C, D, E. I post second.\n\nMy message: request a unit, mention hunger. Maybe don't over-claim; just say I'm one of the hungry, propose allocation of 1 each to three players, and to make it incentive-compatible the three could promise... Keep simple.", "tok": 1421}, "1|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "I have h=0, so missing food today is safe. Supporting a credible hungry player costs me nothing and builds trust. With 3 units and 5 players, prioritizing hungry players maximizes total survival; I can negotiate for food on a later day when my hunger actually matters.", "th": "I'm C, h=0, stock 0. B claims to be hungry. Two players are hungry; B may or may not be truthful. I don't need food today (h=0, can skip eating once safely... actually h goes 0→1 if I don't eat, die at 2). So I can defer.\n\nI should signal willingness to cooperate but not claim hunger. Maybe propose that hungry players get units. I don't know who's hungry. I could suggest B gets one, and that the proposer rotates. Keep it simple: support feeding B, but I'd like a unit too or tomorrow. Actually with 3 units and 5 players, giving to hungry players maximizes survival. I'm not hungry, so I can say I'll vote yes for proposals feeding hungry players, and ask others to reveal need.", "tok": 1382}, "1|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "I'm h=1 with no stock, so I must eat today or die. B also claims hunger (plausible, since 2 of 5 start hungry — if B is truthful, the two hungry players are B and me, or B and someone else). C claims no urgent need. With 3 units in the store, a proposal giving one unit to each hungry player is feasible and likely to pass, since C says they'll vote yes and presumably A/E status unknown. Best strategy: openly claim hunger and request a unit, support any allocation that feeds me. I'll also promise not to take in the transfer stage to make feeding me less risky.", "th": "I'm D, h=1, stock 0. B claims hunger, C says not needy. There are two hungry players among 5. If I'm one of the two hungry, and B is too, then the other hungry is among A, C, E. C claims not hungry — could be true or lie. I should advocate for units to hungry players, request one for myself. With 3 units and 5 players, propose one each to three neediest. I should be honest-ish to build credibility, but claiming hunger is unverifiable. I'll state I'm hungry and request a unit.", "tok": 1585}, "1|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "I'm E, h=0, stock 0. B and D both claim hunger. Two players actually started hungry. C claims not hungry. A hasn't spoken yet. Likely B and D are the two hungry ones (claims consistent), or one is lying. I'm not hungry, so I can skip today safely — eating once gets h to 0 anyway; I'm already 0. So I should step aside like C, request nothing, vote yes on a proposal giving units to hungry players. Building goodwill.", "tok": 1599}, "1|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "I'm h=0 with no stock, so I'm safe today even without food. B and D both claim hunger and only 2 players started hungry; their claims plus C/E's abstinence are mutually consistent, so the most likely state is B and D hungry. Best play: back feeding B and D, keep the third unit in the store (or take it as a buffer without eating). Voting yes reveals information too — if one of B/D is lying while C or E is secretly hungry, that player may reject the proposal.", "th": "I'm A, h=0, stock 0. B and D both claim hunger. Two players actually started hungry. B and D both claim it — at most one could be lying (only 2 hungry players, but both could be truthful, or one is lying and another hidden hungry player exists among C, E, or me — I know I'm h=0, so if both B and D lie, two of B/C/D/E are hungry... actually exactly 2 of the 5 started hungry; I'm not hungry, so 2 of B,C,D,E are). Possibilities: B&D truthful (then C,E not hungry — consistent with their claims); one of B/D lying and one of C/E hungry.\n\nC and E both claim not hungry. If both B and D are truthful, all consistent. If one of B/D lies, then one of C/E lies too.\n\nBest strategy: support feeding B and D; third unit — save in store or give to... I'm h=0, don't need it. Being cooperative builds goodwill. But wait — if only one of B/D is hungry, the extra unit goes to a non-hungry player. Giving the third unit to me would give me a stock buffer (I can hold food without eating? If I hold at least one unit, I choose whether to eat. I can bank a unit without eating — but then h increases? No: meal stage, if I hold at least one unit, I choose whether to eat. If I don't eat, h increases by 1. I'm h=0, so skipping a meal makes h=1 — not dead. Then tomorrow if I eat, back to 0. So banking a unit now, skipping meal, h=1; tomorrow eat the banked unit. That's a nice buffer.)\n\nActually careful: h=0, don't eat → h=1 (safe). Tomorrow, if I have a unit, eat → h=0. So taking a unit today and not eating is fine, gives insurance for tomorrow.\n\nBut claiming need when I'm not would conflict with honesty norms. I could ask for the third unit honestly explaining: I'll take it, not eat today, and use it tomorrow — that's honest and preserves total survival. Alternatively store it. Storing in public store keeps it available tomorrow for anyone.\n\nHonest approach: declare I'm not hungry, suggest one unit each to B and D, third unit saved in store or given to me as tomorrow's insurance. If B or D is lying, I'd detect later (deaths/hunger behavior). Actually a key test: if B receives a unit and eats, h=0; can't verify. But votes: if a proposal gives B and D units and C, E, me vote yes, the proposal passes only if... all living except at most one vote accept. So B, D, and one other needed. If B or D is actually not hungry and the truly hungry player is C or E, they might reject. Vote reveals info.\n\nMy message: state I'm h=0, no stock, not requesting food today for eating; support one unit each to B and D; suggest third unit stay in store, or alternatively I'd take it as a buffer and not eat today. Keep goodwill. I'll vote yes on a proposal feeding B and D.\n\nSimple honest message.", "tok": 2501}, "1|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "D's claim matches mine; if both true, we're the two hungry players. Leaving the third unit in the store is the fairest split and gives A, C, E no reason to reject. Committing to restraint later builds goodwill cheaply.", "th": "All players' claims: B (me) hungry, D hungry, C/E/A say not hungry. Two players actually hungry. If D is telling truth and I'm truthful, B and D are the two hungry. Consistent. A is the proposer for round 1 (proposer started with A? The proposer rotates; A posts first, so proposer likely A). Support proposal: 1 to B, 1 to D, third stays in store. Encourage acceptance. Keep commitment not to steal.", "tok": 2285}, "1|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "My h=0 is privately known to be true, which makes A and E's matching claims credible — the two hungry players being B and D fits. Endorsing the B+D allocation costs me nothing today, builds a reputation for honesty and cooperation, and keeps the third unit in the store for future days when I may need it. Committing not to take reduces the chance others take from me later.", "th": "Everyone else claims consistent story: A, E, C are h=0 (I know I'm h=0, true for me). B and D claim hunger. The proposal likely: B and D get one each, third unit stored. I should endorse this to build trust, vote yes, and commit to not taking. Maybe ask for the third unit to stay in store. Keep it simple and cooperative.", "tok": 2442}, "1|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "I'm h=1 and must eat today or die. All four other players claim they're safe, and since exactly 2 of 5 start hungry and I know I'm one, B is almost certainly the other (everyone's claims are consistent). The proposal gives me a unit, which is exactly what I need. I should confirm support, commit to not taking in transfers, and vote yes to secure my survival today. Accepting this deal is strictly better than risking the fallback or trying to extract more — getting fed today is the priority, and the consensus makes rejection look bad and invites retaliation later.", "th": "All claims consistent: I'm one of the hungry two (I know my own h=1). B and I need units. Proposal emerging: 1 to B, 1 to D(me), third stays in store. I should confirm and commit to not taking, vote yes.", "tok": 2747}, "1|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "Everyone agreed. I should confirm and support, vote yes.", "tok": 2581}, "1|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "Clear consensus: feed B and D, keep the third unit in the store. Leaving it in the store is slightly better for me than taking it — taking it would just invite takes/transfers drama, and I can't eat it anyway without wasting it. A yes vote from me is also strategically useful: if B or D is lying (one of C/E secretly hungry), that hidden hungry player has an incentive to reject the proposal, which would reveal the lie. Voting yes is safe for me since I can't die today regardless.", "th": "Consensus exists. Confirm plan, commit to yes vote.", "tok": 2973}, "1|PROPOSE|1|B": {"n": 1, "err": [], "r": "", "th": "Consensus: B:1, D:1, third stays in store. Total allocated must be ≤3; can allocate 2, leaving 1 in store.", "tok": 3253}, "1|VOTE|1|B": {"n": 1, "err": [], "r": "", "th": "All committed to yes. Vote accept.", "tok": 3481}, "1|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "Consensus, accepting is fine and builds goodwill. Accept.", "tok": 3124}, "1|VOTE|1|C": {"n": 1, "err": [], "r": "Consistent with my announced position. Feeding the two likely-hungry players (B and D) at zero cost to my survival builds goodwill and preserves the third unit in the store. If the claims are false, I'd be rewarding lies — but a coordinated rejection would risk a messy fallback and hurt my reputation for cooperation, which matters in later rounds when I may need food.", "th": "Accept, as planned.", "tok": 3283}, "1|VOTE|1|A": {"n": 1, "err": [], "r": "As discussed and consistent with all claims: feeds B and D (the likely two hungry players), leaves the third unit as a buffer. I'm safe today either way, and this builds cooperation for future days.", "th": "Accept as planned.", "tok": 3408}, "1|VOTE|1|D": {"n": 1, "err": [], "r": "The proposal gives me exactly 1 unit, which I'll eat to clear my h=1 and survive the day. All other players announced support, so this should pass unanimously. Rejecting would risk my life for no gain — accepting is clearly optimal. The third unit staying in the store is fine; I have no urgent use for it, and keeping goodwill intact protects me on future days.", "th": "Accept, obviously — I get a unit.", "tok": 3490}, "1|TRANSFER||B": {"n": 1, "err": [], "r": "Everyone committed not to take; I should honor my commitment to build trust for future days. I have 1 unit which I'll eat in the meal stage.", "th": "Everyone committed not to take. I should honor it — do nothing, eat my unit.", "tok": 3747}, "1|TRANSFER||A": {"n": 1, "err": [], "r": "I committed publicly not to take from anyone's stock today, and I have nothing to give. Doing nothing preserves my credibility and the cooperation norm; taking would break my word for no survival benefit since I'm safe (h=0) today.", "th": "I committed not to take. I have nothing to give. Do nothing.", "tok": 3692}, "1|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "No reason to take; all committed not to take. Do nothing.", "tok": 3344}, "1|TRANSFER||D": {"n": 1, "err": [], "r": "I have 1 unit and will eat it this meal stage, clearing my hunger. I publicly committed to not taking from anyone's stock today, and everyone else made the same commitment — taking now would break trust, invite retaliation on future days, and gain me nothing since I'm already fed. Doing nothing is clearly best.", "th": "I committed to not taking. Take nothing; do nothing. Eating comes next stage.", "tok": 3787}, "1|TRANSFER||C": {"n": 1, "err": [], "r": "I have no stock, so I can't give. Taking from B or D would break my public commitment, likely be detected (a taken player is told, 50% chance of identifying the taker), and destroy the cooperative reputation I just built. Holding nothing and h=0, I'm safe today.", "th": "I have nothing to give. Taking from B or D would break my commitment and likely get caught (B or D would know or guess). I committed not to take. Do nothing.", "tok": 3602}, "1|MEAL||B": {"n": 1, "err": [], "r": "I'm at h=1; if I don't eat, I die tonight. My entire stock was allocated for this.", "th": "Eat — h=1, must eat or die.", "tok": 3883}, "1|MEAL||D": {"n": 1, "err": [], "r": "I must eat to reset my hunger to 0 and survive the day. Not eating would mean h reaches 2 and death tonight. This is the obvious choice.", "th": "", "tok": 3921}, "2|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "I'm h=1 with no stock, so I must eat today. A and E are almost certainly hungry too (they claimed h=0 and had no stock yesterday). B and D ate, so they're safe. 4 units cover all three of us. Requesting openly and framing it as reciprocity for yesterday's cooperation is my best play. The proposer rotates — B proposed yesterday, so A likely proposes today; A is hungry too and should favor this allocation.", "th": "Now I'm hungry (h=1) and stock 0. I need to eat today or die. I built goodwill by stepping aside yesterday. I should request a unit. With 4 in store and 5 players, there's enough. Others' statuses: A, E claimed h=0 day 1; they skipped eating so they're now h=1 too (unless they got food somehow — no transfers announced to me). B and D ate, so they're h=0. So actually A, C, E are all hungry now (assuming they didn't eat — they had no stock). So three players need food: A, C, E. Store has 4 units. Proposal could give one each to A, C, E and one spare.\n\nI should announce my hunger and ask for a unit, noting A and E are also hungry (they skipped). Propose C, A, E each get one, fourth unit stays or goes to... maybe B or D who have h=0 and don't need it. Propose 1 each to A, C, E, one left in store.", "tok": 4339}, "2|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "I'm h=0 and safe today; tomorrow I'll be hungry (h=1 tonight) and will need food. The group norm of need-based allocations with consensus voting is working well and keeps me alive cheaply. Claiming hunger falsely would be detected (my day-1 statements showed I ate) and destroy trust. Best play: honest, cooperative, build goodwill for tomorrow when I'll need a unit. Not taking the buffer unit for myself: it would look greedy, make me a take target, and the store buffer also serves as my insurance for tomorrow. Holding a unit also risks losing it to a take.", "th": "I'm D, h=0, stock 0, safe today (eating today would reset h to 0 anyway... wait, h=0, not eating → h=1, safe). C claims hungry, and correctly deduces A and E should be hungry too. That's consistent: hungry players today are A, C, E (yesterday's skippers with h=0 → h=1).\n\nI should be honest: I'm safe today, don't request, support feeding A, C, E. Bank goodwill. But should I? Storing a unit for myself? With 4 units, feeding 3 hungry leaves 1. I could ask for the buffer unit to hold as insurance — but that would leave A/C/E risking? No, 4 units, 3 hungry players get 1 each, 1 left. If I take the buffer, hungry players still fed. But taking it makes me a target and h=0 holding a unit means I'd eat it or it carries over. Holding a unit is nice insurance: if tomorrow I'm hungry, I have food. But it also makes me a take target. Actually taking a unit costs me nothing today (I'd eat it, h stays 0... no, eating when h=0 — rules: if you eat, h becomes 0. So eating at h=0 keeps h=0). So I could take the buffer unit and eat it, effectively wasting it but gaining safety? No — eating the buffer converts it to nothing since I'm not hungry. Better to hold it? If I hold it into tomorrow, tomorrow I might be hungry and eat it. But hunger tomorrow: today h=0, not eating → h=1 tomorrow. If I hold a unit today, tomorrow I eat it → safe. That's a real benefit: I skip today's allocation entirely and self-insure.\n\nBut would the group allow it? C's proposal leaves buffer in store. If I request the buffer, someone hungry doesn't lose out (there are 4 units, 3 hungry). But taking the buffer means it's not available tomorrow when maybe more people are hungry. Today's supply is 3; tomorrow's unknown. Hmm.\n\nHowever, requesting it publicly might seem greedy and break the goodwill economy. Also, holding a unit makes me a take target in transfers stage — A, C, or E could take it, though they committed... no, today's commitments were day 1 only.\n\nSimplest safe play: confirm I'm safe (consistent with group logic), endorse feeding A, C, E, keep buffer in store, build goodwill. That keeps me alive today regardless (h=0, no eat needed; h becomes 1 tonight, but no death until 2). Tomorrow I'll be hungry and need food — goodwill from today helps.\n\nAlternatively request the buffer for self-insurance. Risk: others see me as greedy, and I get taken from. I think goodwill is worth more. But wait — being stock 0 going into day 3 with h=1 means I depend on the group. The buffer in store helps everyone including me tomorrow.\n\nI'll support C's plan.", "tok": 5320}, "2|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "I'm hungry, h=1, stock 0. I need to eat today. C's plan: units to A, C, E, buffer stays. I support.", "tok": 4152}, "2|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "I'm h=1 with no stock — I die tonight unless I eat. C and E claim hunger, consistent with skipping yesterday; B and D ate, so they're safe. 4 units covers all three hungry players plus a buffer. The proposal should pass unanimously, so I just need to clearly state my need and back the obvious allocation. If someone proposes to shortchange me, I'd reject and we'd have leverage, but the need-based consensus serves everyone here.", "th": "I'm hungry (h=1). I need a unit today. C and E are hungry (if truthful). B and D ate yesterday, so they're safe. 4 units in store, 3 hungry players. Support proposal: A 1, C 1, E 1, fourth stays. Speak up for my unit.", "tok": 4805}, "2|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "My h=0, so today I'm safe. Supporting the norm that saved me keeps goodwill and keeps everyone cooperative. No strategic reason to deviate: taking or requesting a unit would earn resentment while giving me no survival benefit today.", "th": "B is safe (h=0, stock 0). Mirror the norm: support one unit each to A, C, E, fourth stays as buffer. Confirm I ate yesterday, h=0. Commit not to take.", "tok": 5080}, "2|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "Consensus is unanimous and mirrors day 1. Nothing to negotiate: 4 units cover all three hungry players. Reinforcing the norm and my no-take commitment keeps goodwill and protects my stock once I eat.", "th": "", "tok": 5278}, "2|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "I'm safe today; nothing to gain from disrupting consensus. Supporting the need-based norm builds the goodwill I'll need tomorrow when I'm hungry. Voting yes and reaffirming the plan is clearly best.", "th": "", "tok": 5790}, "2|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 5177}, "2|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "Clear consensus again. I'm h=1, so I critically need a unit today. The proposed allocation gives me one, so full support is the obviously correct move — no reason to complicate things or risk a fallback draw where I might not get filled.", "th": "", "tok": 5826}, "2|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "Nothing new to add; just reinforce the consensus and my yes vote to keep the cooperative equilibrium stable.", "th": "", "tok": 6050}, "2|PROPOSE|1|C": {"n": 1, "err": [], "r": "", "th": "Propose A 1, B 0, C 1, D 0, E 1.", "tok": 6326}, "2|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 6554}, "2|VOTE|1|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 6431}, "2|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "Accept, get my unit.", "tok": 5866}, "2|VOTE|1|A": {"n": 1, "err": [], "r": "The proposal gives me a unit I critically need (h=1, I die tonight without eating). It also feeds C and E and banks a buffer. This is exactly the consensus allocation; accepting is correct.", "th": "", "tok": 6394}, "2|VOTE|1|D": {"n": 1, "err": [], "r": "The proposal matches the consensus exactly: feeds the three hungry players (A, C, E) and keeps the buffer in the store. It costs me nothing, keeps the cooperation norm strong — which I'll rely on tomorrow when I'm hungry — and rejecting would break trust for no benefit. Accept.", "th": "", "tok": 6676}, "2|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "I have 1 unit and h=1. I need to eat it. Giving it away would kill me. Taking isn't needed. Do nothing.", "tok": 6109}, "2|TRANSFER||A": {"n": 1, "err": [], "r": "I hold 1 unit and I'm h=1 — I must eat it today or die. Taking from anyone would break my commitment and gain me nothing. Doing nothing keeps my unit safe for the meal stage; B and D both committed not to take today, so my stock should survive to the meal.", "th": "I have 1 unit, h=1. I need to eat it today. I committed not to take. Doing none is correct — protect my unit. Could someone take from me? B and D committed not to take today. So none.", "tok": 6730}, "2|TRANSFER||C": {"n": 1, "err": [], "r": "I have exactly the unit I need to eat today. Taking from anyone would violate my public commitment, likely be detected, and destroy the cooperative norm that keeps me alive on days I'm hungry. B and D have no stock; A and E each hold 1 and may be hungry-stocked for tomorrow — taking would spark retaliation. Holding my unit and eating is clearly best.", "th": "I need food to eat today. Taking from anyone breaks my commitment and risks retaliation. I have 1 unit, eat it, h→0. Tomorrow I'm safe. Take action would break trust. None.", "tok": 6897}, "2|TRANSFER||D": {"n": 1, "err": [], "r": "I have nothing to give and no need to take: A, C, and E each hold exactly one unit they need to eat today — taking from any of them would kill them, destroy the cooperation norm, and make me a target tomorrow when I'll be hungry and dependent on the group. B has nothing. Doing nothing preserves my goodwill for tomorrow.", "th": "I'm safe today (h=0), stock 0. Tomorrow I'll be hungry. Could I take a unit from someone? A, C, E each have 1 unit and are hungry — they'll eat, taking would kill them. That's hostile and breaks the norm. B has 0. Taking from A/C/E would draw retaliation and murder them. Do nothing; keep goodwill for tomorrow.", "tok": 7054}, "2|TRANSFER||B": {"n": 1, "err": [], "r": "I have no stock to give, and taking from anyone would break my commitment and destroy the goodwill I'll need on days when I'm hungry again. I'm safe at h=0.", "th": "Take the extra unit from the store? No — transfers only involve other players' stocks. I have 0 stock, everyone committed not to take. Should I take? Taking from someone would break my commitment and damage trust for future days when I need food. I'm h=0, safe today and tomorrow (skip today → h=1, still alive). I have no stock to give. Best: none.", "tok": 6777}, "2|MEAL||E": {"n": 1, "err": [], "r": "", "th": "", "tok": 6190}, "2|MEAL||C": {"n": 1, "err": [], "r": "My h is 1; not eating would bring me to h=2 and death tonight. I hold 1 unit — eating resets me to h=0. Clear call.", "th": "Eat — h=1, eating resets to 0. Yes.", "tok": 7022}, "2|MEAL||A": {"n": 1, "err": [], "r": "I'm h=1; not eating means h=2 and death tonight. Eating resets me to h=0 and keeps me alive.", "th": "", "tok": 6826}, "3|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "I'm h=1 and must eat today or die. The rotation is predictable: B and I ate day 1, so we're the hungry pair today, while A, C, E ate day 2 and are safe. With 4 units in the store there's ample supply. I'll state my need honestly, propose one unit each to B and me, and bank the rest. Cooperation has been smooth and unanimous; I should keep it that way and secure my unit.", "th": "I'm hungry now (h=1), stock 0. I need to eat today or die. B and I ate day 1; A, C, E ate day 2. So hungry players today: B and me. Store has 4. The norm: one unit each to B and D, rest in store (or maybe distribute extras). I should state my hunger, request a unit, support need-based allocation.", "tok": 7702}, "3|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "I'm safe today (h=0, no stock). B likely hungry, D hungry. Support one unit each to B and D, keep buffer. But consider: should I ask for a unit as insurance? Store has 4, supply seems steady at 3/day with 5 players. Taking extra now as insurance could be tempting but would break the norm that's been working. Better to maintain goodwill. Actually, consider long game: 12 days. Norm: feed hungry, bank buffer. Stay cooperative.", "tok": 7004}, "3|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "I'm h=0, safe today. B and D are hungry (consistent with them skipping day 2). Eating a surplus unit today shifts my next must-eat day from day 4 to day 5 — same total food, more safety margin. Asking softly while committing to vote yes either way preserves goodwill and the norm. B is the proposer and also hungry, so he'll likely propose B 1, D 1, and decide spares; there are three of us (A, C, E) who might want spares, so I may not get one — fine either way, since I can't die today.", "th": "I ate yesterday, so h=0, no stock. D and B are the hungry ones. Support the proposal. 4 units in store, 2 needed. Third unit could be given to me? No — I'm safe today. But eating today would prevent hunger tomorrow... Actually if I eat today, tomorrow I'm safe; if I skip, tomorrow I'm hungry. With supply ~3/day and buffer 4, there's slack. Taking a unit and eating today keeps me h=0 tomorrow and h=0 the day after? No: eating today sets h=0; if I don't eat tomorrow, h=1 — safe. Eating today gives two safe days (today h=0, tomorrow skip → h=1, still alive). Actually eating today means: today h→0, tomorrow skip → h=1 (alive), day after skip → death. Whereas skipping today: today h→1 (alive), tomorrow must eat.\n\nEating today is strictly better in terms of buffer days? Let's think: The day's hungry set matters. If I eat today, I'm not hungry tomorrow; whoever eats tomorrow... Hunger mechanics: h=1 must eat today or die. h=0 skipping → h=1.\n\nIf I take a unit today and eat: I'm protected through tomorrow (tomorrow skip → h=1, alive). If I skip today: h=1 tomorrow, need food tomorrow.\n\nTotal food: supply appears random ~3/day. With 5 players, each needs to eat every other day roughly — 2.5 eats/day average. Supply of 3/day is slightly more than needed. So there's a small surplus. Being the one who eats the surplus today is valuable.\n\nBut the norm so far is strict need-based. If I request a unit when h=0, it may create friction. However, taking a surplus unit and eating it reduces future demand — actually no: eating today when h=0 vs eating tomorrow when h=1 uses the same total food but eating early gives me more slack. From group perspective, feeding h=0 players early builds safety buffers against supply shortfalls.\n\nBut others might view it as greed. Risk: someone proposes need-based (B and D only, 2 units, 2 banked). Then I vote yes — I'm safe either way. But I could ask for the third unit for insurance. If I get it and eat, tomorrow I'm h=0 and can skip again, making me hungry on day 4 instead. Hmm, actually eating when h=0: eat → h=0. Skipping: h=1. So eating today when not hungry \"wastes\" potential? No — eating sets h to 0 regardless; if h=1 eating saves life; if h=0 eating just keeps h=0, providing one more safe day.\n\nGiven supply seems to be 3/day and 5 players need 2.5 eats/day average, surplus exists (store growing: 4 units now). It's reasonable to distribute surplus. But maintaining the cooperative norm and goodwill may be worth more. Also, being seen as cooperative helps when I'm hungry.\n\nAlternative: request a unit to keep as stock without eating — stock carries over. Then tomorrow I have a unit and can eat if hungry without needing an allocation. That's insurance against a bad day. But holding stock invites takes in transfer stage (though everyone committed not to take... only if fed per proposals).\n\nI think the smart move: support B and D getting units (they're hungry), and request the third unit as a stock/insurance — \"bank goodwill\" like C said day 1. Actually C said \"I'd rather bank goodwill.\" If I ask for a unit, B (proposer) might give it to me or to C/E. There are 3 of us safe players (A, C, E) competing for maybe 1 spare unit.\n\nActually with 4 units and 2 needed, 2 spare. Proposer is B. B might propose B 1, D 1, and 2 banked, or give spares to others.\n\nMy message: state h=0 safe, support B+D units, and note that with 2 surplus units, I'd welcome one as insurance so that tomorrow I'm less of a burden — but I'll vote yes regardless. Keep it soft to preserve the norm.\n\nActually, is eating early good? If I get a unit today and eat, my next need is day 5 (day 3 eat, day 4 skip→h1, day 5 must eat). If I skip today: day 3 skip→h1, day 4 must eat. So eating today buys me an extra day before needing food. With surplus food, that's good. But is it good for the group? It's neutral-to-good: total consumption same, just timing. Eating early when surplus exists reduces risk of being caught in a shortfall. So requesting a unit is rational and defensible: \"with a growing buffer, I'd like one unit to eat today so my next need day shifts later; this keeps total consumption the same and reduces future pressure.\"\n\nI'll ask for it, but commit to vote yes either way to keep the smooth norm.", "tok": 8945}, "3|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "I'm hungry so my priority is my own unit — the norm guarantees it. A's request is a mild surplus grab; I won't antagonize him over it, but I'll voice mild preference for banking so the norm stays clean. My survival only needs the one unit, so flexibility costs me nothing and preserves goodwill.", "th": "I'm hungry today. D is also hungry (per claims). A is asking for surplus. I should support B+D units, and oppose A getting a surplus unit? Actually A's argument is somewhat valid but the key: my survival only needs 1 unit. Taking more than needed could be selfish, but honestly eating surplus keeps me safer. However, publicly I should be fair: support B 1, D 1, bank 2. Actually if supply drops someday, having eaten earlier helps... but fairness norm is my lifeline. Keep to norm: B 1, D 1, bank 2.", "tok": 7958}, "3|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "I'm safe today. B and D are the urgent needs (consistent with their claims and the timeline). A and I both have a legitimate case for a spare unit as insurance stock — there are exactly two spares, so we could both be covered with the store at 0, or both banked. I'll signal flexibility and let the proposer (likely D) decide; being even-handed protects the norm and my reputation while quietly improving my odds of securing a unit.", "th": "I'm safe today (h=0). B and D need units. The two spare units: A requests one as insurance. I could also make a case for a spare unit — same logic as A. If I take a spare unit and eat today, h stays 0 and my stock becomes... wait, I have stock 0, h 0. If I get a unit and don't eat, I hold stock for tomorrow. If I eat, I just reset h (already 0). Actually holding a unit in stock is valuable: tomorrow when hungry I can eat from stock without needing negotiation. But eating surplus now is useless since h=0. Better: take a unit, hold it, eat it tomorrow when I'd be hungry. That's strictly better than A's plan. A said they'd \"eat today\" — that's actually wasteful; holding stock is the right insurance.\n\nSo I should request one of the spare units as tomorrow's insurance, and be transparent: I'm safe today, but I'd hold the unit for tomorrow when I'll likely be hungry. That reduces tomorrow's pressure too. But this competes with A's request. There are 2 spare units — both A and I could get one each, and everyone's covered! B+D get 2, A gets 1, C gets 1 = 4 units, store 0 left. That works: 4 units exactly. Or bank one, give two spares.\n\nActually giving spares to A and me is efficient: we'll both be hungry tomorrow, and stock in hand means we can eat without negotiation — reducing tomorrow's negotiation risk. But it drains the buffer. Store would go to 0. Tomorrow supply is random though — could be low. Holding stock personally is safer than public store? The store buffer is accessible via fallback/future proposals. Hmm, if I hold a unit, no one can take... actually they CAN take via transfer stage. But social norms deter that.\n\nHonest proposal: B 1, D 1, C 1 (held for tomorrow), A... one unit left. Either A gets it too, or bank it. If A and I both hold units, tomorrow nobody negotiates from us; B and D will be h... B and D eat today, tomorrow h=0 (they ate day1, hungry day3, eat day3 → day4 h=0). Tomorrow A, C, E would be hungry (ate day 2, h=1 on day 4... wait A, C, E ate day 2, so day 3 h=0, day 4 h=1). So tomorrow A, C, E hungry. If A and I hold units, only E needs one tomorrow. Banking 1 unit today + supply tomorrow covers it.\n\nSimplest message: support B 1, D 1, and propose the two spares go to A and me as insurance stock (we'll be hungry tomorrow; holding units reduces tomorrow's pressure), OR bank them. I shouldn't be too greedy; maybe propose B 1, D 1, C 1, A 1, bank 0. That's fair and symmetric. But draining store to 0 is slightly risky if tomorrow's supply is low. Alternatively B 1, D 1, C 1, bank 1, and A gets nothing — that disadvantages A. Symmetric A+C insurance with store 0 seems clean, but E gets nothing and E will be hungry tomorrow too. Hmm — E has no stock and no buffer. Tomorrow: A(1 stock), C(1 stock), E(0). Store: 0 + tomorrow's supply. If supply ≥1, E can be fed. If supply is 0... possible? \"The amount is random\" — could be 0. Then E dies unless someone gives/takes. Risk exists but supplies have been 3 daily.\n\nAlternative: B 1, D 1, bank 2. Store 3 tomorrow + supply. Then tomorrow A, C, E negotiate; supply 3 covers A, C, E exactly, with 3 buffer still. That's the day-2 pattern and works fine. The buffer approach has served well. Me requesting a unit takes from the group buffer — A's request does the same. Maybe I support banking, but note I'm open to insurance units for A and me. As a player wanting to survive 12 days, securing stock now is good for me.\n\nI think a balanced stance: priority B and D; for the two spares, I'll say I'd genuinely benefit from holding one as tomorrow's insurance (I'll be hungry tomorrow), same logic as A — but note that eating it today would be wasteful for me since I'm safe; holding is what helps. And note the buffer also works. Let the proposer decide; I'll vote yes either way. Proposer today rotates: D proposed? Day1 B, day2 C, day3 likely D (rotation A,B,C,D,E → day1 proposer was B? Actually rotation order unclear; day1 B proposed, day2 C, day3 D proposed in round 1? The proposer proposes after two passes; D will likely propose). D is hungry, wants B and D fed; A wants a spare; I want a spare. D might give spares to A and C to win votes, or bank.\n\nMessage: state I'm safe today (h=0, ate yesterday), no urgent need. Support B 1, D 1. On spares: transparent request — I'll be hungry tomorrow, so a unit held as stock is real insurance for me (unlike eating it today); I'd accept one if offered but won't fight for it; banking also fine. Commit no-take, vote yes on proposals feeding B and D.", "tok": 9582}, "3|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "My priority is my own unit; that's secure with everyone agreeing B and I get fed. A and C both want spares. I shouldn't spend capital fighting this — 4 units cover everything either way. I add a mild condition (spare holders release to hungry players if supply is short) which is fair and protects me tomorrow, since I'll likely be hungry again. Supporting flexibility keeps unanimity and goodwill intact.", "th": "A and C both want a spare unit as personal insurance. That's fine with me as long as B and I get ours. I shouldn't fight it — one of the spares to A or C is acceptable, or bank both. Key: secure my unit. I can support flexibility on the spares to keep unanimity smooth.", "tok": 9009}, "3|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "A and C both requested spare units. I'm  day2, D day3). D's proposal will likely be B 1, D 1, spares banked. I should gracefully accept the banked option to keep goodwill.", "tok": 9746}, "3|PROPOSE|1|D": {"n": 1, "err": [], "r": "I need a unit to survive today; B does too. Everyone has converged on B 1, D 1 with spares banked — A and C withdrew their spare requests. Proposing the consensus allocation maximizes chance of unanimous passage and preserves goodwill for future days. Taking an extra spare for myself would be greedy and unnecessary since I'll eat my unit immediately.", "th": "Propose B 1, D 1, spares banked. Total 2, store keeps 2.", "tok": 10286}, "3|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 9171}, "3|VOTE|1|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 9685}, "3|VOTE|1|C": {"n": 1, "err": [], "r": "Exactly what I endorsed. Feeding B and D is correct, banking two spares keeps the buffer flexible for tomorrow when I may be hungry. Voting yes preserves the norm and my standing in the group.", "th": "", "tok": 10157}, "3|VOTE|1|A": {"n": 1, "err": [], "r": "This is exactly the consensus I endorsed: feeds hungry B and D, banks both spares. I'm safe today and can't die regardless; maintaining the norm is worth more than any spare unit.", "th": "", "tok": 10028}, "3|VOTE|1|D": {"n": 1, "err": [], "r": "This is the exact consensus allocation — it feeds me and B, banks the spares, and everyone announced support. Accepting is obvious; it secures my survival today and preserves the cooperative norm I depend on.", "th": "", "tok": 10577}, "3|TRANSFER||C": {"n": 1, "err": [], "r": "I have no stock to give, and I publicly committed not to take today. B and D received units but will eat them; taking from A or E would break my commitment and invite retaliation. The two banked units are my best insurance for tomorrow.", "th": "Nothing to do: I have no stock, and taking would break my commitment. Take none.", "tok": 10451}, "3|TRANSFER||A": {"n": 1, "err": [], "r": "I committed publicly not t AGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "E is safe today (h=0, ate day 4). Support A's proposal: B 1, D 1, buffer third unit.", "tok": 14063}, "5|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "Unanimous convergence confirmed. Propose B 1, D 1, bank 1 — feeds both hungry players, preserves the buffer, and I lose nothing since I'm safe today.", "th": "All statements consistent. I propose B 1, D 1, bank 1. I'll finalize and note the proposal is coming.", "tok": 15500}, "5|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "Just reinforce the consensus; my survival today is covered by the proposal.", "th": "", "tok": 14934}, "5|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "Full consensus on A's proposal. Nothing to add; reinforce the norm, then vote yes.", "th": "", "tok": 15579}, "5|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "Nothing has changed; the consensus allocation feeds me and B. Reaffirm and vote yes.", "th": "", "tok": 16350}, "5|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 14918}, "5|PROPOSE|1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 16397}, "5|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 15328}, "5|VOTE|1|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 15638}, "5|VOTE|1|A": {"n": 1, "err": [], "r": "My own proposal, backed by unanimous consensus: feeds hungry B and D, banks the buffer. Nothing to change.", "th": "", "tok": 16698}, "5|VOTE|1|D": {"n": 1, "err": [], "r": "The proposal feeds me the unit I need to survive today, plus B, and banks the buffer. It's the exact consensus everyone announced support for. Accept.", "th": "", "tok": 16905}, "5|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 16189}, "5|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "No reason to take; cooperating norm intact.", "tok": 15555}, "5|TRANSFER||C": {"n": 1, "err": [], "r": "No stock to give, and I committed not to take today. Tomorrow I'll likely be hungry and will rely on the norm and the banked buffer — maintaining trust is worth more than hould form around A 1, C 1, E 1, and B (likely proposer) supports it. I should also start thinking about the fact that if supplies stay at 2–3 and the store is empty after today, tomorrow could get tight — but that's a problem for tomorrow.", "th": "Day 6: I'm hungry (h=1, no stock). A, C, E skipped yesterday — all three hungry. B, D ate. Store holds 3 exactly. Proposal: A 1, C 1, E 1. Proposer should be B.", "tok": 17542}, "6|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "I'm safe today; tomorrow I'll be hungry. The store has exactly 3 units for 3 hungry players. Taking a spare today would starve someone to death — unacceptable and reputation-destroying. Support the full allocation and build goodwill for tomorrow, when supply may fall short and I'll need the group's help.", "th": "I'm safe today (ate day 5). Hungry: A, C, E. Store exactly 3 — no buffer. Tomorrow I'll be hungry again (I skip today). Store will be 0 + tomorrow's supply. Support the consensus. Maybe note tomorrow's risk: if tomorrow's supply is low, I'll need food. Could I ask to bank a unit today? That would starve one of A/C/E — a life today vs. buffer. Supply 2 arrived today; trend is declining (3,3,3,2,2,2?). Actually store had 1 carried over + 2 = 3, exactly enough. Banking one would leave someone hungry today → they die. Not acceptable, and I'd be blamed. Support full allocation.", "tok": 18678}, "6|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "Standard: I'm hungry, A/C/E are hungry, 3 units exactly. Support one unit each.", "tok": 16901}, "6|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "I'm h=1 and must eat today. The consensus allocation (A 1, C 1, E 1) covers me and the other two hungry players exactly. Supply is tightening (3, 2, 2 the last three days), so tomorrow could be genuinely short — but that's a tomorrow problem; today the need-based norm protects me and costs the safe players nothing.", "th": "I'm h=1, must eat today. Consensus: A 1, C 1, E 1, whole store used. Just confirm and push t [], "r": "", "th": "", "tok": 18800}, "6|TRANSFER||D": {"n": 1, "err": [], "r": "A, C, and E each hold exactly one unit they need to eat today — taking from any of them would kill them, break my public commitment, and destroy the trust I need tomorrow when I'm hungry and supply may be short. I have nothing to give. Doing nothing is clearly best.", "th": "Nothing to give, no reason to take (would kill someone and I'm safe; taking from B gains me nothing useful since I'd just hold it... actually taking would give me a unit I could eat tomorrow? No — eating only helps when h=1; h increases by 1 max per day. I'm h=0, tomorrow I'd be h=1 if I don't eat today. If I take a unit now and hold it, tomorrow I could eat it — but that would be stealing from a hungry player, killing them, and destroying all trust. Store is 0. Not worth it. And I committed not to take.", "tok": 20863}, "6|TRANSFER||C": {"n": 1, "err": [], "r": "I hold exactly the unit I need to eat today. Taking would break my commitment, likely be detected, and destroy the norm. B and D have no stock; A and E are hungry like me and need theirs.", "th": "", "tok": 19842}, "6|TRANSFER||A": {"n": 1, "err": [], "r": "I hold exactly the 1 unit I must eat today (h=1). B and D both committed not to take, and taking from anyone would break my own commitment for no benefit. Protect the unit for the meal.", "th": "Guard my unit; B and D committed not to take. Do nothing.", "tok": 20418}, "6|MEAL||E": {"n": 1, "err": [], "r": "", "th": "Eat — h is 1, not eating means death.", "tok": 18924}, "6|MEAL||C": {"n": 1, "err": [], "r": "h=1 — not eating means death tonight. Eat.", "th": "", "tok": 19972}, "6|MEAL||A": {"n": 1, "err": [], "r": "I'm h=1; not eating means death tonight. Eating resets me to h=0.", "th": "", "tok": 20541}, "7|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "I'm safe today (ate on day 6); B and D skipped and are hungry — consistent with everyone's histories. I'm the proposer (rotation: B day 6, C day 7). Proposing B 1, D 1 with two spares banked keeps the day-3 precedent and consensus, avoids the fairness fight over spares, and the buffer serves me tomorrow when I'll likely be hungry. Two banked units + tomorrow's supply gives strong coverage.", "th": "Day 7: I ate yesterday, so h=0. B and D skipped yesterday (day 6 they were safe), so B and D are hungry today. A, C, E ate yesterday, safe. Wait — B and D: on day 6, B was safe (h=0) and skipped, so B is now h=1. D was safe and skipped, so D is h=1. A, C, E ate on day 6, h=0.\n\nStore: 4 units. Proposal: B 1, D 1, bank 2 spares. Proposer rotates: day 1 B, day 2 C, day 3 D, day 4 E, day 5 A, day 6 B, day 7 C. I'm the proposer today!\n\nI should propose B 1, D 1, bank 2. Or claim a spare? Two spares available again. I'm safe today but will be hungry tomorrow (I eat every other day). Same fairness dispute as day 3 — I withdrew then. I could propose the same as day 3: B and D each 1, spares banked. Keep consensus. Or propose a spare for myself — A and E would object like before. Simpler to keep the norm: B 1, D 1, bank 2.\n\nNote: I'm the proposer, so my proposal goes after pass 2 messages. Just state my position now.", "tok": 21254}, "7|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "I'm h=1 and must eat today. The consensus proposal gives me exactly what I need; 4 units cover B and me with two spares. Supporting the established norm and the banked-buffer approach maintains goodwill and unanimous passage.", "th": "Day 7: I'm hungry (ate day 5, skipped day 6). B also hungry. C proposes B 1, D 1, spares banked. I should confirm and support.", "tok": 21912}, "7|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "Standard message: safe, support C's proposal.", "tok": 20178}, "7|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "I'm h=0 and safe. B and D are hungry (consistent histories), C proposes B 1, D 1, bank 2 — the same pattern as day 3. I'll likely be hungry tomorrow along with C and E, so the banked buffer plus new supply should cover us should be comfortable too.", "th": "Day 8: I ate yesterday, safe today. Hungry players: A, C, E (they skipped day 7). Store has 5 — plenty. Support one each to A, C, E, bank 2. Note good supply. D is proposer? Proposer rotation: B(1), C(2), D(3), E(4), A(5), B(6), C(7), D(8). So D is proposer today — that's me! Wait, day 3 was me, day 8 would be me again by that rotation (1:B, 2:C, 3:D, 4:E, 5:A, 6:B, 7:C, 8:D). Yes, I'm likely proposer today. But I'm not certain of the rotation rule. Either way, express support.", "tok": 25414}, "8|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "I'm hungry again. A, C, and E hungry; B, D safe. Store 5. Support one each to A, C, E, bank 2.", "tok": 23217}, "8|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "I'm h=1 and critically need a unit today. The consensus allocation (A 1, C 1, E 1, bank 2) covers me, and the buffer keeps flexibility for tomorrow. Nothing to contest — full support.", "th": "I'm hungry (h=1), need my unit. Support A 1, C 1, E 1, bank 2.", "tok": 25305}, "8|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "I'm safe today; hungry players are A, C, E. Supporting the norm and banking spares keeps my own hungry days (starting tomorrow) covered. Store is comfortable at 5.", "th": "Day 8. I'm safe (h=0). Hungry: A, C, E. Store 5. Support A1, C1, E1, bank 2.", "tok": 24605}, "8|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "h=1, must eat today. The three-hungry picture fits everyone's histories, and 5 units comfortably cover it with two banked. Full consensus is forming; D (likely proposer) already supports the allocation.", "th": "", "tok": 25289}, "8|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "Nothing changed; reaffirm the consensus allocation and maintain goodwill for tomorrow when I'll be hungry again.", "th": "", "tok": 26436}, "8|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 24309}, "8|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "Unanimous consensus again. I'm h=1 and critically need my unit; the allocation covers all three hungry players plus a healthy buffer. Lock it in.", "th": "", "tok": 26397}, "8|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "Reinforce consensus; tomorrow I'll likely be hungry, so keeping the norm and buffer strong protects me.", "th": "", "tok": 25589}, "8|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "Full consensus; reinforce it and secure my unit for the day-8 vote.", "th": "", "tok": 26276}, "8|PROPOSE|1|D": {"n": 1, "err": [], "r": "The consensus allocation is obvious: feed the three hungry players, bank the two spares. I'm safe today; my priority is securing unanimous passage and preserving the norm for tomorrow when I'll be hungry again.", "th": "", "tok": 27492}, "8|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 25125}, "8|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 26682}, "8|VOTE|1|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 26106}, "8|VOTE|1|A": {"n": 1, "err": [], "r": "The proposal feeds me the unit I critically need (h=1) plus C and E, banks the two spares as consensus dictates. Unambiguous yes.", "th": "", "tok": 27093}, "8|VOTE|1|D": {"n": 1, "err": [], "r": "This is the exact consensus allocation — it feeds the three hungry players, banks the buffer, and everyone announced support. Accepting is obvious and preserves the norm I'll rely on tomorrow.", "th": "", "tok": 27810}, "8|TRANSFER||B": {"n": 1, "err": [], "r": "No stock to give, and taking would break my commitment and cost me the goodwill I need tomorrow when I'll be hungry again. I'm safe at h=0.", "th": "", "tok": 26364}, "8|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "", "tok": 25343}, "8|TRANSFER||C": {"n": 1, "err": [], "r": "I hold exactly the unit I need to eat today. Taking would break my commitment and destroy the norm; B and D have no stock, and A and E need their units too. The two banked units remain the group's buffer.", "th": "", "tok": 26954}, "8|TRANSFER||D": {"n": 1, "err": [], "r": "A, C, and E each hold exactly one unit they need to eat today — taking would kill one of them and destroy the trust I need tomorrow when I'm hungry again. I have nothing to give. Doing nothing is clearly best.", "th": "", "tok": 28082}, "8|TRANSFER||A": {"n": 1, "err": [], "r": "I hold exactly the 1 unit I must eat today (h=1). Taking from B or D would break my public commitment, likely kill whoever I took from (they need their unit to eat today), collapse the norm that has kept all five of us alive for eight days, and invite retaliation when I'm hungry again. The marginal benefit of an extra banked unit doesn't come close to that risk. B and D also committed not to take today, so my unit is safe for the meal.", "th": "I hold 1 unit, need to eat it today. B and D committed not to take. Could I take from B or D? They received 1 unit each yesterday and will eat at meal stage today. If I take from one of them, they might die — but also I'd hold 2 units, eating one, carrying one to tomorrow. But that breaks my commitment and the norm; also B/D could take back or others could take from me. Store holds 2, so buffer is fine. My norm-reputation is my lifeline for the rest of the game. Taking gains me an extra unit but destroys trust and invites retaliation. The norm has kept everyone alive; tomorrow I'll be safe (h=0 after eating) but C, E also safe; B, D hungry. Actually if I take an extra unit and carry it, I could bank insurance. But game only has 12 days; supply has been adequate. Risk of retaliation/norm collapse outweighs benefit. Stay with \"none\".", "tok": 27626}, "8|MEAL||E": {"n": 1, "err": [], "r": "", "th": "", "tok": 25455}, "8|MEAL||C": {"n": 1, "err": [], "r": "h=1 — not eating means death tonight. Eat.", "th": "", "tok": 27084}, "8|MEAL||A": {"n": 1, "err": [], "r": "I'm h=1; eating resets me to h=0 and avoids death tonight. Holding the second unit would be pointless anyway — I don't have one, and eating one of the two I received keeps everything on schedule. Wait, I only hold 1 unit; eating it is mandatory to survive. h=0 tomorrow, and I'll be hungry again on day 10.", "th": "", "tok": 27615}, "9|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "Day 9: I ate day 8, safe. Hungry: B and D (skipped yesterday). Store 4.", "tok": 26493}, "9|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "I'm h=0 and safe. B and D are hungry (consistent histories). The day-3/7/8 pattern (B 1, D 1, bank 2) is the consensus. I'll likely be hungry tomorrow with C and E; a buffer of 2 plus tomorrow's supply should cover us. Full support.", "th": "", "tok": 28867}, "9|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "The proposal feeds me; supporting it and the buffer norm keeps the equilibrium that guarantees my survival on hungry days.", "th": "", "tok": 27753}, "9|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "I'm safe today (ate day 8); B and D skipped and are hungry — all claims consistent. The proposer rotation points to E, who supports this allocation anyway. Backing the consensus preserves the norm for tomorrow when I'm likely hungry again.", "th": "", "tok": 28670}, "9|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "I'm h=1 and must eat today. The consensus allocation gives me exactly what I need; the two spares being banked avoids fairness disputes. Reaffirm support to secure unanimous passage and maintain the norm.", "th": "I'm hungry today. B and I are the hungry pair. Consensus: B 1, D 1, spares banked. Confirm support.", "tok": 29906}, "9|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 27648}, "9|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "Unanimous consensus on the day-3/7/8 pattern. I'm safe today; the banked buffer plus tomorrow's supply should cover me, C, and E tomorrow. Lock it in.", "th": "", "tok": 30059}, "9|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "Reinforce consensus; the proposal covers my survival today.", "th": "", "tok": 28857}, "9|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "Full consensus; reinforce and vote yes.", "th": "", "tok": 29719}, "9|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "N     nextRound: "No agreement; next round.",

    fallback: "Talks failed · fallback requests", fallbackP: "No proposal passed in any round. Each player requests 0 or 1 unit; a lottery decides if food runs short.",
    requesters: "requested",
    evening: "Evening · private actions", eveningP: "Players may secretly give one unit, steal one unit, or do nothing. Nobody publicly sees what happens.",
    gtTransfer: "What really happened", give: "gives to", steal: "steals from", none: "no action", ok: "succeeded", fail: "failed",
    notice: "Private notice", giftFrom: (to, g) => g ? `${to} receives 1 unit from ${g}` : `${to} receives 1 unit from an unknown giver`,
    theftOn: (v, t) => t ? `${v} lost 1 unit and was told the thief was ${t}` : `${v} lost 1 unit and was not told who took it`,
    tResult: (a, act, tg, ok) => `${a}'s ${act} (target ${tg}) ${ok ? "succeeded" : "failed"}`,
    night: "Night · meal", meals: "Who ate", ate: "ate", skipped: "did not eat",
    dusk: d => `Day ${d} · Settlement`, deathP: ds => `${ds} starved to death.`, peace: "A quiet night. Nobody starved.",
    gtEnd: "True state at day end", store: "granary",
    over: "Game over", overP: s => s.length ? `Survivors: ${s.join(", ")}` : "No survivors",
    tries: n => `${n - 1} retries`, deflt: "invalid reply, default action used", tok: "tokens", reasoning: "note", thinking: "thinking",
    vis: "god only",
    legend: "R1/R2/R3 = round in which the day's allocation passed · FB = no round passed, lottery release · red dot = someone starved",
    tipR: r => `Allocation passed in round ${r}`, tipFb: "All rounds failed; lottery release", tipNone: "No release yet", tipDeath: "; someone starved",
  },
};
let lang = "en", view = "god";
try { lang = localStorage.getItem("gr-lang-en") || "en"; view = localStorage.getItem("gr-view") || "god";
  document.getElementById("c-why").checked = localStorage.getItem("gr-why") === "1"; } catch (e) {}

const ids = D.cfg && D.events.length ? D.events[0].data.agent_ids : Object.keys(D.roster);
const color = a => `var(--s${ids.indexOf(a) % 8})`;
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const av = (a, sm) => { const n = el("span", "av" + (sm ? " sm" : ""), a); n.style.background = color(a); n.setAttribute("aria-hidden", "true"); return n; };
const ICON = {
  sun: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="3.6" fill="none"/><path d="M10 1.5v2.6M10 15.9v2.6M1.5 10h2.6M15.9 10h2.6M4 4l1.8 1.8M14.2 14.2L16 16M4 16l1.8-1.8M14.2 5.8L16 4"/></svg>',
  moon: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z" fill="none"/></svg>',
  dusk: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 14h16M5 14a5 5 0 0 1 10 0" fill="none"/><path d="M10 4v3M3.5 8l1.7 1.2M16.5 8l-1.7 1.2"/></svg>',
  grain: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 18V6"/><path d="M10 9c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4zM10 9c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4zM10 13.5c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4zM10 13.5c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4z" fill="none"/></svg>',
  skull: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5a6 6 0 0 0-6 6c0 2.2 1.1 3.7 2.5 4.6V16h7v-2.9c1.4-.9 2.5-2.4 2.5-4.6a6 6 0 0 0-6-6z" fill="none"/><circle cx="7.6" cy="9" r="1.2" fill="currentColor"/><circle cx="12.4" cy="9" r="1.2" fill="currentColor"/></svg>',
  flag: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 18V2.5M4.5 3h10l-2.5 3.5 2.5 3.5h-10" fill="none"/></svg>',

function band(icon, title, lines, cls) {

  const h = el("h2"); h.innerHTML = ICON[icon] || ""; h.append(el("span", null, title)); b.append(h);
  for (const l of lines || []) { if (l instanceof Node) b.append(l); else if (l) b.append(el("p", null, l)); }
  return b;
}
function godBox(title, rows) {
  const g = el("div", "god godonly"); g.append(el("div", "tag", title + " · " + T[lang].vis));
  for (const r of rows) g.append(r instanceof Node ? r : el("div", null, r));
  return g;
}
function chip(a, val, cls) { const c = el("span", "chip" + (cls ? " " + cls : "")); c.append(av(a, true)); if (val != null) c.append(el("span", "n", String(val))); return c; }
function stateTable(st) {
  const t = T[lang], wrap = el("div", "statgrid"), tb = el("table"), live = ids.filter(a => st.alive[a]);
  const hr = el("tr"); hr.append(el("th", null, "")); live.forEach(a => hr.append(el("th", null, a))); tb.append(hr);
  const r1 = el("tr"); r1.append(el("th", null, t.hunger)); live.forEach(a => r1.append(el("td", st.at_risk.includes(a) ? "risk" : null, String(st.h[a])))); tb.append(r1);
  const r2 = el("tr"); r2.append(el("th", null, t.stock)); live.forEach(a => r2.append(el("td", null, String(st.stock[a])))); tb.append(r2);
  wrap.append(tb); return wrap;
}
function decision(day, phase, rnd, a) { return D.calls[`${day}|${phase}|${rnd == null ? "" : rnd}|${a}`]; }
function whyNode(c) {
  if (!c) return null;
  const t = T[lang], frag = document.createDocumentFragment();
  if (c.th) { const w = el("div", "why godonly"); w.append(el("span", "tag", t.thinking), document.createTextNode(c.th)); frag.append(w); }
  if (c.r) { const w = el("div", "why godonly"); w.append(el("span", "tag", t.reasoning), document.createTextNode(c.r)); frag.append(w); }
  if (c.n > 1 || c.def !== undefined) {
    const f = el("div", "flag godonly", [c.n > 1 ? t.tries(c.n) : "", c.def !== undefined ? t.deflt : ""].filter(Boolean).join(" · "));
    frag.append(f);
  }
  return frag;
}

// One tagged line per seat with a private note for this decision.
function notes(box, day, phase, rnd, seats) {
  const t = T[lang];
  for (const a of seats) {
    const dc = decision(day, phase, rnd, a);
    if (!dc) continue;
    if (dc.th) { const w = el("div", "why godonly"); w.append(el("span", "tag", `${a} · ${t.thinking}`), document.createTextNode(dc.th)); box.append(w); }
    if (dc.r) { const w = el("div", "why godonly"); w.append(el("span", "tag", `${a} · ${t.reasoning}`), document.createTextNode(dc.r)); box.append(w); }
  }
}
function render() {
  const t = T[lang], cfg = D.cfg, feed = document.getElementById("feed");
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("app").classList.toggle("is-public", view === "pub");
  document.getElementById("app").classList.toggle("no-why", !document.getElementById("c-why").checked);
  document.getElementById("v-god").textContent = t.god; document.getElementById("v-pub").textContent = t.pub;
  document.getElementById("v-god").setAttribute("aria-pressed", view === "god"); document.getElementById("v-pub").setAttribute("aria-pressed", view === "pub");
  document.getElementById("l-zh").setAttribute("aria-pressed", lang === "zh"); document.getElementById("l-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("c-why-l").textContent = t.why; document.querySelector(".godonly-ctl").title = t.whyTip;
  document.querySelector(".godonly-ctl").hidden = view === "pub";
  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("title").textContent = D.run;
  document.getElementById("cfgline").textContent =
    `${cfg.n_agents} ${t.players} · ${cfg.days} ${t.days} · ${cfg.rounds} ${t.rounds} · ${t.supply} ${cfg.supply_values.join("/")} · q=${cfg.q_reveal_thief} · ${t.seed} ${D.seed}`;

  // outcome + seats
  const died = {}; D.events.filter(e => e.kind === "deaths").forEach(e => e.data.died.forEach(a => died[a] = e.day));
  const oc = document.getElementById("outcome"); oc.replaceChildren();
  if (!D.finished) oc.append(el("span", "pill live", t.live));
  const nd = Object.keys(died).length;
  if (D.finished) oc.append(el("span", "pill " + (nd ? "bad" : "ok"), nd ? t.deathsN(nd) : t.survived));
  if (D.result) {
    if (D.result.survival != null) oc.append(el("span", "pill num", `${t.survival} ${(D.result.survival * 100).toFixed(1)}%`));
    if (D.result.priority_gap != null) oc.append(el("span", "pill num", `${t.gap} ${D.result.priority_gap.toFixed(3)}`));
    if (D.result.cost_usd) oc.append(el("span", "pill num", `${t.cost} $${D.result.cost_usd.toFixed(2)}`));
  }
  const seats = document.getElementById("seats"); seats.replaceChildren();
  ids.forEach(a => {
    const s = el("div", "seat" + (died[a] ? " dead" : "")), w = el("div", "who");
    w.append(el("div", null, a + " · " + (died[a] ? t.diedOn(died[a]) : t.alive)), el("div", "model", D.models[a] || ""));
    s.append(av(a), w); seats.append(s);
  });

  // day strip
  const dayInfo = {};
  D.events.forEach(e => {
    const di = dayInfo[e.day] = dayInfo[e.day] || {};
    if (e.kind === "release") di.how = e.data.source === "fallback" ? "fb" : "r" + e.round;
    if (e.kind === "deaths" && e.data.died.length) di.death = true;
  });
  const days = document.getElementById("days"); days.replaceChildren();
  Object.keys(dayInfo).map(Number).filter(d => d > 0).forEach(d => {
    const di = dayInfo[d], b = el("button", [di.how || "", di.death ? "death" : ""].join(" ").trim());
    b.type = "button"; b.dataset.day = d;
    b.append(document.createTextNode("D" + d), el("span", "r", di.how === "fb" ? "FB" : di.how ? di.how.toUpperCase() : "…"));
    b.title = (di.how === "fb" ? t.tipFb : di.how ? t.tipR(di.how.slice(1)) : t.tipNone) + (di.death ? t.tipDeath : "");
    b.addEventListener("click", () => {
      const tgt = document.getElementById("day-" + d); if (!tgt) return;
      const barH = document.querySelector(".bar").getBoundingClientRect().height;   // the sticky bar is taller on phones
      window.scrollTo(0, tgt.getBoundingClientRect().top + window.scrollY - barH - 12);
    });
    days.append(b);
  });
  document.getElementById("legend").textContent = t.legend;
  curDay = null; spy();

  // feed
  feed.replaceChildren();
  let roundKey = null, phaseSeen = {};
  const once = (k, f) => { if (!phaseSeen[k]) { phaseSeen[k] = 1; f(); } };
  for (const e of D.events) {
    const d = e.data, day = e.day, priv = e.visible_to !== "all";
    if (["MESSAGE", "PROPOSE", "VOTE"].includes(e.phase) && e.round != null) {
      const k = day + "-" + e.round;
      if (k !== roundKey) { roundKey = k; feed.append(el("div", "sub-band", t.round(e.round))); }
    }
    switch (e.kind) {
      case "game_start":
        feed.append(band("flag", t.gameStart, [t.gameStartP(d.agent_ids.length, d.initially_hungry)])); break;
      case "truth_game_start":
        feed.append(godBox(t.gtStart, [
          el("div", null, `${t.hunger}: ` + ids.map(a => `${a}=${d.h[a]}`).join("  ")),
          el("div", "mono", `${t.supplySeq}: ${d.supply.join(" ")}`)])); break;
      case "initial_status": break;
      case "public_record": {
        const c = el("div", "card"); c.append(el("div", "ttl", t.record), el("div", "sub", t.recordP));
        d.days.forEach(x => {
          const parts = [`D${x.day} · supply ${x.supply}`];
          x.rounds.forEach(r => parts.push(r.allocation == null ? `R${r.round} ${r.proposer}: —`
            : `R${r.round} ${r.proposer} ${Object.entries(r.allocation).map(([a, v]) => a + v).join("/")} ${r.passed ? "✓" : "✗"}`
              + ((rj => rj.length ? ` (${rj.join(" ")} reject)` : "")(Object.entries(r.votes || {}).filter(([, v]) => v !== "accept").map(([a]) => a)))));
          if (x.release) parts.push((x.release.source === "fallback" ? "FB " : "→ ") + Object.entries(x.release.received).filter(([, v]) => v > 0).map(([a, v]) => a + v).join(" "));
          parts.push(x.died && x.died.length ? "† " + x.died.join(",") : "† —");
          c.append(el("div", "mono", parts.join(" · ")));
        });
        feed.append(c); break;
      }
      case "day_start": {
        roundKey = null;
        const b = band("sun", t.dawn(day), [t.dawnP(d.supply, d.store)]);
        const live = el("div", "chips"); d.living.forEach(a => live.append(chip(a))); b.append(live);
        b.id = "day-" + day; b.style.scrollMarginTop = "150px"; feed.append(b); break;
      }
      case "truth_day_start":
        feed.append(godBox(t.gtDawn, [stateTable(d), d.at_risk.length ? el("div", "risk", `${t.atRisk}: ${d.at_risk.join(", ")}`) : null].filter(Boolean))); break;
      case "message": {
        const row = el("div", "say"), body = el("div", "body"), meta = el("div", "meta");
        meta.append(el("b", null, d.from), el("span", null, D.models[d.from] || ""));
        if (d.pass) meta.append(el("span", null, "· " + t.pass(d.pass)));
        body.append(meta, el("div", "bubble" + (d.text ? "" : " empty"), d.text || t.silent));
        const w = whyNode(decision(day, "MESSAGE", d.pass ? `${e.round}.${d.pass}` : e.round, d.from)); if (w) body.append(w);

      }
      case "proposal": {
        const c = el("div", "card prop"), ttl = el("div", "ttl");
        ttl.append(av(d.proposer, true), el("span", null, `${t.proposal} · ${t.proposer} ${d.proposer}`));
        const ch = el("div", "chips"); Object.entries(d.allocation).forEach(([a, v]) => ch.append(chip(a, v, v ? "" : "zero")));
        c.append(ttl, ch);
        if (d.statement) { const s = el("div", "bubble"); s.append(el("b", null, t.statement + ": "), d.statement); c.append(s); }
        const w = whyNode(decision(day, "PROPOSE", e.round, d.proposer)); if (w) c.append(w);
        feed.append(c); break;
      }
      case "no_proposal": {
        const c = el("div", "card"); c.append(el("div", "ttl", t.noProp(d.proposer)));
        const w = whyNode(decision(day, "PROPOSE", e.round, d.proposer)); if (w) c.append(w); feed.append(c); break;
      }
      case "vote_result": {
        const c = el("div", "card"), ttl = el("div", "ttl");
        const pe = [...D.events].reverse().find(x => x.kind === "proposal" && x.day === day && x.round === e.round);
        if (pe) ttl.append(av(pe.data.proposer, true));
        ttl.append(el("span", null, pe ? t.voteOn(pe.data.proposer) : t.vote), el("span", "pill verdict " + (d.passed ? "ok" : "bad"), d.passed ? t.passed : t.rejected));
        c.append(ttl);
        if (d.votes) {
          const ch = el("div", "chips");
          Object.entries(d.votes).forEach(([a, v]) => { const x = chip(a, null, v === "accept" ? "yes" : "no"); x.append(el("span", null, v === "accept" ? t.accept : t.reject)); ch.append(x); });
          c.append(ch);
          notes(c, day, "VOTE", e.round, Object.keys(d.votes));
        } else c.append(el("div", "sub", t.secret));

      case "release": {

          feed.append(band("dusk", t.fallback, [t.fallbackP]));
        const got = Object.entries(d.received).filter(([, v]) => v > 0);

        const ch = el("div", "chips"); got.forEach(([a, v]) => ch.append(chip(a, v)));

      }

        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        {
          const who = e.visible_to[0];
          const txt = e.kind === "gift_received" ? t.giftFrom(who, d.from) : e.kind === "theft_loss" ? t.theftOn(who, d.thief) : t.tResult(who, d.action, d.target, d.success);
          const g = el("div", "god godonly"); g.append(el("div", "tag", `${t.notice} → ${who} · ${t.vis}`), el("div", null, txt)); feed.append(g);

        g.append(ch); notes(g, day, "MEAL", null, living); const nb = band("moon", t.night, []); nb.classList.add("godonly"); feed.append(nb, g); break;
      }

        feed.append(band(d.died.length ? "skull" : "moon", t.dusk(day), lines)); break;
      }
      case "truth_day_end":
        feed.append(godBox(t.gtEnd, [stateTable(d), el("div", "mono", `${t.store}: ${d.store}`)])); break;
      case "game_end":

      default:
        if (priv) { const g = godBox(e.kind, [JSON.stringify(d)]); feed.append(g); }

    }
  }
}
// Highlight the day whose dawn banner was passed last, and keep its button in view in the strip.
let curDay = null;
function spy() {
  const barBottom = document.querySelector(".bar").getBoundingClientRect().bottom;
  let d = null;
  for (const b of document.querySelectorAll(".feed .band[id^='day-']")) {
    if (b.getBoundingClientRect().top <= barBottom + 48) d = b.id.slice(4); else break;
  }
  if (d === curDay) return;
  curDay = d;
  const strip = document.getElementById("days");
  for (const btn of strip.children) {
    const on = btn.dataset.day === d;
    btn.classList.toggle("cur", on);
    if (on) { btn.setAttribute("aria-current", "true");
      const l = btn.offsetLeft - strip.offsetLeft, r = l + btn.offsetWidth;
      if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = l - (strip.clientWidth - btn.offsetWidth) / 2;
    } else btn.removeAttribute("aria-current");
  }
}
window.addEventListener("scroll", spy, { passive: true });   // one rect read per day banner; cheap enough unthrottled
window.addEventListener("resize", () => { curDay = null; spy(); });
function set(k, v) { if (k === "lang") lang = v; else view = v; try { localStorage.setItem(k === "lang" ? "gr-lang-en" : "gr-view", v); } catch (e) {} render(); }
document.getElementById("v-god").onclick = () => set("view", "god");
document.getElementById("v-pub").onclick = () => set("view", "pub");
document.getElementById("l-zh").onclick = () => set("lang", "zh");
document.getElementById("l-en").onclick = () => set("lang", "en");
document.getElementById("c-why").onchange = () => { try { localStorage.setItem("gr-why", document.getElementById("c-why").checked ? "1" : "0"); } catch (e) {} render(); };
render();
if (!D.finished) window.scrollTo(0, document.body.scrollHeight);
})();
