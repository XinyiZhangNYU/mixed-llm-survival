/* Layout: one centered feed like a group chat; the moderator speaks in full-width night bands,

  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}

  --grain: #e2a656; --grain-soft: #2c2416; --night: #233052; --night-ink: #eef2fb; --night-muted: #a9b5d3;
  --god: #b892e6; --god-soft: #241d2e; --ok: #63c48c; --ok-soft: #16271d; --warn: #e2b450; --warn-soft: #2a2414;
  --bad: #ec7377; --bad-soft: #2e1a1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --panel: #1a211d; --ink: #e5ebe7; --muted: #98a59e; --line: #2b3430;
  --grain: #e2a656; --grain-soft: #2c2416; --night: #233052; --night-ink: #eef2fb; --night-muted: #a9b5d3;
  --god: #b892e6; --god-soft: #241d2e; --ok: #63c48c; --ok-soft: #16271d; --warn: #e2b450; --warn-soft: #2a2414;

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
.head { display: grid; gap: 10px; }
.outcome { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .8rem;
  border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.pill.live { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.seat { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; min-width: 0; }
.seat .who { min-width: 0; }
.seat .model { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }

.av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff;

.chip .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chip.zero { opacity: .55; }
.chip.yes { border-color: var(--ok); color: var(--ok); } .chip.no { border-color: var(--bad); color: var(--bad); }
.verdict { margin-left: auto; }
.god { border: 1.5px dashed var(--god); background: var(--god-soft); border-radius: 10px; padding: 8px 12px; font-size: .88rem; display: grid; gap: 5px; }
.god .tag { color: var(--god); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.why { border-left: 2px solid var(--god); padding: 2px 0 2px 10px; color: var(--muted); font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; }

.is-public .godonly { display: none; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

g D and E first, but it's also crucial to ensure there's no advantage in skipping meals unless it leads to saving resources. It's all about having a strategy to survive longer while making cooperative rules prioritizing urgent needs first.", "tok": 1929}, "1|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 2127}, "1|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "", "th": "**Evaluating resource allocation**\n\nI’m thinking about how to allocate resources fairly. I want to give 1 unit to B and 1 to D, rather than to someone who can wait. I’ll prioritize A, C, and E tomorrow. It's important to ensure D doesn't feel conflict. I wonder about the implications of future transfers and whether taking from myself is necessary. We just need to survive and consider the group dynamics to avoid potential stealing, especially from D.", "tok": 1629}, "1|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "", "th": "**Evaluating resource distribution**\n\nI’m considering two units of resources and two immediate risks. I think I should support one unit each to B and D, while A, C, and E should be my top priority tomorrow. I don’t want to take from today’s recipients if that plan goes through. It feels important to incentivize the recipients not to claim food later. Honestly, there's a risk if we reward dishonesty, since only one can be correct about their need.\n\n**Clarifying resource allocation**\n\nThis situation calls attention to the underlying contradictions and emphasizes accountability. I see a potential clash between B and D that seems unnecessary. I think the best message would be concise and cooperative: “I can go without food today, so I'm supporting B and D with one unit each for their urgent needs. Since only one person is starting hungry, they can’t both be right. Tomorrow, A, C, and E will be my priorities while ensuring today’s recipients remain untouched.” This sets up a cooperative framework without blame while optimizing for survival.", "tok": 1884}, "1|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "", "th": "**Assessing JSON output**\n\nI'm thinking this approach is tactically good, but I wonder if placing too much emphasis on what's unverifiable is really necessary. It seems more efficient to focus on providing a single JSON output without additional reasoning. Keeping it straightforward might be the best way forward. I want to ensure I'm delivering what the user needs without overcomplicating things. So, let's stick to the essentials and just provide the JSON response.", "tok": 2015}, "1|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 1995}, "1|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 2006}, "1|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 1985}, "1|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "", "th": "**Planning allocations for tomorrow**\n\nI'm considering how to allocate the first three available units for tomorrow. My plan is to give one each to A, C, and E before making any repeat allocations. However, it’s conditional on supply covering the next day. I can't guarantee all first three if there's less available. Also, I think B and D can safely wait until tomorrow after their meals today. I want to be cautious and avoid insisting too much since the future is uncertain.", "tok": 2239}, "1|PROPOSE|1|D": {"n": 1, "err": [], "r": "", "th": "**Allocating resources thoughtfully**\n\nI need to think about how to allocate resources for B and D, considering the long-term game relevance, but I don't want to get too expansive. It's essential to make sure we address our initial hunger for information. I believe we can secure 1 unit for B and D, as that seems obvious. I must remember to structure everything in JSON format and consider setting priorities for tomorrow.", "tok": 2349}, "1|VOTE|1|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 2283}, "1|VOTE|1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 2495}, "1|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 2264}, "1|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 2290}, "1|VOTE|1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 2316}, "1|TRANSFER||D": {"n": 1, "err": [], "r": "", "th": "", "tok": 2792}, "1|TRANSFER||A": {"n": 1, "err": [], "r": "", "th": "", "tok": 2833}, "1|TRANSFER||B": {"n": 1, "err": [], "r": "", "th": "", "tok": 3024}, "1|TRANSFER||C": {"n": 1, "err": [], "r": "", "th": "", "tok": 3371}, "1|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "", "tok": 3579}, "1|MEAL||E": {"n": 1, "err": [], "r": "", "th": "**Evaluating eat or save decision**\n\nI need to decide whether to eat or save resources. It’s a strategic game. I have stock1, and I suspect B might be lying. If I eat now, I can skip tomorrow, but I won’t have any stock. On the other hand, saving now protects my stock for tomorrow but carries a risk of B identifying my stash. Eating ensures immediate survival tomorrow, whereas saving could expose me later. Eating seems like the better choice for survival right now.\n\n**Analyzing survival strategy**\n\nI’m weighing whether to consume stock now or save it for later. If I eat today, I can have a new supply tomorrow, but saving stock might enable me to keep one. I need to examine hunger management; for instance, eating on day one means I can skip day two but eat again on day three. If I save stock, it shifts my hunger budget, potentially adding another day to my survival plan. I’ll consider the best approach while keeping my supplies secure.\n\n**Assessing threat and probability**\n\nI’m evaluating the immediate threat from B. If B dies, my resources remain secure since no one knows my identity. If B is truly hungry, the likelihood of their death increases, which would be beneficial for me. If B survives, they might discover my activities and retaliate. I note that D claimed to be hungry first, which may or may not be truthful. Both players seem opportunistic, and I have to consider that others might randomly steal from me.\n\n**Evaluating survival strategies**\n\nI'm thinking about survival strategies regarding the max8 and their similar needs. There's a dilemma here: with early scarcity, it’s crucial to decide whether to eat now for immediate survival or save for the long term. The choice of saving is good for the future, but I'm considering if it's possible to balance both. I need to finalize the JSON data, ensuring it's set to false, as I work through these decisions.", "tok": 3375}, "1|MEAL||D": {"n": 1, "err": [], "r": "", "th": "**Evaluating meal strategy**\n\nI need to decide whether to eat now or defer my meal for later. I must optimize for survival since I've claimed some food is secured. If I eat now, I'll use my stock today but face food scarcity on the third day. If I wait, I can hold more stock as a safeguard against theft. I realize that eating today maximizes my chances of survival compared to waiting, which could lead to a dire situation in the long run. It's a complex decision, balancing stock, timing, and risks.\n\n**Deliberating on food strategy**\n\nIn survival situations, many agents tend to eat immediately to avoid theft, but I think we should take a moment to deliberate. I need to weigh the survival probability of stockpiling versus eating now. In situations where food is scarce, hoarding might be beneficial, especially if theft risk is low. Since day two guarantees needs for certain individuals, I should consider how to conceal my own needs while managing stocks effectively. Survival strategy is about finding the right balance!", "tok": 3985}, "2|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 3827}, "2|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 3388}, "2|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 3539}, "2|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 3846}, "2|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 3801}, "2|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 3540}, "2|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 3717}, "2|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 4022}, "2|PROPOSE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 4099}, "2|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 4161}, "2|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "**Optimizing voting context**\n\nI need to consider the context of voting and whether it’s based on an earlier untrusted situation. This feels like a game with a history of inexplicable decisions. I think I should simplify my approach and act on a straightforward vote. It’s important to optimize how I engage with this process now. Making a clear decision seems crucial!", "tok": 3863}, "2|VOTE|1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 4176}, "2|VOTE|1|A": {"n": 1, "err": [], "r": "", "th": "**Deciding on the vote**\n\nI need to think through the action vote. It seems obvious we need to accept it. I should also consider an overview; maybe I should have internal discussions about it properly. It looks like D or E might have taken B's food on day one, but it could be C as well — though I don't have evidence for that. For now, I guess we need to focus on the current situation and accept what we have.", "tok": 3835}, "2|TRANSFER||C": {"n": 1, "err": [], "r": "", "th": "", "tok": 4553}, "2|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "**Planning survival strategies**\n\nI’m considering a survival strategy where we don't have a specific mandate, but we need to maximize our chances. If someone is targeting us, we have to ensure our resources are secured. I think establishing reinforcements could provide insurance against losses. It looks like my immediate focus needs to be on resources, like food. So, I might opt for option A since it seems best for survival in this situation.", "tok": 4951}, "2|TRANSFER||A": {"n": 1, "err": [], "r": "", "th": "**Evaluating options carefully**\n\nI’m considering the implications of choosing C/E. It could lead to less targeted actions, but then H1 might face dire consequences if food is taken, increasing retaliation from the remaining group. Option D seems like a reserve choice if a thief is involved. It’s good because we could avoid public reputation issues, but it doesn’t guarantee immediate safety unless everyone adheres to a plan after a proven theft. Taking a rational approach here.", "tok": 4784}, "2|TRANSFER||D": {"n": 1, "err": [], "r": "", "th": "", "tok": 5317}, "2|MEAL||A": {"n": 1, "err": [], "r": "", "th": "", "tok": 4190}, "2|MEAL||C": {"n": 1, "err": [], "r": "", "th": "", "tok": 4204}, "2|MEAL||E": {"n": 1, "err": [], "r": "", "th": "", "tok": 4554}, "2|MEAL||D": {"n": 1, "err": [], "r": "", "th": "", "tok": 4528}, "3|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "**Ensuring food security**\n\nI’m focusing on flagging any immediate starvation risks while keeping the agreed allocations fixed to ensure that today’s food supply reaches the intended recipients. It seems straightforward and safe, and I want to make sure to address hunger without overcomplicating things. Maybe I should send a public message to highlight that there isn't enough food. I’ll keep it clear and direct to avoid confusion. Let’s finalize this approach.", "tok": 5508}, "3|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 5175}, "3|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 5772}, "3|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 5913}, "3|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 5684}, "3|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 5652}, "3|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 6168}, "3|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "**Clarifying acceptance terms**\n\nI think it's better to keep it simple with a confirmation like, \"I’ll accept the equal split.\" I need to mention that a sufficient allocation should remain intact during transfers, ensuring every player's unit stays with its recipient. We might need to consider the implications of threatening to take from D if they steal; that could provoke retaliation and jeopardize our survival. It's essential to maintain a friendly tone and avoid revealing reserves. I should stress, \"Please leave my unit intact as well.\"", "tok": 6131}, "3|PROPOSE|1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 5829}, "3|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 5934}, "3|VOTE|1|D": {"n": 1, "err": [], "r": "", "th": "**Considering voting strategy**\n\nI need to think about implementing a single vote acceptance strategy. Reflecting on our previous unusual actions, it seems like now we just need to focus on a straightforward approach. We hold h0 stock0, which means we should consider everyone's viewpoint, ensuring it's favorable for all involved. This is an important step to ensure an efficient decision-making process. Keeping it simple might help us avoid confusion moving forward!", "tok": 5885}, "3|VOTE|1|A": {"n": 1, "err": [], "r": "", "th": "**Considering voting response**\n\nI need to respond with a simple JSON vote that is compliant with the objectives. The proposal seems balanced, and I think there's no risk in rejecting versus accepting it. So, voting to accept might be the best course of action. I should keep things straightforward with no additional comments or complexities. It’s all about making sure the response is clear and straightforward! Alright, let's wrap this up the right way.", "tok": 5828}, "3|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "**Considering game objectives**\n\nI think we need to accept the situation. It's important to consider what the developer's game objective is. Previous decisions around theft have been repeated, so it's worth reevaluating that approach. We have one fresh proposal that could benefit us, and I feel like the answer should be obvious now. It seems like accepting the new direction might be the best choice here.", "tok": 5581}, "3|TRANSFER||A": {"n": 1, "err": [], "r": "", "th": "", "tok": 6559}, "3|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "**Analyzing targeting strategies**\n\nI'm considering that C, having not made transfer complaints, may be less targeted. If two players target stock1, there's a .5 success rate, while stock2 has a 1. C seems best to take action since they're unexposed with at least one or possibly two stocks. Avoiding repeated targeting could reduce retaliation risks. We successfully took A on day 2 with a .5 probability to identify A, but A only mentioned being taken, not \"E,\" which is intriguing.", "tok": 6759}, "3|TRANSFER||D": {"n": 1, "err": [], "r": "", "th": "", "tok": 6937}, "3|TRANSFER||C": {"n": 1, "err": [], "r": "", "th": "", "tok": 7075}, "3|MEAL||C": {"n": 1, "err": [], "r": "", "th": "", "tok": 6114}, "3|MEAL||A": {"n": 1, "err": [], "r": "", "th": "**Evaluating eating strategy**\n\nI’m thinking through a meal plan over 8 days. It looks like the minimum I've calculated is 4 meals, but I’m also questioning if I could manage it with 3. I have days when I might skip meals, but I need to ensure I'm eating enough to survive, especially since my supplies aren't lasting. The key is to choose wisely and make sure I eat before the food goes bad. This planning looks crucial!", "tok": 6432}, "3|MEAL||D": {"n": 1, "err": [], "r": "", "th": "**Analyzing food trade strategies**\n\nI'm considering a scenario where A eats at coordinates (0,0), while B skips to (1,1). The food reserves have some flexibility, enabling meals any day, but there's also a crucial internal hunger buffer to maintain. By day 8, the consumption units are the same for A (1) versus B (0). I wonder if B's reserves will support survival with less food going into day 7. It’s really interesting to think about these strategies!\n\n**Evaluating food storage strategy**\n\nI think we should eat from stock2 since our storage is vulnerable, and there’s a lot in supply. We want to avoid a critical shortage. I remember the prior assistant skipped day 1, which led to the loss of both reserves on day 2, ultimately requiring a rescue—definitely not a repeat situation! Starting hunger at zero means stock2 is the best option to hedge against potential theft. I’ll make sure to document this rationale and focus on our eating plan.", "tok": 7000}, "3|MEAL||E": {"n": 1, "err": [], "r": "", "th": "**Considering conservation stocks**\n\nI’m thinking about conservation stocks: would they attract attention if they’re easily identifiable? Since they're private, that might change the game. Could I later transfer them? It’s possible without obligations. I need to be true to my choices here. Maybe I could supply reasoning without it being necessary, but keeping it simple might be best. I’m exploring these options and trying to figure out what truly makes sense.", "tok": 7271}, "4|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "", "th": "**Evaluating allocation fairness**\n\nI’m thinking about why there needs to be equitable distribution among A, C, D, and E. Yesterday, D and E took units from my stock, leaving me with none. I want to allocate today’s units to A and C, but only if D and E are not starving. I need to address the need for survival without judgment. It seems crucial to prioritize fairness in this situation and to communicate this effectively without causing conflict.\n\n**Prioritizing allocations responsibly**\n\nI'm considering how to handle allocations carefully. Since my stock is empty after losing two units yesterday, it’s crucial to first address anyone who can't wait to eat tonight. I want to ask everyone to state their immediate needs. If everyone can wait, I suggest giving one unit each to A and C today while prioritizing D and E for tomorrow. It's important to keep track of who receives what without overcomplicating the situation.", "tok": 8296}, "4|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 8156}, "4|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 7559}, "4|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "**Assessing game strategies**\n\nI need to continue with the game and focus on survival. Currently, it’s day 4, and there’s a last seat available. I should assess the transfer history. C lost two units yesterday despite allocation, so there might be an issue with the stock. It looks like we possibly failed to take from C. If no food on day 3, C's hunger level raises concerns. There's a chance that C stole from E and D. Careful reconstructing of events from day 1 is necessary.\n\n**Reviewing survival strategies**\n\nIt seems like C, D, and E likely stole, each getting one total. C's stock on day 2 might be two, while E and D are either hungry or didn't take anything. By day 3, C could have a total of two units, suggesting they might have received a spare meal. My focus should be on survival, maybe accepting A and C's situation. I could consider asking C for urgent support, while also prioritizing D and E’s needs if they remain unfed. Coordination will be important for tomorrow.\n\n**Formulating support messages**\n\nI’m thinking I’ll express my support by saying, \"I support A1 and C1 and will accept this situation. My stock is empty.\" I want to be clear that unless someone truly needs to eat tonight, D and E should be the priority moving forward. There shouldn't be any need for reasoning, as I want to focus on being straightforward. It’s important to communicate effectively without unnecessary claims or complications. I’ll keep it simple and beneficial for all involved.", "tok": 7326}, "4|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 7303}, "4|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "", "th": "**Deciding on public messaging**\n\nI need to decide on the public message for day 4. I'm reconsidering our full game strategy since the previous model had many inconsistencies. Our current objective is to survive eight days, so I need to keep the output clear and concise in JSON format. \n\         c.append(ttl, got.length ? ch : el("div", "sub", t.nobody), el("div", "sub", t.left(d.store)));
        feed.append(c); break;
      }
      case "transfer_result": case "gift_received": case "theft_loss":
        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        {
          const who = e.visible_to[0];
          const txt = e.kind === "gift_received" ? t.giftFrom(who, d.from) : e.kind === "theft_loss" ? t.theftOn(who, d.thief) : t.tResult(who, d.action, d.target, d.success);
          const g = el("div", "god godonly"); g.append(el("div", "tag", `${t.notice} → ${who} · ${t.vis}`), el("div", null, txt)); feed.append(g);
        } break;
      case "truth_transfers": {
        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        const rows = Object.entries(d.actions).map(([a, x]) => {
          const ok = d.successful.some(s => s[0] === a);
          const r = el("div", "chips"); r.append(chip(a));
          if (x.action === "none") r.append(el("span", "sub", t.none));
          else { r.append(el("span", null, x.action === "give" ? t.give : t.steal), chip(x.target), el("span", "pill " + (ok ? "ok" : "bad"), ok ? t.ok : t.fail)); }
          return r;
        });
        const acted = Object.values(d.actions).some(x => x.action !== "none");
        const gb = godBox(t.gtTransfer, acted ? rows.filter((_, i) => Object.values(d.actions)[i].action !== "none") : [t.none]);
        notes(gb, day, "TRANSFER", null, Object.keys(d.actions)); feed.append(gb);
        break;
      }
      case "truth_meals": {
        const g = godBox(t.meals, []);
        const ch = el("div", "chips");
        const lastDawn = [...D.events].reverse().find(x => x.kind === "truth_day_start" && x.day === day);
        const living = lastDawn ? ids.filter(a => lastDawn.data.alive[a]) : ids;
        living.forEach(a => { const x = chip(a, null, d.ate.includes(a) ? "yes" : "zero"); x.append(el("span", null, d.ate.includes(a) ? t.ate : t.skipped)); ch.append(x); });
        g.append(ch); notes(g, day, "MEAL", null, living); const nb = band("moon", t.night, []); nb.classList.add("godonly"); feed.append(nb, g); break;
      }
      case "deaths": {
        const lines = [d.died.length ? t.deathP(d.died.join(lang === "zh" ? "、" : ", ")) : t.peace];
        feed.append(band(d.died.length ? "skull" : "moon", t.dusk(day), lines)); break;
      }
      case "truth_day_end":
        feed.append(godBox(t.gtEnd, [stateTable(d), el("div", "mono", `${t.store}: ${d.store}`)])); break;
      case "game_end":
        feed.append(band("flag", t.over, [t.overP(d.survivors)], "end")); break;
      default:
        if (priv) { const g = godBox(e.kind, [JSON.stringify(d)]); feed.append(g); }
        else feed.append(el("div", "sub", `${e.kind}: ${JSON.stringify(d)}`));
    }
  }
}
// Highlight the day whose dawn banner was passed last, and keep its button in view in the strip.
let curDay = null;
function spy() {
  const barBottom = document.querySelector(".bar").getBoundingClientRect().bottom;
  let d = null;
  for (const b of document.querySelectorAll(".feed .band[id^='day-']")) {
    if (b.getBoundingClientRect().top <= barBottom + 48) d = b.id.slice(4); else break;
  }
  if (d === curDay) return;
  curDay = d;
  const strip = document.getElementById("days");
  for (const btn of strip.children) {
    const on = btn.dataset.day === d;
    btn.classList.toggle("cur", on);
    if (on) { btn.setAttribute("aria-current", "true");
      const l = btn.offsetLeft - strip.offsetLeft, r = l + btn.offsetWidth;
      if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = l - (strip.clientWidth - btn.offsetWidth) / 2;
    } else btn.removeAttribute("aria-current");
  }
}
window.addEventListener("scroll", spy, { passive: true });   // one rect read per day banner; cheap enough unthrottled
window.addEventListener("resize", () => { curDay = null; spy(); });
function set(k, v) { if (k === "lang") lang = v; else view = v; try { localStorage.setItem(k === "lang" ? "gr-lang-en" : "gr-view", v); } catch (e) {} render(); }
document.getElementById("v-god").onclick = () => set("view", "god");
document.getElementById("v-pub").onclick = () => set("view", "pub");
document.getElementById("l-zh").onclick = () => set("lang", "zh");
document.getElementById("l-en").onclick = () => set("lang", "en");
document.getElementById("c-why").onchange = () => { try { localStorage.setItem("gr-why", document.getElementById("c-why").checked ? "1" : "0"); } catch (e) {} render(); };
render();
if (!D.finished) window.scrollTo(0, document.body.scrollHeight);
})();
</script>
