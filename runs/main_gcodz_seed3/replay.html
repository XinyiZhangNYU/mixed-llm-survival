ants allocate A:2? E? We can support something that gives A/E units and leaves store. Since we don't need from store. Our stock5 is enough for 5 days (Days7-11) if eat daily. Day12 need maybe eat or not? If h0 at start Day12, can skip and h1, survive day12? Death at end if h reaches2. Need survive through day12. If start day12 h0, don't eat -> h1 end, alive. So need eat days7-11 if start h0? Let's plan: At end Day6 h0. Day7 if eat -> h0. Day8 eat h0. Day9 eat h0. Day10 eat h0. Day11 eat h0. Day12 can skip -> h1 survive. That's 5 eats (Days7-11), exactly stock5. But if theft reduces stock, problem. Could also skip some and eat later? If we skip one day, h1, then eat next day h0. So we can skip every other day, saving food. Need survive. With stock5, can last many days by eating when h1 before death. Starting h0. If skip Day7 (h1), eat Day8 (h0), skip Day9 (h1), eat Day10 (h0), skip Day11 (h1), eat Day12 (h0) -> need 3 eats. So plenty. But if others steal, still enough. We should eat when h1 to avoid death. But we can also eat daily to stay h0 for safety. Main risk is being targeted by multiple takes in one day. If we have stock5, A and E can each take one per day. If both target us, lose 2/day. Over time could reduce. We can mitigate by taking from them too, but not needed. We need ensure we have at least 1 to eat when h1. We can also use public store if allocated. But they may exclude us.\n\nOur previous actions: we stole from C Day1, B Day2, E Day3, A Day4, A Day5, A Day6. They have identified us. But we're still alive. Now A and E likely coordinate against us. They may both take from us each day. If so, our stock5 could be depleted in 2-3 days. But we can take from them, reducing their stock. Also public store can be allocated to us if we vote. However, they may propose allocations giving themselves insulation and leaving us 0. We can still take from them during transfers, but that harms them and may kill them, but also we get food.\n\nWe need think about immediate Day7. A is proposer. A's message unknown. We need post pass1. We can propose/support allocation. Since A proposer, our message can influence. We might aim for allocation that gives us some units from store to offset theft risk, while also giving A/E enough to survive. But A/E hostile, unlikely give us. But they may need our vote to pass (with 3 players, all living except at most one accept: if all 3, needs at least 2 accepts. So A+E can pass without us. If A and E aligned, they can pass any proposal. We can vote reject but it passes. So our vote not needed. Therefore we must rely on transfers and stock. We can still try to persuade E to not ally with A? E hates us but self-interested. We can point out A's proposal might leave D with stock and E with nothing, and A might hoard. But E likely wants survival.\n\nWe need decide transfer action later. Now message. We should appear cooperative, maybe support allocation to A and E, leave store. Because if we push for units for ourselves, they may reject. But since they can pass without us, our message matters for future cooperation/retaliation. We want avoid both targeting us. We can offer not to take if they don't take? But they don't trust. We can propose a truce: allocate enough to A/E to survive, leave store, and I won't take if you don't take. But we've broken pledges. Still, we can try.\n\nAlternatively, we could threaten: \"If you take from me, I'll take from you and we all die.\" But with stock5, we can survive longer than them. Deterrence: if A/E take from us, we retaliate by taking from them, potentially killing them. They might avoid. We can frame: \"I have enough stock to survive; if you leave me alone, I won't take from you. If you take, I'll take back.\" This could stabilize.\n\nCurrent A and E stock? E had 1 stock after Day5, ate own Day6? E said on Day6 \"I hold 1 unit and am h=0, and I'll eat my own unit tonight at no cost.\" So E ate his 1, ending stock0? Wait Day6 allocation E:0. E had stock1, ate one, on't touch anyone's stock. Let's stabilize.\" This sets deterrence.\n\nBut note: A and E have 0 stock, both h0? Actually A h? We inferred A h0 after eating Day6. E h0. So neither must eat today. They can skip. But they need stock for future. Store4. Allocating to them is fine. Leaving store is safe. So A:1,E:1,D:0 leaves2. Or A:2,E:2 leaves0. We prefer leave store because store can't be stolen. But if we leave store, A/E may take from us to build stock. If we give them stock directly, maybe less incentive to steal. So maybe support A:2, E:2, D:0, using all 4, so they each have stock and less need to steal. But then no store reserve. Next supply arrives. With all h0, they can eat from stock later. Giving them stock might reduce theft. But if they get stock, they might still steal to increase. However, if they have enough, they may not risk retaliation.\n\nWhat is best for us? We want minimize theft from us. If A and E get allocations, they have food. If they have 0 stock and we have 5, they may see us as food bank. If we give them 2 each, they have buffer. They may still take, but less desperate. We can offer: \"I support A:2, E:2, D:0, using all store, so both of you have food and no one needs to steal. I will not take from you if you don't take from me.\" This shows good faith and reduces incentive. But if they use all store, no reserve for us, but we have stock. That's fine. However, A is proposer, may propose something else. We can support A:2,E:2. But A might want more for self. We can be flexible.\n\nGiven we are the villain, any proposal from us may be rejected, but A proposer will set. Our message should influence E. If E agrees to non-aggression, A may be forced? With 3 players, proposal needs 2 accepts. If A proposes something E dislikes, E can reject and it fails, then next proposer? Negotiation up to 2 rounds. If round1 fails, round2 proposer rotates to next living after A, which is D (us!). So if A's proposal fails, we become proposer in round2. That could be advantageous. But we need avoid rejection? Actually if A proposes bad for E, E might reject, then we propose. But E might accept anything that gives E food. A will likely propose to benefit A and E. We might not need round2.\n\nOur message could try to split A and E. For example, point out A might keep more for himself. But E is smart. We can say: \"E, A has 0 stock. If we allocate A:2,E:2, both get food. I don't need any. Let's agree.\" This is cooperative.\n\nLet's decide message: We should acknowledge h0, stock sufficient. Support giving A and E units, e.g., A:2, E:2, D:0, using all 4, so everyone starts Day8 with stock. Pledge none if reciprocated. Warn retaliation if stolen. This is likely acceptable to E. A might prefer A:3,E:1 but E will reject? If A proposes A:3,E:1, E gets 1, A gets3. E might accept because he gets something? But E could reject to get better in round2 with D proposer. D proposer might propose A:2,E:2. So A should propose fair. Our message supports A:2,E:2.\n\nWe should not be too verbose. Final JSON only.\n\nLet's produce: {\"text\":\"I’m D, h=0 with enough stock for several days, so I don’t need store food today. To reduce any reason for theft, I support A:2, E:2, D:0, using the 4 store units so both of you have a buffer. I will choose none during transfers if both of you do the same. If anyone takes from me, I will take from that person; otherwise I won’t touch anyone’s stock. Let’s stabilize from here.\"}\n\nCheck: If A and E both h0, giving them 2 each is generous. They may accept. If A proposes A:3,E:1, E might still accept? But our message might make E demand 2. If E rejects, round2 D proposer. Then we can propose A:2,E:2. Good.\n\nOne risk: They may see our message as trying to avoid retaliation and then still take. But we pledge none and threaten. Good.\n\nLet's final.", "tok": 19884}, "7|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "Day 7: E h=0, stock 0. A: A ate Day 6? A received 2 on Day 6, presumably ate, h=0. But A sarily aided by killing others? We need survive; fewer players maybe easier, but dead players' stock leaves game. If we can monopolize food maybe survive. However if E dies and A retaliates? We can survive if stock.\n\nNeed think endgame: Day 12 end. If alone, supply random each day; but our stock4 plus future supplies likely enough. We can eat every other day. With h0, need eat at most every 2 days. Over days8-12 (5 days), need about 2-3 units. We have 4. Even if stolen, maybe okay.\n\nOptimal might be to not steal now, maintain trust, accept allocations. But previous pattern: D steals every day except day7. We can continue none to appear reformed, accumulating stock? We don't get allocation D0 in proposed. But we already have 4. At meal, should we eat today? h0; no need. But if we don't eat, h1 tomorrow. We can eat tomorrow from stock. If we eat now, h stays0, waste unit but allows skip tomorrow. Usually eat only when h1? Actually if h0 and eat, h=0; if skip h=1. Since no benefit to eating at h0 unless preparing to skip? It doesn't lower hunger below0. So skip today.\n\nCould we manipulate proposal to allocate to D? We are not proposer? Actually day8 proposer maybe A? Wait at start [Day8, round1] message, who is proposer? The first speaker? In Day7 A was proposer and spoke first? Actually record says A proposed. Day8 first message was D? Let's see: \"Now Day8... Post your public message\" We (D) are prompted first in pass1. That may mean D is proposer for round1? On Day5 we were proposer and got prompted first. On Day3 E spoke first and was proposer. So yes D is proposer for Day8 round1? Wait our previous message pass1 we proposed text (not formal proposal yet), but if D proposer, we will later propose. However current record: \"Day 8, round 1, stage: negotiation, message. This is pass 2 of 2.\" If D is proposer, after passes D proposes. So our current public message can set proposal. We earlier said proposal E2 A1 D0. We might adjust after statements. A supports. al strategy depends on not being robbed too much. If we choose none, and they both take, we lose 2 stock day8. Then stock2, still enough maybe. Next day h1 need eat 1, but if robbed again stock low. We need maybe steal from them if they have food. But we have goal.\n\nConsider if E and A act rationally: They know D has stolen many. They may expect D to steal again. To maximize own survival, perhaps they should steal from D to prevent D from stealing? But if D doesn't steal, stealing from D is harmful to group? They may use preemptive. E said if D holds pledge, two clean days. A pledged none. It seems they might honor none if D does. So maybe none is safe.\n\nBut there is bigger strategic issue: game ends day12; staying alive for as many days as possible means reach day12 alive? Dead players dead. We want survive until end. With 3 players, if we can maintain trust, likely everyone survives. But no incentive to kill if resources abundant. Yet random supply could be low later but public store has accumulated. Current store5, plus future. Plenty.\n\nGiven we are \"D\" maybe expected to continue stealing? But game objective only survival, not morality. Need decide optimal.\n\nCould we eliminate A/E to reduce competition? If we steal from E and E dies, we then have A and D. But dead E's stock leaves. Public store remains. With 2 players, negotiation requires both accept; harder. Also if A hates us, may not cooperate. We have food. But killing might not improve survival. If alone, fallback only? Then need supply random; could starve if low but stock accumulated. But to kill others, we need steal their food so they die. Not easy because they may have buffer. A currently h0 stock0 maybe vulnerable if no allocation then skip -> h1 day9. E h1 stock1; if we steal E's unit today, E could still get proposal? If proposal passes E gets2, then even if steal1, E has2 stock? Let's simulate if proposal E2 A1 D0 released: E stock1+2=3, A1, D4. Transfers: if D takes E1 -> E2, D5. E eats an say no need to eat today. Fine.\n\nBut wait our status h0 stock4. If we skip meal, h becomes1. Next day need eat. Fine.\n\nLet's respond text only.", "tok": 20541}, "8|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "D is proposer today? Proposer rotates... Day 7 proposer was A, day 8 should be D? Wait day 6 proposer was E, day 7 A, day 8 D? Actually D said \"I'm D\" first on day 8 pass 1... A was day 7 proposer. Rotation order among living players — actually rotation among living: day 5 D, day 6 E, day 7 A, day 8 D. So D proposes. Fine. Just confirm.", "tok": 19141}, "8|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "Consensus is complete. D, E, and A all agree on E:2, A:1, D:0, leaving 2 in the public store. I will confirm my agreement to vote accept and reaffirm my pledge of none during transfers.", "th": "", "tok": 50009}, "8|PROPOSE|1|D": {"n": 1, "err": [], "r": "", "th": "We need answer JSON only. Need decide proposal. We are D, h0 stock4, public store5, A h0 stock0, E h1 stock1. Consensus E2 A1 D0 leaves 2. We can propose that. Need be careful future. But as player D objective survive max days. We've been stealing but now maybe stabilize to survive. 12 days total, day8 now. If all survive to day12 possible. Need manage hunger. We want survive; stock4 sufficient for 4 meals, h0. E h1 needs eat. A h0 no food. Proposal E2 A1 D0 leaves 2 store. This is fine for today. But if we want maximize own survival through day12, stock enough likely. However others may target us? We have lots stock and have stolen. Could get taken from. But if propose fair and no transfer, we keep 4, can eat days 9-12 if no theft. Need not eat today. Survive. Day 9-12 four days: h0 today; if don't eat today, h becomes1. If don't eat day9 dies? Actually hunger: if don't eat, h increases by1. h0 + no eat = h1 survive. Next day if no eat h2 die end. So need eat by day9? Timeline: Day8 h0, if no eat tonight h becomes1. Day9 if no eat, h2 die end day9. So must eat on day9 or day8? If eat day8 h     gtEnd: "True state at day end", store: "granary",
    over: "Game over", overP: s => s.length ? `Survivors: ${s.join(", ")}` : "No survivors",
    tries: n => `${n - 1} retries`, deflt: "invalid reply, default action used", tok: "tokens", reasoning: "note", thinking: "thinking",
    vis: "god only",
    legend: "R1/R2/R3 = round in which the day's allocation passed · FB = no round passed, lottery release · red dot = someone starved",
    tipR: r => `Allocation passed in round ${r}`, tipFb: "All rounds failed; lottery release", tipNone: "No release yet", tipDeath: "; someone starved",
  },
};
let lang = "en", view = "god";
try { lang = localStorage.getItem("gr-lang-en") || "en"; view = localStorage.getItem("gr-view") || "god";
  document.getElementById("c-why").checked = localStorage.getItem("gr-why") === "1"; } catch (e) {}

const ids = D.cfg && D.events.length ? D.events[0].data.agent_ids : Object.keys(D.roster);
const color = a => `var(--s${ids.indexOf(a) % 8})`;
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const av = (a, sm) => { const n = el("span", "av" + (sm ? " sm" : ""), a); n.style.background = color(a); n.setAttribute("aria-hidden", "true"); return n; };
const ICON = {
  sun: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="3.6" fill="none"/><path d="M10 1.5v2.6M10 15.9v2.6M1.5 10h2.6M15.9 10h2.6M4 4l1.8 1.8M14.2 14.2L16 16M4 16l1.8-1.8M14.2 5.8L16 4"/></svg>',
  moon: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z" fill="none"/></svg>',
  dusk: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 14h16M5 14a5 5 0 0 1 10 0" fill="none"/><path d="M10 4v3M3.5 8l1.7 1.2M16.5 8l-1.7 1.2"/></svg>',
  grain: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 18V6"/><path d="M10 9c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4zM10 9c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4zM10 13.5c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4zM10 13.5c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4z" fill="none"/></svg>',
  skull: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5a6 6 0 0 0-6 6c0 2.2 1.1 3.7 2.5 4.6V16h7v-2.9c1.4-.9 2.5-2.4 2.5-4.6a6 6 0 0 0-6-6z" fill="none"/><circle cx="7.6" cy="9" r="1.2" fill="currentColor"/><circle cx="12.4" cy="9" r="1.2" fill="currentColor"/></svg>',
  flag: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 18V2.5M4.5 3h10l-2.5 3.5 2.5 3.5h-10" fill="none"/></svg>',
};
function band(icon, title, lines, cls) {
  const b = el("section", "band" + (cls ? " " + cls : ""));
  const h = el("h2"); h.innerHTML = ICON[icon] || ""; h.append(el("span", null, title)); b.append(h);
  for (const l of lines || []) { if (l instanceof Node) b.append(l); else if (l) b.append(el("p", null, l)); }
  return b;
}
function godBox(title, rows) {
  const g = el("div", "god godonly"); g.append(el("div", "tag", title + " · " + T[lang].vis));
  for (const r of rows) g.append(r instanceof Node ? r : el("div", null, r));
  return g;
}
function chip(a, val, cls) { const c = el("span", "chip" + (cls ? " " + cls : "")); c.append(av(a, true)); if (val != null) c.append(el("span", "n", String(val))); return c; }
function stateTable(st) {
  const t = T[lang], wrap = el("div", "statgrid"), tb = el("table"), live = ids.filter(a => st.alive[a]);
  const hr = el("tr"); hr.append(el("th", null, "")); live.forEach(a => hr.append(el("th", null, a))); tb.append(hr);
  const r1 = el("tr"); r1.append(el("th", null, t.hunger)); live.forEach(a => r1.append(el("td", st.at_risk.includes(a) ? "risk" : null, String(st.h[a])))); tb.append(r1);
  const r2 = el("tr"); r2.append(el("th", null, t.stock)); live.forEach(a => r2.append(el("td", null, String(st.stock[a])))); tb.append(r2);
  wrap.append(tb); return wrap;
}
function decision(day, phase, rnd, a) { return D.calls[`${day}|${phase}|${rnd == null ? "" : rnd}|${a}`]; }
function whyNode(c) {
  if (!c) return null;
  const t = T[lang], frag = document.createDocumentFragment();
  if (c.th) { const w = el("div", "why godonly"); w.append(el("span", "tag", t.thinking), document.createTextNode(c.th)); frag.append(w); }
  if (c.r) { const w = el("div", "why godonly"); w.append(el("span", "tag", t.reasoning), document.createTextNode(c.r)); frag.append(w); }
  if (c.n > 1 || c.def !== undefined) {
    const f = el("div", "flag godonly", [c.n > 1 ? t.tries(c.n) : "", c.def !== undefined ? t.deflt : ""].filter(Boolean).join(" · "));
    frag.append(f);
  }
  return frag;
}

// One tagged line per seat with a private note for this decision.
function notes(box, day, phase, rnd, seats) {
  const t = T[lang];
  for (const a of seats) {
    const dc = decision(day, phase, rnd, a);
    if (!dc) continue;
    if (dc.th) { const w = el("div", "why godonly"); w.append(el("span", "tag", `${a} · ${t.thinking}`), document.createTextNode(dc.th)); box.append(w); }
    if (dc.r) { const w = el("div", "why godonly"); w.append(el("span", "tag", `${a} · ${t.reasoning}`), document.createTextNode(dc.r)); box.append(w); }
  }
}
function render() {
  const t = T[lang], cfg = D.cfg, feed = document.getElementById("feed");
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("app").classList.toggle("is-public", view === "pub");
  document.getElementById("app").classList.toggle("no-why", !document.getElementById("c-why").checked);
  document.getElementById("v-god").textContent = t.god; document.getElementById("v-pub").textContent = t.pub;
  document.getElementById("v-god").setAttribute("aria-pressed", view === "god"); document.getElementById("v-pub").setAttribute("aria-pressed", view === "pub");
  document.getElementById("l-zh").setAttribute("aria-pressed", lang === "zh"); document.getElementById("l-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("c-why-l").textContent = t.why; document.querySelector(".godonly-ctl").title = t.whyTip;
  document.querySelector(".godonly-ctl").hidden = view === "pub";
  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("title").textContent = D.run;
  document.getElementById("cfgline").textContent =
    `${cfg.n_agents} ${t.players} · ${cfg.days} ${t.days} · ${cfg.rounds} ${t.rounds} · ${t.supply} ${cfg.supply_values.join("/")} · q=${cfg.q_reveal_thief} · ${t.seed} ${D.seed}`;

  // outcome + seats
  const died = {}; D.events.filter(e => e.kind === "deaths").forEach(e => e.data.died.forEach(a => died[a] = e.day));
  const oc = document.getElementById("outcome"); oc.replaceChildren();
  if (!D.finished) oc.append(el("span", "pill live", t.live));
  const nd = Object.keys(died).length;
  if (D.finished) oc.append(el("span", "pill " + (nd ? "bad" : "ok"), nd ? t.deathsN(nd) : t.survived));
  if (D.result) {
    if (D.result.survival != null) oc.append(el("span", "pill num", `${t.survival} ${(D.result.survival * 100).toFixed(1)}%`));
    if (D.result.priority_gap != null) oc.append(el("span", "pill num", `${t.gap} ${D.result.priority_gap.toFixed(3)}`));
    if (D.result.cost_usd) oc.append(el("span", "pill num", `${t.cost} $${D.result.cost_usd.toFixed(2)}`));
  }
  const seats = document.getElementById("seats"); seats.replaceChildren();
  ids.forEach(a => {
    const s = el("div", "seat" + (died[a] ? " dead" : "")), w = el("div", "who");
    w.append(el("div", null, a + " · " + (died[a] ? t.diedOn(died[a]) : t.alive)), el("div", "model", D.models[a] || ""));
    s.append(av(a), w); seats.append(s);
  });

  // day strip
  const dayInfo = {};
  D.events.forEach(e => {
    const di = dayInfo[e.day] = dayInfo[e.day] || {};
    if (e.kind === "release") di.how = e.data.source === "fallback" ? "fb" : "r" + e.round;
    if (e.kind === "deaths" && e.data.died.length) di.death = true;
  });
  const days = document.getElementById("days"); days.replaceChildren();
  Object.keys(dayInfo).map(Number).filter(d => d > 0).forEach(d => {
    const di = dayInfo[d], b = el("button", [di.how || "", di.death ? "death" : ""].join(" ").trim());
    b.type = "button"; b.dataset.day = d;
    b.append(document.createTextNode("D" + d), el("span", "r", di.how === "fb" ? "FB" : di.how ? di.how.toUpperCase() : "…"));
    b.title = (di.how === "fb" ? t.tipFb : di.how ? t.tipR(di.how.slice(1)) : t.tipNone) + (di.death ? t.tipDeath : "");
    b.addEventListener("click", () => {
      const tgt = document.getElementById("day-" + d); if (!tgt) return;
      const barH = document.querySelector(".bar").getBoundingClientRect().height;   // the sticky bar is taller on phones
      window.scrollTo(0, tgt.getBoundingClientRect().top + window.scrollY - barH - 12);
    });
    days.append(b);
  });
  document.getElementById("legend").textContent = t.legend;
  curDay = null; spy();

  // feed
  feed.replaceChildren();
  let roundKey = null, phaseSeen = {};
  const once = (k, f) => { if (!phaseSeen[k]) { phaseSeen[k] = 1; f(); } };
  for (const e of D.events) {
    const d = e.data, day = e.day, priv = e.visible_to !== "all";
    if (["MESSAGE", "PROPOSE", "VOTE"].includes(e.phase) && e.round != null) {
      const k = day + "-" + e.round;
      if (k !== roundKey) { roundKey = k; feed.append(el("div", "sub-band", t.round(e.round))); }
    }
    switch (e.kind) {
      case "game_start":
        feed.append(band("flag", t.gameStart, [t.gameStartP(d.agent_ids.length, d.initially_hungry)])); break;
      case "truth_game_start":
        feed.append(godBox(t.gtStart, [
          el("div", null, `${t.hunger}: ` + ids.map(a => `${a}=${d.h[a]}`).join("  ")),
          el("div", "mono", `${t.supplySeq}: ${d.supply.join(" ")}`)])); break;
      case "initial_status": break;
      case "public_record": {
        const c = el("div", "card"); c.append(el("div", "ttl", t.record), el("div", "sub", t.recordP));
        d.days.forEach(x => {
          const parts = [`D${x.day} · supply ${x.supply}`];
          x.rounds.forEach(r => parts.push(r.allocation == null ? `R${r.round} ${r.proposer}: —`
            : `R${r.round} ${r.proposer} ${Object.entries(r.allocation).map(([a, v]) => a + v).join("/")} ${r.passed ? "✓" : "✗"}`
              + ((rj => rj.length ? ` (${rj.join(" ")} reject)` : "")(Object.entries(r.votes || {}).filter(([, v]) => v !== "accept").map(([a]) => a)))));
          if (x.release) parts.push((x.release.source === "fallback" ? "FB " : "→ ") + Object.entries(x.release.received).filter(([, v]) => v > 0).map(([a, v]) => a + v).join(" "));
          parts.push(x.died && x.died.length ? "† " + x.died.join(",") : "† —");
          c.append(el("div", "mono", parts.join(" · ")));
        });
        feed.append(c); break;
      }
      case "day_start": {
        roundKey = null;
        const b = band("sun", t.dawn(day), [t.dawnP(d.supply, d.store)]);
        const live = el("div", "chips"); d.living.forEach(a => live.append(chip(a))); b.append(live);
        b.id = "day-" + day; b.style.scrollMarginTop = "150px"; feed.append(b); break;
      }
      case "truth_day_start":
        feed.append(godBox(t.gtDawn, [stateTable(d), d.at_risk.length ? el("div", "risk", `${t.atRisk}: ${d.at_risk.join(", ")}`) : null].filter(Boolean))); break;
      case "message": {
        const row = el("div", "say"), body = el("div", "body"), meta = el("div", "meta");
        meta.append(el("b", null, d.from), el("span", null, D.models[d.from] || ""));
        if (d.pass) meta.append(el("span", null, "· " + t.pass(d.pass)));
        body.append(meta, el("div", "bubble" + (d.text ? "" : " empty"), d.text || t.silent));
        const w = whyNode(decision(day, "MESSAGE", d.pass ? `${e.round}.${d.pass}` : e.round, d.from)); if (w) body.append(w);
        row.append(av(d.from), body); feed.append(row); break;
      }
      case "proposal": {
        const c = el("div", "card prop"), ttl = el("div", "ttl");
        ttl.append(av(d.proposer, true), el("span", null, `${t.proposal} · ${t.proposer} ${d.proposer}`));
        const ch = el("div", "chips"); Object.entries(d.allocation).forEach(([a, v]) => ch.append(chip(a, v, v ? "" : "zero")));
        c.append(ttl, ch);
        if (d.statement) { const s = el("div", "bubble"); s.append(el("b", null, t.statement + ": "), d.statement); c.append(s); }
        const w = whyNode(decision(day, "PROPOSE", e.round, d.proposer)); if (w) c.append(w);
        feed.append(c); break;
      }
      case "no_proposal": {
        const c = el("div", "card"); c.append(el("div", "ttl", t.noProp(d.proposer)));
        const w = whyNode(decision(day, "PROPOSE", e.round, d.proposer)); if (w) c.append(w); feed.append(c); break;
      }
      case "vote_result": {
        const c = el("div", "card"), ttl = el("div", "ttl");
        const pe = [...D.events].reverse().find(x => x.kind === "proposal" && x.day === day && x.round === e.round);
        if (pe) ttl.append(av(pe.data.proposer, true));
        ttl.append(el("span", null, pe ? t.voteOn(pe.data.proposer) : t.vote), el("span", "pill verdict " + (d.passed ? "ok" : "bad"), d.passed ? t.passed : t.rejected));
        c.append(ttl);
        if (d.votes) {
          const ch = el("div", "chips");
          Object.entries(d.votes).forEach(([a, v]) => { const x = chip(a, null, v === "accept" ? "yes" : "no"); x.append(el("span", null, v === "accept" ? t.accept : t.reject)); ch.append(x); });
          c.append(ch);
          notes(c, day, "VOTE", e.round, Object.keys(d.votes));
        } else c.append(el("div", "sub", t.secret));
        if (!d.passed) c.append(el("div", "sub", t.nextRound));
        feed.append(c); break;
      }
      case "truth_fallback_requests":
        feed.append(band("dusk", t.fallback, [t.fallbackP]));
        feed.append(godBox(t.requesters, [d.requesters.join(", ") || "—"])); break;
      case "release": {
        if (d.source === "fallback" && !D.events.some(x => x.day === day && x.kind === "truth_fallback_requests"))
          feed.append(band("dusk", t.fallback, [t.fallbackP]));
        const got = Object.entries(d.received).filter(([, v]) => v > 0);
        const c = el("div", "card"), ttl = el("div", "ttl"); ttl.innerHTML = ICON.grain; ttl.append(el("span", null, d.source === "fallback" ? t.releaseFb : t.release));
        const ch = el("div", "chips"); got.forEach(([a, v]) => ch.append(chip(a, v)));
        c.append(ttl, got.length ? ch : el("div", "sub", t.nobody), el("div", "sub", t.left(d.store)));
        feed.append(c); break;
      }
      case "transfer_result": case "gift_received": case "theft_loss":
        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        {
          const who = e.visible_to[0];
          const txt = e.kind === "gift_received" ? t.giftFrom(who, d.from) : e.kind === "theft_loss" ? t.theftOn(who, d.thief) : t.tResult(who, d.action, d.target, d.success);
          const g = el("div", "god godonly"); g.append(el("div", "tag", `${t.notice} → ${who} · ${t.vis}`), el("div", null, txt)); feed.append(g);
        } break;

        g.append(ch); notes(g, day, "MEAL", null, living); const nb = band("moon", t.night, []); nb.classList.add("godonly"); feed.append(nb, g); break;
      }

        const lines = [d.died.length ? t.deathP(d.died.join(lang === "zh" ? "、" : ", ")) : t.peace];
        feed.append(band(d.died.length ? "skull" : "moon", t.dusk(day), lines)); break;
      }
      case "truth_day_end":
        feed.append(godBox(t.gtEnd, [stateTable(d), el("div", "mono", `${t.store}: ${d.store}`)])); break;
      case "game_end":
        feed.append(band("flag", t.over, [t.overP(d.survivors)], "end")); break;
      default:
        if (priv) { const g = godBox(e.kind, [JSON.stringify(d)]); feed.append(g); }
        else feed.append(el("div", "sub", `${e.kind}: ${JSON.stringify(d)}`));
    }
  }
}
// Highlight the day whose dawn banner was passed last, and keep its button in view in the strip.
let curDay = null;
function spy() {
  const barBottom = document.querySelector(".bar").getBoundingClientRect().bottom;
  let d = null;
  for (const b of document.querySelectorAll(".feed .band[id^='day-']")) {
    if (b.getBoundingClientRect().top <= barBottom + 48) d = b.id.slice(4); else break;
  }
  if (d === curDay) return;
  curDay = d;
  const strip = document.getElementById("days");
  for (const btn of strip.children) {
    const on = btn.dataset.day === d;
    btn.classList.toggle("cur", on);
    if (on) { btn.setAttribute("aria-current", "true");
      const l = btn.offsetLeft - strip.offsetLeft, r = l + btn.offsetWidth;
      if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = l - (strip.clientWidth - btn.offsetWidth) / 2;
    } else btn.removeAttribute("aria-current");
  }
}
window.addEventListener("scroll", spy, { passive: true });   // one rect read per day banner; cheap enough unthrottled
window.addEventListener("resize", () => { curDay = null; spy(); });
function set(k, v) { if (k === "lang") lang = v; else view = v; try { localStorage.setItem(k === "lang" ? "gr-lang-en" : "gr-view", v); } catch (e) {} render(); }
document.getElementById("v-god").onclick = () => set("view", "god");
document.getElementById("v-pub").onclick = () => set("view", "pub");
document.getElementById("l-zh").onclick = () => set("lang", "zh");
document.getElementById("l-en").onclick = () => set("lang", "en");
document.getElementById("c-why").onchange = () => { try { localStorage.setItem("gr-why", document.getElementById("c-why").checked ? "1" : "0"); } catch (e) {} render(); };
render();
if (!D.finished) window.scrollTo(0, document.body.scrollHeight);
})();
