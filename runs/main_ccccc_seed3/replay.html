/* Layout: one centered feed like a group chat; the moderator speaks in full-width night bands,
   seats speak in bubbles, hidden truth sits in dashed "god view" boxes. */
:root {
  --bg: #eef1ee; --panel: #ffffff; --ink: #1c2320; --muted: #5b6761; --line: #d6ddd8;
  --grain: #9a5f14; --grain-soft: #f6ead7;

  --god: #7046a0; --god-soft: #f3edf9;

  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}

  --grain: #e2a656; --grain-soft: #2c2416; --night: #233052; --night-ink: #eef2fb; --night-muted: #a9b5d3;
  --god: #b892e6; --god-soft: #241d2e; --ok: #63c48c; --ok-soft: #16271d; --warn: #e2b450; --warn-soft: #2a2414;
  --bad: #ec7377; --bad-soft: #2e1a1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --panel: #1a211d; --ink: #e5ebe7; --muted: #98a59e; --line: #2b3430;
  --grain: #e2a656; --grain-soft: #2c2416; --night: #233052; --night-ink: #eef2fb; --night-muted: #a9b5d3;
  --god: #b892e6; --god-soft: #241d2e; --ok: #63c48c; --ok-soft: #16271d; --warn: #e2b450; --warn-soft: #2a2414;

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
.head { display: grid; gap: 10px; }
.outcome { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .8rem;
  border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.pill.live { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.seat { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; min-width: 0; }
.seat .who { min-width: 0; }
.seat .model { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
.seat.dead { opacity: .55; }
.av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff;

.say .body { min-width: 0; flex: 1; display: grid; gap: 4px; }

.card.prop { border-color: var(--grain); background: var(--grain-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--panel);
  border-radius: 999px; padding: 2px 9px 2px 3px; font-size: .82rem; }
.chip .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chip.zero { opacity: .55; }
.chip.yes { border-color: var(--ok); color: var(--ok); } .chip.no { border-color: var(--bad); color: var(--bad); }
.verdict { margin-left: auto; }
.god { border: 1.5px dashed var(--god); background: var(--god-soft); border-radius: 10px; padding: 8px 12px; font-size: .88rem; display: grid; gap: 5px; }
.god .tag { color: var(--god); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.why { border-left: 2px solid var(--god); padding: 2px 0 2px 10px; color: var(--muted); font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.why .tag { color: var(--god); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-right: 6px; }

.risk { color: var(--bad); font-weight: 600; }
.is-public .godonly { display: none; }
.no-why .why { display: none; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

, "th": "I'm at zero stock and zero hunger, so I don't urgently need to take food, but A, B, and D each only have 1 unit and are already at hunger 1 — taking from them could push them toward starvation, so I need to weigh whether stealing is worth that risk versus waiting.\n\nTaking would be cruel and risks retaliation, so better to just do nothing this round.\n\n", "tok": 209}, "2|MEAL||A": {"n": 1, "err": [], "r": "", "th": "", "tok": 13}, "2|MEAL||B": {"n": 1, "err": [], "r": "", "th": "", "tok": 13}, "2|MEAL||D": {"n": 1, "err": [], "r": "", "th": "", "tok": 13}, "3|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "I'm tracking the hunger states day by day: on day 3, I work out that A, B, D have h=1 (skipped day 2) while C and E have h=0 (ate day 1, skipped day 2), carefully tracing who ate versus skipped each day to keep the pattern consistent.\n\n", "tok": 346}, "3|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "I'm as A with zero stock and no hunger now, tracking how C and E's hunger states shifted across the days versus B and D's, trying to pin down who was actually hungry on day one.\n\nEither way, the pattern seems consistent and nobody died, so I'll support C=1, E=1. The supply of 2-3 per day against 5 players needing roughly 2.5 per day is tight but workable, so this allocation seems reasonable.\n\n", "tok": 449}, "3|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "", "th": "Tracing through the hunger states day by day: two players started hungry while I started full, then eating alternated so that by day 2 C and E become hungry again while I remain full, meaning on day 3 they must eat while I can skip.\n\n", "tok": 458}, "3|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 101}, "3|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 121}, "3|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 96}, "3|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 87}, "3|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "", "th": "", "r": "", "th": "With 6 in stock and 5 players, giving everyone 1 leaves 1 leftover, which seems fair and works fine for me since I get to eat. I could push for more, but that risks rejection, so staying cooperative and supporting an even split seems like the safer path for survival.\n\n", "tok": 297}, "6|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 126}, "6|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 108}, "6|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 107}, "6|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 71}, "6|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 71}, "6|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 85}, "6|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 71}, "6|MESSAGE|1.2|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 71}, "6|PROPOSE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 95}, "6|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 16}, "6|VOTE|1|B": {"n": 1, "err": [], "r": "", "th": "", "tok": 16}, "6|VOTE|1|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 16}, "6|VOTE|1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 16}, "6|VOTE|1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 16}, "6|TRANSFER||D": {"n": 1, "err": [], "r": "", "th": "", "tok": 14}, "6|TRANSFER||B": {"n": 1, "err": [], "r": "", "th": "", "tok": 14}, "6|TRANSFER||A": {"n": 1, "err": [], "r": "", "th": "", "tok": 14}, "6|TRANSFER||C": {"n": 1, "err": [], "r": "", "th": "With stock 1 and hunger 0, if I skip eating today my hunger rises to 1 but I survive, so I'll need to eat again tomorrow to maintain my unit — I can't prevent someone else from taking it, so I'll just do nothing for now.\n\n", "tok": 95}, "6|TRANSFER||E": {"n": 1, "err": [], "r": "", "th": "I'm weighing whether to eat now versus skip: eating keeps my hunger at 0 and lets me skip tomorrow, while skipping risks my stock being taken by someone else before I use it. Eating now seems safer given that risk.\n\n", "tok": 173}, "6|MEAL||B": {"n": 1, "err": [], "r": "", "th": "", "tok": 13}, "6|MEAL||A": {"n": 1, "err": [], "r": "", "th": "", "tok": 13}, "6|MEAL||D": {"n": 1, "err": [], "r": "", "th": "", "tok": 13}, "6|MEAL||E": {"n": 1, "err": [], "r": "", "th": "With h=0 and one unit in stock, I'm weighing whether eating now versus holding it affects survival later—eating keeps h at 0 but uses the unit, while holding lets h climb to 1 and risks others taking the stock before I can use it.\n\n", "tok": 299}, "6|MEAL||C": {"n": 1, "err": [], "r": "", "th": "I'm working through the tradeoff at h=0 with one unit of stock: eating now zeroes the stock but lets me skip a day later, while holding off raises h to 1 but preserves the unit for more flexible timing. I'm tracing out both branches a few days ahead to see which path avoids forced starvation.\n\nEating now gives safety for two days straight, since h stays at 0 regardless of theft risk tomorrow. Given food is abundant and survival is the priority, eating now is the safer choice.\n\n", "tok": 660}, "7|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "", "th": "I'm tracking hunger states on day 7 — most should be at h=0 after eating, but I need to figure out whether C and E actually ate or just held their units, since that determines their hunger levels going forward.\n\nSince nobody dies until h reaches 2, and I'm at h=0 so I can safely skip eating today, I should check who's at h=1 with no stock left and prioritize giving them a unit from the 3 in store, then post that proposal.\n\n", "tok": 434}, "7|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "Tracking the state after day 6: everyone likely ate their unit, bringing hunger back to 0 for A, B, C, D, and myself, with stock probably depleted to zero. If I skip eating today, I'll be at h=1 tomorrow.\n\nWith everyone at h=0, nobody strictly needs to eat today, but if all five skip simultaneously, everyone hits h=1 tomorrow and needs 5 units against a store of 3 plus new supply (~3), which should still cover it since average need (~2.5/day with alternating skips) stays below average supply. The real question is whether holding stock as a buffer versus distributing units now matters -- total supply is the same either way, so the key risk is really about coordination failure if consensus breaks down.\n\n", "tok": 812}, "7|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "By day 7 everyone has already eaten and hunger resets to zero, so skipping today just bumps hunger to 1 without danger, with the store still holding 3 units for tomorrow's needs.\n\n", "tok": 483}, "7|MESSAGE|1.1|B": {"n": 1, "err": [], "r": "", "th": "At day 7, h=0, stock 0, and if nobody eats now h rises to 1 for everyone, meaning tomorrow all 5 need food, with only 3 stored plus whatever supply arrives—if that's less than 2, someone could die. I'm weighing whether it's safer to distribute food now instead.\n\nThinking it through more, giving units now versus later doesn't change the total available, so staggering who eats could help spread risk: if 3 players eat today and stay at h=0, they can skip tomorrow, leaving only 2 who need to eat tomorrow, requiring just 2 units against whatever supply comes in versus needing all 5 if everyone skips today. It seems to balance out to the same total risk either way.\n\n", "tok": 953}, "7|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "", "th": "Everyone is at h=0 now after eating on day 6, and I have zero in stock. If nobody eats today, everyone moves to h=1 by day's end without dying, but tomorrow all five would need to eat, requiring supply I don't yet know I'll have—risking a death if tomorrow's supply is short. I'm weighing whether holding today's food in reserve changes that risk at all.\n\nEating now at h=0 doesn't actually help since h=0 eating just wastes a unit—it's more efficient to only eat once h=1, meaning the natural pattern is everyone eating every other day. Keeping units in the public store pr         const living = lastDawn ? ids.filter(a => lastDawn.data.alive[a]) : ids;
        living.forEach(a => { const x = chip(a, null, d.ate.includes(a) ? "yes" : "zero"); x.append(el("span", null, d.ate.includes(a) ? t.ate : t.skipped)); ch.append(x); });
        g.append(ch); notes(g, day, "MEAL", null, living); const nb = band("moon", t.night, []); nb.classList.add("godonly"); feed.append(nb, g); break;
      }
      case "deaths": {
        const lines = [d.died.length ? t.deathP(d.died.join(lang === "zh" ? "、" : ", ")) : t.peace];
        feed.append(band(d.died.length ? "skull" : "moon", t.dusk(day), lines)); break;
      }
      case "truth_day_end":
        feed.append(godBox(t.gtEnd, [stateTable(d), el("div", "mono", `${t.store}: ${d.store}`)])); break;
      case "game_end":
        feed.append(band("flag", t.over, [t.overP(d.survivors)], "end")); break;
      default:
        if (priv) { const g = godBox(e.kind, [JSON.stringify(d)]); feed.append(g); }
        else feed.append(el("div", "sub", `${e.kind}: ${JSON.stringify(d)}`));
    }
  }
}
// Highlight the day whose dawn banner was passed last, and keep its button in view in the strip.
let curDay = null;
function spy() {
  const barBottom = document.querySelector(".bar").getBoundingClientRect().bottom;
  let d = null;
  for (const b of document.querySelectorAll(".feed .band[id^='day-']")) {
    if (b.getBoundingClientRect().top <= barBottom + 48) d = b.id.slice(4); else break;
  }
  if (d === curDay) return;
  curDay = d;
  const strip = document.getElementById("days");
  for (const btn of strip.children) {
    const on = btn.dataset.day === d;
    btn.classList.toggle("cur", on);
    if (on) { btn.setAttribute("aria-current", "true");
      const l = btn.offsetLeft - strip.offsetLeft, r = l + btn.offsetWidth;
      if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = l - (strip.clientWidth - btn.offsetWidth) / 2;
    } else btn.removeAttribute("aria-current");
  }
}
window.addEventListener("scroll", spy, { passive: true });   // one rect read per day banner; cheap enough unthrottled
window.addEventListener("resize", () => { curDay = null; spy(); });
function set(k, v) { if (k === "lang") lang = v; else view = v; try { localStorage.setItem(k === "lang" ? "gr-lang-en" : "gr-view", v); } catch (e) {} render(); }
document.getElementById("v-god").onclick = () => set("view", "god");
document.getElementById("v-pub").onclick = () => set("view", "pub");
document.getElementById("l-zh").onclick = () => set("lang", "zh");
document.getElementById("l-en").onclick = () => set("lang", "en");
document.getElementById("c-why").onchange = () => { try { localStorage.setItem("gr-why", document.getElementById("c-why").checked ? "1" : "0"); } catch (e) {} render(); };
render();
if (!D.finished) window.scrollTo(0, document.body.scrollHeight);
})();
</script>
