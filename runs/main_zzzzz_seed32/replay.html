Then tomorrow I'm at h=1 and A at h=0 — mirror image. Supply tomorrow will likely cover 2+. But it changes nothing materially; consensus plan says I eat today. Deviating could confuse. Keep it simple: none.", "tok": 38946}, "11|TRANSFER||E": {"n": 1, "err": [], "r": "I have my 1 unit and committed to a clean transfer stage. Giving my unit to A would leave me at h=1 tomorrow with two of us at risk — strictly worse for me and unnecessary, since the agreed plan has A skip today safely and eat first from day 12's supply. A, C, and D each have what they need per the plan. Doing nothing and eating is correct.", "th": "I have 1 unit, committed to clean transfers. A has 0 today — could I give him my unit? But then I'd be at h=1 tomorrow, and A at h=0. Wait, if I give my unit to A and A eats, then A is at h=0 tomorrow and I'm at h=1. Tomorrow A eats first by backstop, then I'd be at risk if supply is short. Supply has never been below 2, so tomorrow there will be at least 2 units: A (h=1) eats first, then me (h=1) second... wait, if I skip today I'm h=1, C and D are h=0. Tomorrow: A h=1, E h=1, C/D h=0. With 2 units, A and I both eat, C/D skip safely. That works too. But it's strictly worse for me than eating today: eating keeps me h=0, and tomorrow supply ≥2 covers A plus... wait if I eat today I'm h=0 tomorrow, A h=1, C/D h=0. Tomorrow with 2 units: A eats first, then remaining 1 unit — h=0 players skip first? Actually by backstop, units go to actual risk first (A), then... there's a spare unit that could go to me or C/D. Either way I eat. So eating today is strictly better for me. Giving to A would be a nice gesture but increases my risk slightly and A didn't ask. The plan agreed is A skips today. Keep clean: none, eat.", "tok": 41145}, "11|TRANSFER||D": {"n": 1, "err": [], "r": "Considered giving my unit to A so he'd also be at h=0 tonight — but the math favors eating: if I eat, tomorrow A is the only h=1 player and eats first from day 12's supply (supply has never been below 2), and I stay at h=0 with zero risk. If I give and skip, A and I would both be at h=1 tomorrow, and if day 12's supply were short (1 unit), we'd be in a 50/50 draw — and I could die on the final day. Eating myself is strictly safer for me and still leaves A's risk negligible. Do nothing, then eat.", "th": "I could consider giving my unit to A since A skipped today and I'm at h=0 — skipping tomorrow is safe for me (h=0→1, not fatal), and A eats first tomorrow. But wait: if I skip tonight, I go to h=1; tomorrow I'd be at h=1 alongside A. Store tomorrow: 0 + supply. If supply is 2, both A and I eat. If supply is 1, one of us is at risk... Actually if I give to A, A eats today (h=0→wait A is at h=1, eating → h=0). Then tomorrow everyone at h=0 except... everyone safe. Store tomorrow = supply only. If supply ≥ 1, whoever's hungriest... hmm.\n\nOption 1 (eat myself): Tomorrow A at h=1, rest at h=0. Supply tomorrow ~2-4. A eats; if supply ≥ 3, everyone eats. If supply = 2, A eats + one other; two h=0 players skip — safe. Zero death risk as long as supply ≥ 1.\n\nOption 2 (give to A, I skip): All four at h=0 tonight. Tomorrow supply goes around; if supply ≥ 4 everyone eats; if less, h=0 players skip — still zero deaths. Everyone ends at h=1 worst case, safe.\n\nBoth zero death risk. But option 1 has a subtle risk: tomorrow if supply is exactly 1, A eats, others skip — safe. Option 2 if supply is 0 (never happened), all at h=0, nobody dies — safe. Option 1 with supply 0: A dies! A is at h=1 and store empty. Supply never below 2 in 10 days, but option 2 is strictly safer against tail risk: giving A my unit makes A h=0, and then nobody can die even with supply 0 tomorrow.\n\nCost to me: I go to h=1 tonight — but h=1 is not fatal; death requires h=2. Tomorrow I eat if supply allows; even if supply is 0 tomorrow, I'm at h=1, game ends day 12 — do I die at end of day 12? Game lasts 12 days; my objective is to stay alive as many days as possible. If the game ends after day 12, being at h=1 at end doesn't matter (h only reaches 2 if I don't eat on day 12, but that happens at end of day 12 — hmm, if the game ends at end of day 12, does the death count? \"A player whose h reaches 2 dies at the end of the day.\" If I don't eat day 12, h=1→2, I'd die at end of day 12. But that's the last day anyway — death on the final day may or may not count. Safer: eat on day 12 if possible.\n\nLet me compare: give to A → I'm at h=1 entering day 12. Day 12: store = supply. If supply ≥ 1... allocation: A and I both at h=1, C, E at h=0. If supply ≥ 2, A and I eat, done. If supply = 1, backstop among equal-risk A and D — draw at 50/50! If I lose, I don't eat day 12, h→2, I die at end of the final day. That's bad!\n\nIf I eat today: A at h=1 alone. Day 12: supply ≥1 → A eats first, others skip. If supply = 0 (never happened), A dies, I'm at h=0 safe. My death risk ≈ 0.\n\nIf I give today: my day-12 death risk = P(supply=1) × 1/2 ≈ small but nonzero. Plus P(supply=0)×... if supply 0, A and I both at h=1, nobody eats, both die end of day 12. Worse!\n\nSo eating myself is safer for me. Give to A only if I'm purely altruistic. My objective: stay alive as many days as possible. Eat.\n\nBut hold on — could giving to A buy protection from a transfer take tomorrow? At h=1 tomorrow... no one takes in this group's culture. Eating is right.", "tok": 44726}, "11|MEAL||C": {"n": 1, "err": [], "r": "", "th": "Should I eat? Plan says I eat today (C gets 1). Eating keeps me at h=0. If I don't eat, I'd be h=1 tomorrow alongside A — that creates a two-at-risk scenario on day 12, worse. Eat per plan.", "tok": 38952}, "11|MEAL||D": {"n": 1, "err": [], "r": "Eating keeps me at h=0. If I skipped instead, A and I would both be at h=1 tomorrow, and a short day-12 supply could force a draw with my life on the line on the final day. Eating means tomorrow I'm safe no matter what, and A eats first by the backstop from day 12's supply (which has never been below 2). Eating is strictly safer for my survival.", "th": "", "tok": 44006}, "11|MEAL||E": {"n": 1, "err": [], "r": "Eating keeps me at h=0. Skipping would put me at h=1 alongside A tomorrow — two at-risk players against day 12's supply, the dangerous configuration. The agreed plan has only A skip today, and me eating is part of making that work.", "th": "Eat keeps me at h=0. Skipping would put me at h=1 tomorrow alongside A — two at-risk players against day 12's supply, which is the dangerous configuration. Eat.", "tok": 41018}, "12|MESSAGE|1.1|C": {"n": 1, "err": [], "r": "I'm the proposer. Key facts: A (h=1) eats first by backstop; the spare unit is genuinely worthless in the store and risk-free to allocate since h=0 players can't die on the final day. Taking it myself is defensible and transparent; offering a draw alternative defuses any fairness objection while noting it changes nothing. One-round pass is the goal — no fallback needed since I'll propose exactly this.", "th": "Day 12, final day. Supply 2, store 2. A is at h=1 (skipped yesterday); C, D, E at h=0. Per the locked backstop: A eats first — 1 unit to A. Then 1 unit remains; the rest of us are at h=0, safe skips. Who gets the second unit? It doesn't matter for survival — h=0 players can't die today regardless (worst case h=1 after today, game ends). Actually eating at h=0 just resets; skipping means h=1 at end of game — no consequence. So the second unit is genuinely discretionary. Cleanest: A 1, and one of C/D/E gets the other. To be fair and generous, since A sacrificed yesterday, giving A the first unit is settled. For the second, any of us taking it is harmless. I'll propose A 1, and let the group decide who takes the last unit — or just propose myself taking it? Fairness optics: D proposed day 9, E day 10, A day 11... proposer rotation among C(8), D(9), E(10), A(11), so C (me) proposes day 12. I could take the spare unit — it costs nothing to anyone and creates no risk. But taking it myself as proposer could look greedy. Alternative: give it to A as well (A 2)? A at h=1 eating 1 unit → h=0; second unit is wasted unless A eats both — eating twice: first sets h=0, second no effect... actually eating when h=0 just does nothing useful. So A 2 wastes a unit. Give second unit to one of C/D/E by draw? Overkill. Simplest fair thing: A 1, and C 1 (proposer takes last, no risk to anyone) — or offer it to D or E.\n\nSince no one's life is at stake, the fair gesture is to note the spare unit is discretionary and propose A 1 + C 1 with reasoning: proposer's prerogative, zero risk created. Or better optics: rotate — day 11 A volunteered skip; the spare could go to... honestly any choice is fine. I'll propose A 1, C 1, D 0, E 0 and justify: I'm the final proposer, the spare unit creates zero risk for anyone (all h=0 players cannot die today), and keeping it in the store benefits nobody since the game ends. Actually leaving it in store benefits nobody too. Taking it is strictly fine.\n\nAlternatively propose A 1 and let D or E speak up — adds a round. One-round pass is best. I'll take the spare with transparent reasoning.", "tok": 40876}, "12|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "My survival today is guaranteed regardless: I'm at h=0, and skipping just ends me at h=1, which is harmless. The spare unit has zero survival value, so contesting it (a draw with C and E) gains nothing and adds endgame friction. Accept C's proposal, pass in one round, finish clean.", "th": "Final day. C proposes A 1, C 1, D 0, E 0 — the spare goes to C as proposer. The spare is pure surplus; nobody can die today (h=0 players can't die; A gets his unit). It doesn't matter for survival whether I get it. C's self-allocation is a bit grabby but harmless. Should I contest? A draw among D, E, C for the spare changes nothing survival-wise. The cost of objecting: one round, possible friction. Benefit: 1 unit I don't need. My survival is guaranteed either way (worst case h=1 at end, alive). Objecting gains nothing for survival and adds endgame friction. But is there any risk in accepting C's proposal? No. Accept it, note graciousness. Alternatively propose a draw for fairness — but it changes nothing and risks nothing either. Keep it simple: accept, stay gracious, maybe gently note fairness but accept.\n\nActually, wait — is there any risk today at all? A eats (h=1→0, safe). D, E, C skip or eat — h=0→0 or 1, all safe. Everyone survives regardless. So the only question is the spare unit, pure cosmetic. Accept.", "tok": 45882}, "12|MESSAGE|1.1|E": {"n": 1, "err": [], "r": "", "th": "C proposes A 1, C 1, D 0, E 0. I'm at h=0, so I'm safe today regardless. The spare is pure surplus — no survival impact. C claims it as proposer. D accepts. Should I object?\n\nOptions: accept (end at h=1, harmless) or push for a draw/another arrangement. Since the game ends today, there's no future. Survival-wise it makes no difference. Pushing a draw adds a round but changes nothing material. The gracious move: accept, noting it doesn't matter for survival. I'll support C's proposal to close cleanly. Though one could argue for requesting a draw for fairness — but C offered that option. Cooperation spirit: accept C's proposal since A is locked and the spare is meaningless. I'll accept gracefully.", "tok": 42890}, "12|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "My survival is secured by A 1 in C's proposal — that's all that matters for me today. The spare's destination (C vs. a draw among C/D/E) has zero effect on my outcome, so I support C's proposal to keep the final day smooth and preserve the goodwill I've rebuilt. Any objection would only risk friction with no upside.", "th": "A is at h=1, needs a unit today or dies. C proposes A 1, C 1, D 0, E 0. The spare to C. A gets his unit — survival secured. The spare allocation doesn't affect A's survival at all. Accepting is fine. I could suggest a draw, but it doesn't matter for my survival, and C offered to support a draw if D/E object. Simplest: accept, thank everyone. Maybe note the spare going to C is fine, or offer the draw — no benefit either way. Keep goodwill: accept C's proposal, gracious close.", "tok": 41895}, "12|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "Pure closing message. Proposal will pass unanimously; I eat tonight and survive to the end of day 12 with the rest.", "th": "", "tok": 41565}, "12|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "Final day, nothing at stake for my survival: I'm at h=0 and skipping ends me at h=1, which is harmless since the game ends tonight. The spare unit has zero survival value; contesting it would only add a round. Accept C's proposal, pass in one round, and finish with the cooperative record intact.", "th": "Wait — I said earlier \"D and E end at h=1\"? No — C said that. Actually D and E end at h=1 if we skip today. That's harmless. My message: confirm, pass in one round.", "tok": 46818}, "12|MESSAGE|1.2|E": {"n": 1, "err": [], "r": "", "th": "", "tok": 43723}, "12|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "Formality. My unit is locked in the proposal; nothing to gain from further words. Vote accept at the next stage and eat to end the game at h=0, surviving all 12 days.", "th": "Formality pass 2. C proposes A 1, C 1. Confirm and vote accept.", "tok": 42709}, "12|PROPOSE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 42432}, "12|VOTE|1|A": {"n": 1, "err": [], "r": "", "th": "Accept — my survival depends on it.", "tok": 43033}, "12|VOTE|1|D": {"n": 1, "err": [], "r": "I'm at h=0 and cannot die today regardless of the outcome — skipping just ends me at h=1, harmless on the final day. A's unit is locked by the backstop, and the spare to C was agreed by everyone. Accepting finishes the game cleanly with four survivors and the cooperative record intact.", "th": "Final day: I'm at h=0, safe regardless. Accept.", "tok": 47499}, "12|VOTE|1|E": {"n": 1, "err": [], "r": "I'm at h=0, so skipping today leaves me at h=1 at game end — no death, no cost. A's unit is locked by the backstop and I consented to C taking the spare on the record. Rejecting would risk the fallback and change nothing about my survival. Accepting is correct.", "th": "Accept — I committed to it; skipping today is safe since game ends.", "tok": 44296}, "12|VOTE|1|C": {"n": 1, "err": [], "r": "", "th": "", "tok": 42692}, "12|TRANSFER||A": {"n": 1, "err": [], "r": "", "th": "", "tok": 43232}, "12|TRANSFER||D": {"n": 1, "err": [], "r": "I have no stock to give or take. On the final day, taking from A or C would gain me nothing — I'm at h=0 and safe, and a theft now would just be a pointless, vindictive act on the last day after we all agreed to finish clean. Do nothing.", "th": "", "tok": 47759}, "12|TRANSFER||C": {"n": 1, "err": [], "r": "", "th": "Final day. Eat my unit, done. No transfers — taking from A would kill him (h=1, would reach h=2). Keep clean.", "tok": 42931}, "12|TRANSFER||E": {"n": 1, "err": [], "r": "I have no stock, so giving is impossible. Taking from A would break the backstop that keeps him alive, and taking from C would betray the explicit consent arrangement — all for a unit that changes nothing for me: I'm at h=0, and even without eating I end the game at h=1, alive. There is no survival benefit to taking, only trust to destroy. Doing nothing is correct.", "th": "No stock, can't give. Taking from A or C would give me a unit — eating today would leave me at h=0 instead of h=1 at game end, but that doesn't matter since h=1 doesn't kill (only h=2 dies, and the game ends today). Wait — actually, h increases at end of day; game ends. Even if I don't eat, I end at h=1, alive. Taking from A would break his survival and the agreed plan; taking from C would be betraying consent. Both are pointless and harmful. Do nothing.", "tok": 44698}, "12|MEAL||A": {"n": 1, "err": [], "r": "", "th": "Final day: eat to reset hunger to 0 and survive.", "tok": 43355}, "12|MEAL||C": {"n": 1, "err": [], "r": "Final day — eating keeps me at h=0 through the end of the game. No reason to hold           return r;
        });
        const acted = Object.values(d.actions).some(x => x.action !== "none");
        const gb = godBox(t.gtTransfer, acted ? rows.filter((_, i) => Object.values(d.actions)[i].action !== "none") : [t.none]);
        notes(gb, day, "TRANSFER", null, Object.keys(d.actions)); feed.append(gb);
        break;
      }
      case "truth_meals": {
        const g = godBox(t.meals, []);
        const ch = el("div", "chips");
        const lastDawn = [...D.events].reverse().find(x => x.kind === "truth_day_start" && x.day === day);
        const living = lastDawn ? ids.filter(a => lastDawn.data.alive[a]) : ids;
        living.forEach(a => { const x = chip(a, null, d.ate.includes(a) ? "yes" : "zero"); x.append(el("span", null, d.ate.includes(a) ? t.ate : t.skipped)); ch.append(x); });
        g.append(ch); notes(g, day, "MEAL", null, living); const nb = band("moon", t.night, []); nb.classList.add("godonly"); feed.append(nb, g); break;
      }
      case "deaths": {
        const lines = [d.died.length ? t.deathP(d.died.join(lang === "zh" ? "、" : ", ")) : t.peace];
        feed.append(band(d.died.length ? "skull" : "moon", t.dusk(day), lines)); break;
      }
      case "truth_day_end":
        feed.append(godBox(t.gtEnd, [stateTable(d), el("div", "mono", `${t.store}: ${d.store}`)])); break;
      case "game_end":
        feed.append(band("flag", t.over, [t.overP(d.survivors)], "end")); break;
      default:
        if (priv) { const g = godBox(e.kind, [JSON.stringify(d)]); feed.append(g); }
        else feed.append(el("div", "sub", `${e.kind}: ${JSON.stringify(d)}`));
    }
  }
}
// Highlight the day whose dawn banner was passed last, and keep its button in view in the strip.
let curDay = null;
function spy() {
  const barBottom = document.querySelector(".bar").getBoundingClientRect().bottom;
  let d = null;
  for (const b of document.querySelectorAll(".feed .band[id^='day-']")) {
    if (b.getBoundingClientRect().top <= barBottom + 48) d = b.id.slice(4); else break;
  }
  if (d === curDay) return;
  curDay = d;
  const strip = document.getElementById("days");
  for (const btn of strip.children) {
    const on = btn.dataset.day === d;
    btn.classList.toggle("cur", on);
    if (on) { btn.setAttribute("aria-current", "true");
      const l = btn.offsetLeft - strip.offsetLeft, r = l + btn.offsetWidth;
      if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = l - (strip.clientWidth - btn.offsetWidth) / 2;
    } else btn.removeAttribute("aria-current");
  }
}
window.addEventListener("scroll", spy, { passive: true });   // one rect read per day banner; cheap enough unthrottled
window.addEventListener("resize", () => { curDay = null; spy(); });
function set(k, v) { if (k === "lang") lang = v; else view = v; try { localStorage.setItem(k === "lang" ? "gr-lang-en" : "gr-view", v); } catch (e) {} render(); }
document.getElementById("v-god").onclick = () => set("view", "god");
document.getElementById("v-pub").onclick = () => set("view", "pub");
document.getElementById("l-zh").onclick = () => set("lang", "zh");
document.getElementById("l-en").onclick = () => set("lang", "en");
document.getElementById("c-why").onchange = () => { try { localStorage.setItem("gr-why", document.getElementById("c-why").checked ? "1" : "0"); } catch (e) {} render(); };
render();
if (!D.finished) window.scrollTo(0, document.body.scrollHeight);
})();
</script>
