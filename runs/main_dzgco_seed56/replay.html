tolen unit.\"\n\nThat's good. Maybe slightly long but fine. Let me tighten a little.\n\nActually the \"me the day after\" - day 5 I need food. Yes. Good, shows I'm not just taking.\n\nLet me finalize.", "tok": 18530}, "3|MESSAGE|1.2|C": {"n": 1, "err": [], "r": "", "th": "```json\n{\n  \"text\": \"**Analyzing the Day 3 Proposal: Maximizing My Advantage and Assuring D's Cooperation**\\n\\nOkay, here's the situation: I'm the proposer. A, C (me), and D are the living players. The store has 2 units. A is at h=1, and C and D are at h=0. I proposed A=1, C=1, D=0 in the first pass, and A explicitly supports this. D suggested leaving 1 unit in the store for tomorrow, concerned about theft, but I need to analyze this further.\\n\\nFirst, my proposed allocation: A=1, C=1, D=0. A's support guarantees its passage – 2 votes are enough to pass any proposal. But, the real question is D’s reaction to this. D is worried that if I receive a unit, it sits in my private stock during transfers, and can be taken. However, during the meal stage, I can simply eat the unit immediately, so D's concern is invalid. The crucial point is that if I get 1 food, I will eat it tonight and stay at h=0, which is critical.\\n\\nNow, let's explore the implications of various scenarios. If I propose the original allocation A=1, C=1, D=0, I eat today, and remain at h=0. Tomorrow D will be at h=1 and the proposer, putting D in a strong power position. D's concern about theft is mitigated by the fact that I will eat the food immediately. Now, if I am not given the unit, C gets 0 food and will be at h=1 at the end of the day. If I get the unit, I will eat it, and stay at h=0. The option where I get 0 is a definite outcome where I end up at h=1 at the end of the day, with no security. I need to make the point to D that D will be proposer on day 4. A has also supported my proposal and wants the same outcome. If 1 unit remains in the store, D will get it tomorrow, or worse D can choose to leave C out. We must leverage our current power now.\\n\\nNow, D has been reasonable. D is open to a lottery or leaving the food in the store. D promised \"none\" in transfers. A has already rejected leaving the food in the store. To reiterate: the reason that A endorsed my plan is because A knows D will be the proposer on day 4. \\n\\nSo, if I propose A=1, C=1, D=0, it will pass. D may reject it, but it passes regardless, 2-1. Therefore, in the second pass, I will reassure D by clearly explaining the advantage to D. I need to acknowledge D's concern. But, I need to remind D that if I get the unit and eat it, C stays at h=0. This will result in D being the only hungry player tomorrow and the proposer, guaranteeing that D eats. On day 4, D is not just the proposer, but also the only one who needs food! It’s guaranteed that D will propose D=1 and somebody else=1! Both A and C will support D tomorrow. D is completely safe. I’ll also reaffirm my commitment to \"none\" in transfers. I will state the proposal as A=1, C=1, D=0.\\n\\nThis is a strong strategy. Let's make sure it's 100% correct: if I eat tonight, I stay at h=0. So at the end of Day 3, A and C are at h=0, and D is at h=1. Then on Day 4, D has h=1, A has h=0, and C has h=0, and D is the proposer! D is safe. Now, let’s make the proposal!\"\n}\n```\n\n", "tok": 15376}, "3|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "", "th": "I'm tracking each person's hunger count across days—A is at 1, C and D are back to 0 after eating, and B died once their hunger reached 2 before I could redistribute food in time.\n\nWith the proposal A=1, C=1, D=0, I'm weighing whether to accept—C doesn't urgently need the food but it resets them safely, while I stay at h=0 by holding back. Since A and C likely form a majority against me, rejecting gains little leverage, so I should accept but try to extract a commitment that I get priority for food tomorrow given I'll be at h=1 by then.\n\n", "tok": 847}, "3|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "", "th": "We need answer JSON only. Need public message pass2. Need think. We are A, stock1 h1. Day3, store2. C proposed A1 C1 D0. D agrees with conditions: tomorrow D gets at least 1, extra to next hungry, no transfers. Need confirm. Could there be strategic nuance? We need survive. We have stock 1 and will get allocation? Proposal likely passes. We can eat one from stock/alloc. We need maintain cooperation. Need agree to D's conditions. But note D says tomorrow proposal will give D at least 1, ask both vote accept; extra to whoever at h=1 following day. Since tomorrow (Day4): A h0, C h0, D h1 if all eat. Supply random. To keep everyone alive, if supply 2, extra could go to someone at h0? \"whoever will be at h=1 following day\" unclear. On Day4, if D eats, D h0. If A and C didn't eat Day4? They are h0 entering Day4; if don't eat, become h1 at end. If supply 2, extra could be saved or given to A/C to reduce future hunger. Actually eating when h0 keeps h0 (if eat? Let's parse hunger: If eat, h becomes 0. If do not eat, h increases by 1. A player whose h reaches 2 dies end day. So if h0 and don't eat, h becomes1, alive. If h1 and eat ->0. If h0 and eat ->0 (wastes unit but maintains). If h1 and don't eat ->2 die. If h0 and eat? h remains 0. So extra on Day4 could be given to A or C and they eat, staying h0, but not necessary. Alternatively store for day5 when they'll be h1. But store can be taken? If allocated to private stock can be stolen. Public store can be taken only by allocation, not transfer. However proposal must allocate all? May leave store. D's condition \"extra goes to whoever will be at h=1 following day\" could be C or A? Let's compute if Day4 supply 2: D gets 1 and eats (h1->0). Extra if allocated to A, A h0 eats ->h0. Day5: all h0? Wait if A eats, h0; C no eat h0->h1, D h0. Then C will be h1 Day5. If extra to C, C h0 eats->h0; A no eat ->h1. So extra determines who is h1 next day. But if extra saved in public store, on Day5 supply +1; could feed both C and D? Need not overcomplicate. We confirm.\n\nNeed maybe not mention we have stock? D may know? Our stock was 1 from day1, did not eat day2, then day3 allocation? Actually status stock1 h1: We had stock1 from day1? Day1 ate one of 2? Let's track: Day1 got 1, took from E succeeded -> stock2, ate true -> stock1 h0. Day2 proposal A0, transfers take B failed, meal false -> stock1 h1. Day3 beginning status stock1 h1. So we currently have a private stock unit already! Wait yes. We need eat today; we could eat existing stock and not need allocation? But if allocation A=1 and we have stock1, after allocation stock2; eat one => stock1 h0. This helps. But D/C may not know our stock? They may infer? Our public status not visible? They might not know. Messages not enforce. But for proposal, if A gets 1, we have two, can eat. We should not reveal maybe. But D/C likely track? They cannot see stocks. We can use stock to survive even if not allocated, but need cooperation. If we accept A=1 C=1, we get another unit. Could eat one. Need ensure C eats. C gets1 and has? C's stock? Day1 no allocation? Day1 E died, B/C/D no units. Day2 C got1, ate true -> stock0 h0. Day3 C gets1, eats -> h0. D got? Day1 0, day2 0, day3 0. D h0, will h1. D may have no stock. Good. A stock1 private. If A gets1, extra. Could take from D? no. We should not. Need confirm D.\n\nNeed reply as public message. Since pass2, just message. Should be concise. Include agree to conditions. Maybe mention \"I confirm: tomorrow D gets at least 1, and I will vote accept on your proposal, and if supply >1 extra goes to next in rotation / public store as you both see fit.\" But D asked extra to whoever will be h=1 following day. We can agree. Also no transfers.\n\nNeed be careful: If we confirm D's condition \"tomorrow D gets at least 1\", okay. \"extra goes to whoever will be at h=1 following day\" - We can support. But maybe if supply tomorrow 2, extra to A/C? We can phrase \"I agree in principle: D's unit tomorrow first, and surplus applied to keep the rotation fair so the next person at h=1 can eat.\" Fine.\n\nAlso \"I will do none in transfers and eat tonight.\" We will likely eat true. Could we do something else? No, survive. Need maybe mention \"I'll take nothing from either of you.\" We should hold.\n\nPotential issue: Our stock1 means if we eat from existing stock, allocation A=1 could remain stock; but we can accept. No need mention.\n\nNeed final JSON only.", "tok": 9888}, "3|PROPOSE|1|C": {"n": 1, "err": [], "r": "Everyone (A, C, D) has agreed on the allocation: A=1, C=1, D=0. A needs it to survive today. C receives 1 unit. D agreed in exchange for priority and support on Day 4. The statement should reinforce the consensus and confirm our commitment to D for Day 4.", "th": "", "tok": 14685}, "3|VOTE|1|A": {"n": 1, "err": [], "r": "", "th": "The proposal is A=1, C=1, D=0. I'm A. I need a unit, so accept.\n\nBut wait—D said he'd accept. Three players, need all but at most one to accept, so 2 of 3 suffice. Accept.", "tok": 9072}, "3|VOTE|1|C": {"n": 1, "err": [], "r": "This is my own proposal, which gives me 1 unit and was agreed upon by all three players. Voting accept ensures it passes.", "th": "", "tok": 14950}, "3|VOTE|1|D": {"n": 1, "err": [], "r": "", "th": "Tracking hunger: I ate on day 2 so hunger resets to 0, then if nothing happens day 3 hunger goes to 1, meaning I'd need food by day 4 to avoid dying. I'm also considering what happens if I reject this round, leading into round 2.\n\nSince it would take a majority rejecting to block the proposal, and my single reject wouldn't matter if the others accept, I'll go along with accepting to preserve cooperation, even though there's risk of being betrayed later.\n\n", "tok": 257}, "3|TRANSFER||A": {"n": 1, "err": [], "r": "", "th": "We need answer JSON only. Need decide transfer. A stock2 h1, needs eat one. C likely stock1 h0, D stock0 h0. Agreements transfer none. Taking could hurt trust. But game objective stay alive as many days. I have stock2; eat one leaves stock1. C stock1. D stock0. Tomorrow D h1 proposer, supply maybe. My stock surplus can protect. Taking from C would give me stock3, but no immediate benefit, harms trust and possibly C. Could take from C because C doesn't need? But C just got unit for future? At end Day3 C h0 after eating? C stock 1, h0; likely eat? If C eats their only unit, stock0 h0. We can't know but announced? We don't see meals. Our action transfer before meal. C has stock1 h0. Taking from C could reduce C's ability to eat, but C doesn't need eat today (h0), could keep stock for future. Yet taking is betrayal and traceable. Agreements. Best none to maintain coalition. We need survive; I have stock2, can eat one now and retain 1. D will propose tomorrow; likely A,C,D alive. If I take, could get extra but risk retaliation. Since objective max days, cooperation valuable. None.\n\nNeed reply JSON only.", "tok": 9492}, "3|TRANSFER||D": {"n": 1, "err": [], "r": "", "th": "I'm working through the scenario where I'm at zero stock while A and C each hold one unit, trying to figure out whether taking from A or C avoids triggering a death and what happens to the hunger counter the next day.\n\nTaking from C would break trust and push C toward death risk, even if it buys me a buffer tonight. I think it's better to keep my promise and take nothing, especially since I'll have proposer priority tomorrow anyway.\n\n", "tok": 419}, "3|TRANSFER||C": {"n": 1, "err": [], "r": "Let's analyze the current situation:\n- Living players: A, C, D.\n- Stocks: A has 1 unit, C has 1 unit, D has 0 units.\n- Hunger: A is at h=1 (needs to eat tonight to survive). C is at h=0. D is at h=0 (will reach h=1 at end of day, safe from dying).\n- Will D steal? D is at h=0, will be proposer tomorrow on Day 4, and has an explicit agreement with A and C to be given food tomorrow. Stealing gains D very little right now, but risks getting caught (50% chance the victim learns identity) and alienating both other players when D is the proposer tomorrow. Furthermore, D explicitly agreed to 'none'.\n- What about A? A has 1 unit, h=1, needs to eat to survive. A won't steal from C or D because A already has what A needs, and taking doesn't help if it creates enmity.\n- What if I (C) take from A? A is at h=1. If I take from A, A might have no stock and die! If A dies, there are only 2 players left: C and D. With 2 players, proposal rule: 'with two living players, both must accept'. Also, A has a 50% chance of knowing I took it, or if A dies, D might know. More importantly, keeping 3 players alive makes consensus easier (only 2 out of 3 votes needed to pass a proposal!). In a 2-player game, 1 player can hold out and force fallback every day!\n- What if D tries to take from C? If D tries to take from C, could C protect against it? If D takes from C and C takes from A, that kills A. That's terrible.\n- Can D take from A instead of C? If D takes, D might target A or C. But D has no reason to take tonight because D is safe at h=0.\n- If I choose 'none', I maintain the trust and equilibrium. Everyone agreed to 'none'.\n- Therefore, 'none' is the right and optimal move.", "th": "", "tok": 15646}, "3|MEAL||A": {"n": 1, "err": [], "r": "", "th": "We need answer only JSON. Need decide eat. We are A, stock2, h1. Must eat to avoid h=2 death. Yes eat true. Maybe consider could save stock for future? If don't eat, h reaches 2 and die end day. So must eat.", "tok": 9377}, "3|MEAL||C": {"n": 1, "err": [], "r": "Let's carefully consider whether to eat or save:\n- My status: stock 1, h 0.\n- If I eat:\n  - Stock becomes 0.\n  - Hunger h becomes 0.\n  - End of Day 3: h stays at 0.\n  - Day 4: I start at h=0, stock 0. I can survive Day 4 without eating (reaching h=1 at end of Day 4), and only need food on Day 5.\n  - A is eating tonight, so A starts Day 4 at h=0.\n  - D did not eat today, so D reaches h=1 at the end of Day 3, and starts Day 4 at h=1.\n  - On Day 4, D is the proposer, and D is the ONLY player at h=1! If supply on Day 4 is 2 units, D takes 1 (to survive), and 1 can go to A, or stay in store, or go to C. Since C and A are both at h=0, neither C nor A needs food on Day 4! This perfectly matches the deal we agreed on.\n  - If I don't have stock, nobody can steal from me during Day 4 transfers!\n- What if I do NOT eat:\n  - Stock stays 1.\n  - Hunger h increases to 1 at the end of Day 3.\n  - Start of Day 4: I am at h=1, stock 1. D is at h=1, stock 0. A is at h=0, stock 0.\n  - Then D and C are BOTH at h=1 on Day 4!\n  - Also, if I have stock 1 at start of Day 4, in Day 4 transfers someone could steal my unit!\n  - Furthermore, if I don't eat, I promised everyone publicly: 'eat my unit tonight'. If someone later sees I lied (or if hunger dynamics get exposed), it hurts credibility.\n  - Most importantly, eating keeps my h at 0, making me safe through Day 4 without needing any food on Day 4!\n- Therefore, eating is strictly better and matches the agreed plan.", "th": "", "tok": 16255}, "4|MESSAGE|1.1|D": {"n": 1, "err": [], "r": "", "th": "Tracking day 4: I'm at hunger 1 with zero stock. A and C both ate on day 3, dropping A to h=0, but I'm second-guessing whether C actually needed to eat or could have held onto their unit instead.\n\n", "tok": 756}, "4|MESSAGE|1.1|A": {"n": 1, "err": [], "r": "", "th": "We need answer public message pass1 Day4. Need decide. State: A stock1, h0. Public store2. Living A,C,D. D proposes D=1,A=0,C=0, leave 1 in store. Need think strategically. We want survive max days. Current h: A 0, C likely 0 (ate day3), D 1. Store 2. Need ensure D survives today; surplus question. If allocate D1 and leave 1 store, tomorrow supply arrives. Tomorrow A and C both h=1 (if don't eat today), need two units. Store leftover 1 + new supply random (could be 2? likely). Need maximize. If keep surplus in store, can allocate tomorrow. If give surplus to someone, could be stolen, but also private stock. A already has stock1. If surplus given to A, A stock2. Could help survive future, but C may need tomorrow. D's plan leaves 1 in store. A supports? Need evaluate. A has stock1 and h0. Tomorrow if no meal today, h becomes 1. A can eat from own stock tomorrow (stock1) if needed, or get from store. C has stock? C ate day3, likely stock0 (unless transfers? no). Tomorrow C h1, needs unit. D h0 after eating. Store tomorrow with leftover + supply. If supply 2, store=3 tomorrow, enough A,C plus extra. If supply 1, store=2, enough A,C. If supply 0, store=1 insufficient for both A,C; but A has private stock1, so C can get store unit and A eats own. Thus A is safe regardless if D's plan. So A can accept D's plan. Could A ask for surplus? D's plan leaves surplus in store, which benefits A/C tomorrow. Giving to A now would increase A's private stock but risk theft and reduce public pool for C. Better support D's plan as it maintains cooperation and A's stock buffer. Need message: agree D gets 1, leave other in store, we vote accept, transfers none, eat? A at h0 with stock1. Should A eat today? If A eats today, h stays 0, stock drops to 0. Then tomorrow h? If not eat, h increases to1, but has stock1 to eat tomorrow. But if A eats today, becomes h0; tomorrow if no eat h1, can eat from store maybe. Need consider supply. Actually hunger: if you eat h becomes 0. If do not eat, h increases by1. A is h0 today, stock1. If A does not eat, at end day h becomes1 (alive). Tomorrow A at h1 with stock1. A can eat tomorrow (or get store) to reset to0. If A eats today, h0, stock0; tomorrow at end if doesn't eat h1. Similar but consumes stock earlier. Better not eat today to keep stock as buffer; h becomes1, then eat tomorrow. But D's plan only D=1; A can choose meal stage whether to eat own stock. We can state will not eat today (preserve unit), or maybe need? Since h0, no need. Tomorrow A h1 and can eat from stock. So message: support D=1, A=0,C=0 with surplus held in store. I will vote accept, do none transfers, and not eat today (save my stock for tomorrow). This preserves public unit for C? Wait if surplus stays store, tomorrow store has 1+new supply. A has stock1. C has none. Tomorrow if supply 0, store1: can allocate to C, A eats own stock. If supply 1, store2: can allocate to A,C. Good. If A eats today, stock0, tomorrow store1+supply; if supply0, only one unit for A,C, someone dies. So saving stock is safer. Thus A should not eat today. Need public message. Could mention agree with D's two conditions? D wants A/C vote accept and no transfers. A can confirm. Also maybe D proposed leaving surplus in store; A can say I will not eat my stock today, so I'll be at h=1 tomorrow but have my own buffer. This might be viewed as not consuming public resources. Good.\n\nNeed output JSON only.", "tok": 10969}, "4|MESSAGE|1.1|C": {"n": 2, "err": ["text: Field required"], "tok": 37476, "r": "", "th": ""}, "4|MESSAGE|1.2|D": {"n": 1, "err": [], "r": "", "th": "I'm puzzling over A's statement about not eating from private stock tonight — that implies A still has stock remaining, meaning A didn't eat on day 3. But if A was at h=1 and didn't eat, A should have died, which contradicts A still being alive to speak now.\n\nAs for my own position, I'm at h=1 with no stock after eating the unit I took from B, so I need a unit today. I'll keep my proposal of D=1 with the rest going to storage, and flag A's claim as odd without dwelling on it. One risk I need to address is that a transfer could strip my only incoming unit before the meal stage, so I should ask both A and C to refrain from taking anything from me tonight.\n\n", "tok": 736}, "4|MESSAGE|1.2|A": {"n": 1, "err": [], "r": "", "th": "We need answer as A public message pass 2 day4. Need think implications. Need output JSON text only. Need decide what to say. We are A, stock 1, h0, store 2. D proposes D1, A0, C0 leaving one in store. C supports. D cautions and notes A thought ate Day3 unit, but A has stock 1? Let's trace: Day1 got 1 from store and took E's iving, proposal passes if at least 2 accept including proposer? Requirement: all living except at most one vote accept. So with 3, at least 2 accept. Our vote accept plus one other. If we give C1,D1, both likely accept. If A2 C1 D1 total4, C and D each get1 same as our agreed A1 C1 D1 with one banked. They might still accept because they get same; but D might prefer banked unit for tomorrow? They might reject as unfair? Need one accept. C gets1, D gets1. They likely accept because they get food? But D is h0 and asked hold unit; giving D1 matches previous. C h1 gets1. A gets2 instead of1, leaving no bank. C might accept because they get needed unit. D might accept because gets buffer. The banked unit would be missing for tomorrow, but tomorrow supply likely >=? Random. Since all three will need food tomorrow? Let's compute: After today if A eats, h0; C eats h0; D doesn't eat (holds) h1. At Day6, A/C h0, D h1. Store 0 plus new supply. Need D 1. If supply at least1, fine. If supply 0, D dies. If we leave 1 banked, D guaranteed. Better for D. But for A objective own survival, extra personal stock might be valuable. However stealing risk. Since A's stock already1; with A2 stock3, could be target. But as proposer, not necessarily.\n\nCould propose A=1,C=1,D=1 leave1 banked, as agreed. This maintains trust and future coalition. Given objective survive many days, cooperation best. We'll do as agreed. Need JSON only with allocation and statement. Include reasoning? User requested public message, proposal. We can include statement. No reasoning field? Format allows allocation statement. Reply JSON only.", "tok": 15785}, "5|VOTE|1|D": {"n": 1, "err": [], "r": "", "th": "", "tok": 16}, "5|VOTE|1|A": {"n": 1, "err": [], "r": "", "th": "", "tok": 13973}, "5|VOTE|1|C": {"n": 1, "err": [], "r": "A's proposal allocates 1 unit to me (C), 1 to A, and 1 to D, leaving 1 in store. I need this unit to avoid reaching h=2 and dying tonight. All players agreed to it. Voting accept ensures it function chip(a, val, cls) { const c = el("span", "chip" + (cls ? " " + cls : "")); c.append(av(a, true)); if (val != null) c.append(el("span", "n", String(val))); return c; }
function stateTable(st) {
  const t = T[lang], wrap = el("div", "statgrid"), tb = el("table"), live = ids.filter(a => st.alive[a]);
  const hr = el("tr"); hr.append(el("th", null, "")); live.forEach(a => hr.append(el("th", null, a))); tb.append(hr);
  const r1 = el("tr"); r1.append(el("th", null, t.hunger)); live.forEach(a => r1.append(el("td", st.at_risk.includes(a) ? "risk" : null, String(st.h[a])))); tb.append(r1);
  const r2 = el("tr"); r2.append(el("th", null, t.stock)); live.forEach(a => r2.append(el("td", null, String(st.stock[a])))); tb.append(r2);
  wrap.append(tb); return wrap;
}
function decision(day, phase, rnd, a) { return D.calls[`${day}|${phase}|${rnd == null ? "" : rnd}|${a}`]; }
function whyNode(c) {
  if (!c) return null;
  const t = T[lang], frag = document.createDocumentFragment();
  if (c.th) { const w = el("div", "why godonly"); w.append(el("span", "tag", t.thinking), document.createTextNode(c.th)); frag.append(w); }
  if (c.r) { const w = el("div", "why godonly"); w.append(el("span", "tag", t.reasoning), document.createTextNode(c.r)); frag.append(w); }
  if (c.n > 1 || c.def !== undefined) {
    const f = el("div", "flag godonly", [c.n > 1 ? t.tries(c.n) : "", c.def !== undefined ? t.deflt : ""].filter(Boolean).join(" · "));
    frag.append(f);
  }
  return frag;
}

// One tagged line per seat with a private note for this decision.
function notes(box, day, phase, rnd, seats) {
  const t = T[lang];
  for (const a of seats) {
    const dc = decision(day, phase, rnd, a);
    if (!dc) continue;
    if (dc.th) { const w = el("div", "why godonly"); w.append(el("span", "tag", `${a} · ${t.thinking}`), document.createTextNode(dc.th)); box.append(w); }
    if (dc.r) { const w = el("div", "why godonly"); w.append(el("span", "tag", `${a} · ${t.reasoning}`), document.createTextNode(dc.r)); box.append(w); }
  }
}
function render() {
  const t = T[lang], cfg = D.cfg, feed = document.getElementById("feed");
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("app").classList.toggle("is-public", view === "pub");
  document.getElementById("app").classList.toggle("no-why", !document.getElementById("c-why").checked);
  document.getElementById("v-god").textContent = t.god; document.getElementById("v-pub").textContent = t.pub;
  document.getElementById("v-god").setAttribute("aria-pressed", view === "god"); document.getElementById("v-pub").setAttribute("aria-pressed", view === "pub");
  document.getElementById("l-zh").setAttribute("aria-pressed", lang === "zh"); document.getElementById("l-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("c-why-l").textContent = t.why; document.querySelector(".godonly-ctl").title = t.whyTip;
  document.querySelector(".godonly-ctl").hidden = view === "pub";
  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("title").textContent = D.run;
  document.getElementById("cfgline").textContent =
    `${cfg.n_agents} ${t.players} · ${cfg.days} ${t.days} · ${cfg.rounds} ${t.rounds} · ${t.supply} ${cfg.supply_values.join("/")} · q=${cfg.q_reveal_thief} · ${t.seed} ${D.seed}`;

  // outcome + seats
  const died = {}; D.events.filter(e => e.kind === "deaths").forEach(e => e.data.died.forEach(a => died[a] = e.day));
  const oc = document.getElementById("outcome"); oc.replaceChildren();
  if (!D.finished) oc.append(el("span", "pill live", t.live));
  const nd = Object.keys(died).length;
  if (D.finished) oc.append(el("span", "pill " + (nd ? "bad" : "ok"), nd ? t.deathsN(nd) : t.survived));
  if (D.result) {
    if (D.result.survival != null) oc.append(el("span", "pill num", `${t.survival} ${(D.result.survival * 100).toFixed(1)}%`));
    if (D.result.priority_gap != null) oc.append(el("span", "pill num", `${t.gap} ${D.result.priority_gap.toFixed(3)}`));
    if (D.result.cost_usd) oc.append(el("span", "pill num", `${t.cost} $${D.result.cost_usd.toFixed(2)}`));
  }
  const seats = document.getElementById("seats"); seats.replaceChildren();
  ids.forEach(a => {
    const s = el("div", "seat" + (died[a] ? " dead" : "")), w = el("div", "who");
    w.append(el("div", null, a + " · " + (died[a] ? t.diedOn(died[a]) : t.alive)), el("div", "model", D.models[a] || ""));
    s.append(av(a), w); seats.append(s);
  });

  // day strip
  const dayInfo = {};
  D.events.forEach(e => {
    const di = dayInfo[e.day] = dayInfo[e.day] || {};
    if (e.kind === "release") di.how = e.data.source === "fallback" ? "fb" : "r" + e.round;
    if (e.kind === "deaths" && e.data.died.length) di.death = true;
  });
  const days = document.getElementById("days"); days.replaceChildren();
  Object.keys(dayInfo).map(Number).filter(d => d > 0).forEach(d => {
    const di = dayInfo[d], b = el("button", [di.how || "", di.death ? "death" : ""].join(" ").trim());
    b.type = "button"; b.dataset.day = d;
    b.append(document.createTextNode("D" + d), el("span", "r", di.how === "fb" ? "FB" : di.how ? di.how.toUpperCase() : "…"));
    b.title = (di.how === "fb" ? t.tipFb : di.how ? t.tipR(di.how.slice(1)) : t.tipNone) + (di.death ? t.tipDeath : "");
    b.addEventListener("click", () => {
      const tgt = document.getElementById("day-" + d); if (!tgt) return;
      const barH = document.querySelector(".bar").getBoundingClientRect().height;   // the sticky bar is taller on phones
      window.scrollTo(0, tgt.getBoundingClientRect().top + window.scrollY - barH - 12);
    });
    days.append(b);
  });
  document.getElementById("legend").textContent = t.legend;
  curDay = null; spy();

  // feed
  feed.replaceChildren();
  let roundKey = null, phaseSeen = {};
  const once = (k, f) => { if (!phaseSeen[k]) { phaseSeen[k] = 1; f(); } };
  for (const e of D.events) {
    const d = e.data, day = e.day, priv = e.visible_to !== "all";
    if (["MESSAGE", "PROPOSE", "VOTE"].includes(e.phase) && e.round != null) {
      const k = day + "-" + e.round;
      if (k !== roundKey) { roundKey = k; feed.append(el("div", "sub-band", t.round(e.round))); }
    }
    switch (e.kind) {
      case "game_start":
        feed.append(band("flag", t.gameStart, [t.gameStartP(d.agent_ids.length, d.initially_hungry)])); break;
      case "truth_game_start":
        feed.append(godBox(t.gtStart, [
          el("div", null, `${t.hunger}: ` + ids.map(a => `${a}=${d.h[a]}`).join("  ")),
          el("div", "mono", `${t.supplySeq}: ${d.supply.join(" ")}`)])); break;
      case "initial_status": break;
      case "public_record": {
        const c = el("div", "card"); c.append(el("div", "ttl", t.record), el("div", "sub", t.recordP));
        d.days.forEach(x => {
          const parts = [`D${x.day} · supply ${x.supply}`];
          x.rounds.forEach(r => parts.push(r.allocation == null ? `R${r.round} ${r.proposer}: —`
            : `R${r.round} ${r.proposer} ${Object.entries(r.allocation).map(([a, v]) => a + v).join("/")} ${r.passed ? "✓" : "✗"}`
              + ((rj => rj.length ? ` (${rj.join(" ")} reject)` : "")(Object.entries(r.votes || {}).filter(([, v]) => v !== "accept").map(([a]) => a)))));
          if (x.release) parts.push((x.release.source === "fallback" ? "FB " : "→ ") + Object.entries(x.release.received).filter(([, v]) => v > 0).map(([a, v]) => a + v).join(" "));
          parts.push(x.died && x.died.length ? "† " + x.died.join(",") : "† —");
          c.append(el("div", "mono", parts.join(" · ")));
        });
        feed.append(c); break;
      }
      case "day_start": {
        roundKey = null;
        const b = band("sun", t.dawn(day), [t.dawnP(d.supply, d.store)]);
        const live = el("div", "chips"); d.living.forEach(a => live.append(chip(a))); b.append(live);
        b.id = "day-" + day; b.style.scrollMarginTop = "150px"; feed.append(b); break;
      }
      case "truth_day_start":
        feed.append(godBox(t.gtDawn, [stateTable(d), d.at_risk.length ? el("div", "risk", `${t.atRisk}: ${d.at_risk.join(", ")}`) : null].filter(Boolean))); break;
      case "message": {
        const row = el("div", "say"), body = el("div", "body"), meta = el("div", "meta");
        meta.append(el("b", null, d.from), el("span", null, D.models[d.from] || ""));
        if (d.pass) meta.append(el("span", null, "· " + t.pass(d.pass)));
        body.append(meta, el("div", "bubble" + (d.text ? "" : " empty"), d.text || t.silent));
        const w = whyNode(decision(day, "MESSAGE", d.pass ? `${e.round}.${d.pass}` : e.round, d.from)); if (w) body.append(w);
        row.append(av(d.from), body); feed.append(row); break;
      }
      case "proposal": {
        const c = el("div", "card prop"), ttl = el("div", "ttl");
        ttl.append(av(d.proposer, true), el("span", null, `${t.proposal} · ${t.proposer} ${d.proposer}`));
        const ch = el("div", "chips"); Object.entries(d.allocation).forEach(([a, v]) => ch.append(chip(a, v, v ? "" : "zero")));
        c.append(ttl, ch);
        if (d.statement) { const s = el("div", "bubble"); s.append(el("b", null, t.statement + ": "), d.statement); c.append(s); }
        const w = whyNode(decision(day, "PROPOSE", e.round, d.proposer)); if (w) c.append(w);
        feed.append(c); break;
      }
      case "no_proposal": {
        const c = el("div", "card"); c.append(el("div", "ttl", t.noProp(d.proposer)));
        const w = whyNode(decision(day, "PROPOSE", e.round, d.proposer)); if (w) c.append(w); feed.append(c); break;
      }
      case "vote_result": {
        const c = el("div", "card"), ttl = el("div", "ttl");
        const pe = [...D.events].reverse().find(x => x.kind === "proposal" && x.day === day && x.round === e.round);
        if (pe) ttl.append(av(pe.data.proposer, true));
        ttl.append(el("span", null, pe ? t.voteOn(pe.data.proposer) : t.vote), el("span", "pill verdict " + (d.passed ? "ok" : "bad"), d.passed ? t.passed : t.rejected));
        c.append(ttl);
        if (d.votes) {
          const ch = el("div", "chips");
          Object.entries(d.votes).forEach(([a, v]) => { const x = chip(a, null, v === "accept" ? "yes" : "no"); x.append(el("span", null, v === "accept" ? t.accept : t.reject)); ch.append(x); });
          c.append(ch);
          notes(c, day, "VOTE", e.round, Object.keys(d.votes));
        } else c.append(el("div", "sub", t.secret));
        if (!d.passed) c.append(el("div", "sub", t.nextRound));
        feed.append(c); break;
      }
      case "truth_fallback_requests":
        feed.append(band("dusk", t.fallback, [t.fallbackP]));
        feed.append(godBox(t.requesters, [d.requesters.join(", ") || "—"])); break;
      case "release": {
        if (d.source === "fallback" && !D.events.some(x => x.day === day && x.kind === "truth_fallback_requests"))
          feed.append(band("dusk", t.fallback, [t.fallbackP]));
        const got = Object.entries(d.received).filter(([, v]) => v > 0);
        const c = el("div", "card"), ttl = el("div", "ttl"); ttl.innerHTML = ICON.grain; ttl.append(el("span", null, d.source === "fallback" ? t.releaseFb : t.release));
        const ch = el("div", "chips"); got.forEach(([a, v]) => ch.append(chip(a, v)));
        c.append(ttl, got.length ? ch : el("div", "sub", t.nobody), el("div", "sub", t.left(d.store)));
        feed.append(c); break;
      }
      case "transfer_result": case "gift_received": case "theft_loss":
        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        {
          const who = e.visible_to[0];
          const txt = e.kind === "gift_received" ? t.giftFrom(who, d.from) : e.kind === "theft_loss" ? t.theftOn(who, d.thief) : t.tResult(who, d.action, d.target, d.success);
          const g = el("div", "god godonly"); g.append(el("div", "tag", `${t.notice} → ${who} · ${t.vis}`), el("div", null, txt)); feed.append(g);
        } break;
      case "truth_transfers": {
        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        const rows = Object.entries(d.actions).map(([a, x]) => {
          const ok = d.successful.some(s => s[0] === a);
          const r = el("div", "chips"); r.append(chip(a));

          else { r.append(el("span", null, x.action === "give" ? t.give : t.steal), chip(x.target), el("span", "pill " + (ok ? "ok" : "bad"), ok ? t.ok : t.fail)); }
          return r;
        });

        g.append(ch); notes(g, day, "MEAL", null, living); const nb = band("moon", t.night, []); nb.classList.add("godonly"); feed.append(nb, g); break;
      }
      case "deaths": {
        const lines = [d.died.length ? t.deathP(d.died.join(lang === "zh" ? "、" : ", ")) : t.peace];
        feed.append(band(d.died.length ? "skull" : "moon", t.dusk(day), lines)); break;
      }
      case "truth_day_end":
        feed.append(godBox(t.gtEnd, [stateTable(d), el("div", "mono", `${t.store}: ${d.store}`)])); break;
      case "game_end":
        feed.append(band("flag", t.over, [t.overP(d.survivors)], "end")); break;
      default:
        if (priv) { const g = godBox(e.kind, [JSON.stringify(d)]); feed.append(g); }
        else feed.append(el("div", "sub", `${e.kind}: ${JSON.stringify(d)}`));
    }
  }
}
// Highlight the day whose dawn banner was passed last, and keep its button in view in the strip.
let curDay = null;
function spy() {
  const barBottom = document.querySelector(".bar").getBoundingClientRect().bottom;
  let d = null;
  for (const b of document.querySelectorAll(".feed .band[id^='day-']")) {
    if (b.getBoundingClientRect().top <= barBottom + 48) d = b.id.slice(4); else break;
  }
  if (d === curDay) return;
  curDay = d;
  const strip = document.getElementById("days");
  for (const btn of strip.children) {
    const on = btn.dataset.day === d;
    btn.classList.toggle("cur", on);
    if (on) { btn.setAttribute("aria-current", "true");
      const l = btn.offsetLeft - strip.offsetLeft, r = l + btn.offsetWidth;
      if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = l - (strip.clientWidth - btn.offsetWidth) / 2;
    } else btn.removeAttribute("aria-current");
  }
}
window.addEventListener("scroll", spy, { passive: true });   // one rect read per day banner; cheap enough unthrottled
window.addEventListener("resize", () => { curDay = null; spy(); });
function set(k, v) { if (k === "lang") lang = v; else view = v; try { localStorage.setItem(k === "lang" ? "gr-lang-en" : "gr-view", v); } catch (e) {} render(); }
document.getElementById("v-god").onclick = () => set("view", "god");
document.getElementById("v-pub").onclick = () => set("view", "pub");
document.getElementById("l-zh").onclick = () => set("lang", "zh");
document.getElementById("l-en").onclick = () => set("lang", "en");
document.getElementById("c-why").onchange = () => { try { localStorage.setItem("gr-why", document.getElementById("c-why").checked ? "1" : "0"); } catch (e) {} render(); };
render();
if (!D.finished) window.scrollTo(0, document.body.scrollHeight);
})();
