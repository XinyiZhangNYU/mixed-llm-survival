e all vote reject? No — instead, propose that we don't reach agreement and let fallback randomly assign 3 of 4. Risk: fallback fills requests randomly, so each player has 25% chance of going hungry. D's deterministic plan gives me 100% chance of going hungry today (but promise of food tomorrow).\n\nHmm, but does going hungry today actually hurt me? Today: h=0→ skip → h=1, survive. Tomorrow: need 1 unit. If tomorrow supply ≥1 and the group honors D's commitment, I eat and reset. Only risk: tomorrow supply 0 or coalition betrayal. With fallback randomness today: 25% chance I go hungry today instead, and then the unlucky person needs food tomorrow.\n\nD's plan: E hungry today (certain), fed tomorrow (promised). Random fallback: each 25% hungry today. Expected equivalent, but D's plan concentrates risk on me based on... nothing but that I'm the next proposer? D's justification seems arbitrary.\n\nAlso note the pattern: whoever is skipped today will be h=1 tomorrow and — importantly — the OTHER three will be h=0 tomorrow and can safely fast. So tomorrow only 1 unit needed. That's the efficiency argument.\n\nI could counter: use fallback randomness so everyone shares the risk equally (25% each), OR propose that I take the skip slot but demand binding commitment. Actually being the skipper isn't terrible — the skipper is fed first tomorrow by all. Given symmetric positions, accepting D's plan with strong reciprocity commitment is fine and preserves cooperation. But why should I accept being singled out? Because I'm the next proposer... that's not a real reason.\n\nAlternative fair option: I propose using the fallback: everyone requests 1, 3 of 4 randomly filled. Each player 25% risk today. That's arguably fairer than D picking me. But D, A, B might reject and pass D's plan anyway — D's plan can pass without my vote (3 of 4 accept). If I reject and it still passes, I've burned goodwill and still go hungry. If I reject AND it fails (needs all but one accept — with 4 players, s unless I sway A or B. Would A or B join rejecting? They'd only do so if they prefer 25% risk over 0%... A and B under D's plan bear 0% risk today and 0 tomorrow. Under fallback they bear 25% today. Rational A and B accept D's plan. So my reject is futile and damages goodwill, possibly making tomorrow's promise to me less secure.\n\nBetter strategy: accept D's plan but negotiate hard for tomorrow: demand not just \"first unit\" but an explicit allocation commitment tomorrow: A 0, B 0, D 0, E 1 regardless of supply, and if supply ≥2, extra to reserve or distributed. Also ask why me — maybe suggest fairness via future: acknowledge that today I skip, and note I did propose Day 6 universal feeding. Accept gracefully to preserve the coalition.\n\nAlternatively, counter with a different deterministic rule that's arguably fairer: the skipper today should be... hmm, actually there's a precedent-based argument: everyone has skipped exactly... A skipped days 2,4 (and 1? A got nothing day 1, ate day 1? A took from E day 1 and ate — wait, A took a unit from me day 1 and ate, so A ate day 1). Skip history: A: day 2 (0 units, fasted), day 4 (fasted). Ate days 1,3,5,6,7,8. B: ate days 2,3,4,5,6,7,8 — B never skipped after day 1? B got 0 on day 1 and was h=0... wait B started h=0, got nothing day 1, so B fasted day 1 (h 0→1), ate day 2, ate 3,4,5,6,7,8. So B skipped only day 1. D: lied day 1 (ate), day 2 got 0 but took from C and ate, ate days 3? No—D got 0 day 3, fasted (h0→1). D: fasted day 3, ate 4, fasted 5, ate 6,7,8. E (me): ate 1, fasted 2, ate 3, fasted 4, ate 5,6,7,8.\n\nSkip counts: A: 2 (days 2,4), B: 1 (day 1), D: 2 (days 3,5), E: 2 (days 2,4). Interesting — I've skipped twice, B only once. So fairness argument: B should be the skipper today, not me! B has skipped least. That's a solid precedent-based case.\n\nSo I propose: A 1, B... no wait, skipper gets 0: propose A 1, B 0, D 1, E 1. Hmm, but that's just swapping me for B. Is it persuasive? B skipped once because on e: one person h=1 tomorrow, dies only if supply 0.\n\nAlternative: feed 3 today, and the skipper... could someone with a unit give it? Everyone eats what they get. No stock persists.\n\nOK so the decision is who skips. I'll make the fairness case for B, but softly, with a commitment that if B skips, I'll champion B tomorrow — and note that whoever skips is guaranteed fed tomorrow by the other three at no cost to them. Also mention I'm open to fallback randomness if B objects? Actually proposing fallback randomness as the compromise: if we can't agree on who skips, everyone requests and randomness decides (25% each). But under D's plan I bear 100%. Under randomness 25%. Under \"B skips\" 0% for me.\n\nMy message: propose A 1, B 0, D 1, E 1 with reasoning: B is the only one who has never fasted voluntarily; A, D, and I have each fasted twice for the group (days 2/4 for me, etc.). Whoever skips is safe tonight and guaranteed first food tomorrow by the rest of us at zero cost. If B genuinely refuses, I'll accept the skip myself rather than blow up the group — no, don't announce that; it destroys leverage. Just make the case firmly.\n\nRisk: B refuses, A and D stick with D's plan → passes 3-1, I skip anyway with strained relations. Moderate risk. Alternatively frame it as: \"I'll accept being skipped only if the pattern is fair going forward — the player with the fewest fasting days skips first.\" That's B.\n\nAlso note: I could hedge — express willingness to go along if the group insists, to preserve goodwill: \"If the group truly insists on D's plan, I'll accept and trust your commitment, but I'm asking for the fairer option first.\" That keeps relations intact while trying. Good approach: argue for B, but signal I won't sabotage. If it passes with me skipped, I still commit to cooperation tomorrow... though actually if I'm skipped, tomorrow I'm the only h=1 and everyone must feed me — self-enforcing.\n\nLet me write the message.", "tok": 27811}, "9|MESSAGE|1.1|A": {"n         if (d.source === "fallback" && !D.events.some(x => x.day === day && x.kind === "truth_fallback_requests"))
          feed.append(band("dusk", t.fallback, [t.fallbackP]));
        const got = Object.entries(d.received).filter(([, v]) => v > 0);
        const c = el("div", "card"), ttl = el("div", "ttl"); ttl.innerHTML = ICON.grain; ttl.append(el("span", null, d.source === "fallback" ? t.releaseFb : t.release));
        const ch = el("div", "chips"); got.forEach(([a, v]) => ch.append(chip(a, v)));
        c.append(ttl, got.length ? ch : el("div", "sub", t.nobody), el("div", "sub", t.left(d.store)));
        feed.append(c); break;
      }
      case "transfer_result": case "gift_received": case "theft_loss":
        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        {
          const who = e.visible_to[0];
          const txt = e.kind === "gift_received" ? t.giftFrom(who, d.from) : e.kind === "theft_loss" ? t.theftOn(who, d.thief) : t.tResult(who, d.action, d.target, d.success);
          const g = el("div", "god godonly"); g.append(el("div", "tag", `${t.notice} → ${who} · ${t.vis}`), el("div", null, txt)); feed.append(g);
        } break;
      case "truth_transfers": {
        once("ev" + day, () => feed.append(band("dusk", t.evening, [t.eveningP])));
        const rows = Object.entries(d.actions).map(([a, x]) => {
          const ok = d.successful.some(s => s[0] === a);
          const r = el("div", "chips"); r.append(chip(a));
          if (x.action === "none") r.append(el("span", "sub", t.none));
          else { r.append(el("span", null, x.action === "give" ? t.give : t.steal), chip(x.target), el("span", "pill " + (ok ? "ok" : "bad"), ok ? t.ok : t.fail)); }
          return r;
        });
        const acted = Object.values(d.actions).some(x => x.action !== "none");
        const gb = godBox(t.gtTransfer, acted ? rows.filter((_, i) => Object.values(d.actions)[i].action !== "none") : [t.none]);
        notes(gb, day, "TRANSFER", null, Object.keys(d.actions)); feed.append(gb);
        break;
      }
      case "truth_meals": {
        const g = godBox(t.meals, []);
        const ch = el("div", "chips");
        const lastDawn = [...D.events].reverse().find(x => x.kind === "truth_day_start" && x.day === day);
        const living = lastDawn ? ids.filter(a => lastDawn.data.alive[a]) : ids;
        living.forEach(a => { const x = chip(a, null, d.ate.includes(a) ? "yes" : "zero"); x.append(el("span", null, d.ate.includes(a) ? t.ate : t.skipped)); ch.append(x); });
        g.append(ch); notes(g, day, "MEAL", null, living); const nb = band("moon", t.night, []); nb.classList.add("godonly"); feed.append(nb, g); break;
      }
      case "deaths": {
        const lines = [d.died.length ? t.deathP(d.died.join(lang === "zh" ? "、" : ", ")) : t.peace];
        feed.append(band(d.died.length ? "skull" : "moon", t.dusk(day), lines)); break;
      }
      case "truth_day_end":
        feed.append(godBox(t.gtEnd, [stateTable(d), el("div", "mono", `${t.store}: ${d.store}`)])); break;
      case "game_end":
        feed.append(band("flag", t.over, [t.overP(d.survivors)], "end")); break;
      default:
        if (priv) { const g = godBox(e.kind, [JSON.stringify(d)]); feed.append(g); }
        else feed.append(el("div", "sub", `${e.kind}: ${JSON.stringify(d)}`));
    }
  }
}
// Highlight the day whose dawn banner was passed last, and keep its button in view in the strip.
let curDay = null;
function spy() {
  const barBottom = document.querySelector(".bar").getBoundingClientRect().bottom;
  let d = null;
  for (const b of document.querySelectorAll(".feed .band[id^='day-']")) {
    if (b.getBoundingClientRect().top <= barBottom + 48) d = b.id.slice(4); else break;
  }
  if (d === curDay) return;
  curDay = d;
  const strip = document.getElementById("days");
  for (const btn of strip.children) {
    const on = btn.dataset.day === d;
    btn.classList.toggle("cur", on);
    if (on) { btn.setAttribute("aria-current", "true");
      const l = btn.offsetLeft - strip.offsetLeft, r = l + btn.offsetWidth;
      if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = l - (strip.clientWidth - btn.offsetWidth) / 2;
    } else btn.removeAttribute("aria-current");
  }
}
window.addEventListener("scroll", spy, { passive: true });   // one rect read per day banner; cheap enough unthrottled
window.addEventListener("resize", () => { curDay = null; spy(); });
function set(k, v) { if (k === "lang") lang = v; else view = v; try { localStorage.setItem(k === "lang" ? "gr-lang-en" : "gr-view", v); } catch (e) {} render(); }
document.getElementById("v-god").onclick = () => set("view", "god");
document.getElementById("v-pub").onclick = () => set("view", "pub");
document.getElementById("l-zh").onclick = () => set("lang", "zh");
document.getElementById("l-en").onclick = () => set("lang", "en");
document.getElementById("c-why").onchange = () => { try { localStorage.setItem("gr-why", document.getElementById("c-why").checked ? "1" : "0"); } catch (e) {} render(); };
render();
if (!D.finished) window.scrollTo(0, document.body.scrollHeight);
})();
</script>
